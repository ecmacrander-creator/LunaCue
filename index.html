async function importBackupFile(file){
  const text = await file.text();
  let parsed;
  try{
    parsed = JSON.parse(text);
  }catch(e){
    alert("Could not read that file — make sure it's a Hem backup .json file.");
    return;
  }
  if(!Array.isArray(parsed.entries)){
    alert("That file doesn't look like a Hem backup.");
    return;
  }
  if(!confirm(`Import ${parsed.entries.length} entries? This replaces everything currently in the app on this device.`)) return;
  state.entries = parsed.entries || [];
  state.cycleLength = parsed.cycleLength || 28;
  state.cycleAnchor = parsed.cycleAnchor || null;
  state.customSymptoms = parsed.customSymptoms || [];
  state.customMeds = parsed.customMeds || [];
  state.customDailyMeds = parsed.customDailyMeds || [];
  state.migraines = parsed.migraines || {};
  state.medClasses = parsed.medClasses || {};
  state.mCustomTriggers = parsed.mCustomTriggers || [];
  await saveData();
  render();
  alert('Import complete.');
}

// ---------- Sleep import from a spreadsheet (Apple Health exports) ----------
// Takes a .csv/.tsv/.xlsx and puts each night's sleep on the morning you woke
// up — the same day "Sleep last night" means on the Log tab. Handles:
//   • one row per night (Date + Asleep/Hours/Minutes column), e.g. Health
//     Auto Export daily sleep, or a sheet you typed yourself
//   • one row per Health sample (Start, End, Value like Core/Deep/REM/In Bed),
//     e.g. a Shortcuts "Find Health Samples" dump. Overlapping samples from
//     Watch + iPhone are merged so time isn't double-counted.
// Sleep quality and everything else on a day is left alone.

let xlsxLoader = null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(!xlsxLoader){
    xlsxLoader = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = () => resolve(window.XLSX);
      s.onerror = () => { xlsxLoader = null; reject(new Error('xlsx load failed')); };
      document.head.appendChild(s);
    });
  }
  return xlsxLoader;
}

function parseDelimited(text){
  text = text.replace(/^﻿/, '');
  const firstLine = text.split(/\r?\n/)[0] || '';
  const counts = {',': 0, ';': 0, '\t': 0};
  let q = false;
  for(const ch of firstLine){ if(ch === '"') q = !q; else if(!q && ch in counts) counts[ch]++; }
  const delim = Object.keys(counts).sort((a,b) => counts[b]-counts[a])[0];
  const rows = []; let row = [], field = '', inQ = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(inQ){
      if(ch === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else inQ = false; }
      else field += ch;
    } else if(ch === '"') inQ = true;
    else if(ch === delim){ row.push(field); field = ''; }
    else if(ch === '\n' || ch === '\r'){
      if(ch === '\r' && text[i+1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += ch;
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}

async function readSpreadsheetRows(file){
  const name = (file.name || '').toLowerCase();
  if(/\.(xlsx|xlsm|xls|numbers)$/.test(name)){
    if(name.endsWith('.numbers')) throw new Error('numbers');
    const XLSX = await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), {type: 'array', cellDates: true});
    // Use the first sheet that has a sleep-looking header row.
    for(const sn of wb.SheetNames){
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header: 1, raw: true, defval: ''})
        .filter(r => r.some(c => String(c).trim() !== ''));
      if(rows.length > 1 && findSleepHeaderRow(rows) >= 0) return rows;
    }
    const first = wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(first, {header: 1, raw: true, defval: ''});
  }
  return parseDelimited(await file.text());
}

// Returns {y,m,d,h,mi} in local wall-clock time, or null.
function parseDateTimeCell(v){
  if(v === null || v === undefined || v === '') return null;
  if(v instanceof Date && !isNaN(v)) return {y: v.getFullYear(), m: v.getMonth()+1, d: v.getDate(), h: v.getHours(), mi: v.getMinutes()};
  if(typeof v === 'number'){
    // Excel serial date (days since 1899-12-30)
    if(v > 20000 && v < 80000){
      const ms = Math.round((v - 25569) * 86400000);
      const dt = new Date(ms);
      return {y: dt.getUTCFullYear(), m: dt.getUTCMonth()+1, d: dt.getUTCDate(), h: dt.getUTCHours(), mi: dt.getUTCMinutes()};
    }
    return null;
  }
  const t = String(v).trim();
  const ampm = (h, ap) => { if(!ap) return h; ap = ap.toLowerCase(); if(ap === 'pm' && h < 12) return h + 12; if(ap === 'am' && h === 12) return 0; return h; };
  let m;
  if(/Z$/.test(t) && !isNaN(Date.parse(t))){
    const dt = new Date(t);
    return {y: dt.getFullYear(), m: dt.getMonth()+1, d: dt.getDate(), h: dt.getHours(), mi: dt.getMinutes()};
  }
  if((m = t.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})(?:[ T,]+(\d{1,2}):(\d{2})(?::\d{2}(?:\.\d+)?)?\s*([AaPp][Mm])?)?/))){
    return {y: +m[1], m: +m[2], d: +m[3], h: m[4] ? ampm(+m[4], m[6]) : 0, mi: m[5] ? +m[5] : 0};
  }
  if((m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:[ ,T]+(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp][Mm])?)?/))){
    let y = +m[3]; if(y < 100) y += 2000;
    return {y, m: +m[1], d: +m[2], h: m[4] ? ampm(+m[4], m[6]) : 0, mi: m[5] ? +m[5] : 0};
  }
  const ms = Date.parse(t.replace(/ at /i, ' '));
  if(!isNaN(ms)){
    const dt = new Date(ms);
    return {y: dt.getFullYear(), m: dt.getMonth()+1, d: dt.getDate(), h: dt.getHours(), mi: dt.getMinutes()};
  }
  return null;
}
const dtISO = p => `${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`;
const dtMins = p => Date.UTC(p.y, p.m-1, p.d, p.h, p.mi) / 60000;
// A wake-up time after 6pm belongs to the next morning (e.g. a stretch of
// sleep that ends at 11:40pm before you wake again at 6am).
const wakeDateFor = p => p.h >= 18 ? addDays(dtISO(p), 1) : dtISO(p);

function normHeader(h){ return String(h || '').toLowerCase().replace(/[_\[\]]/g, ' ').replace(/\s+/g, ' ').trim(); }

function findSleepHeaderRow(rows){
  for(let i = 0; i < Math.min(rows.length, 10); i++){
    const hs = rows[i].map(normHeader);
    const hasDate = hs.some(h => /date|day|night|start|end|wake|time/.test(h));
    const hasSleep = hs.some(h => /sleep|asleep|in bed|hours|hrs|minutes|duration|value|core|deep|rem/.test(h));
    if(hasDate && hasSleep) return i;
  }
  return -1;
}

// Classifies a Health sleep sample value. HealthKit numeric codes:
// 0 in bed, 1 asleep, 2 awake, 3 core, 4 deep, 5 REM.
function sleepStageKind(v){
  if(v === '' || v === null || v === undefined) return 'asleep';
  const s = String(v).toLowerCase().replace(/[^a-z0-9]/g, '');
  if(/^\d$/.test(s)) return ({0:'inbed', 2:'awake'})[s] || 'asleep';
  if(s.includes('inbed')) return 'inbed';
  if(s.includes('awake')) return 'awake';
  if(/asleep|core|deep|rem|sleep|light/.test(s)) return 'asleep';
  return null;
}

function unionMinutes(intervals){
  const iv = intervals.filter(x => x[1] > x[0]).sort((a,b) => a[0]-b[0]);
  let total = 0, curS = null, curE = null;
  for(const [s,e] of iv){
    if(curE === null || s > curE){ if(curE !== null) total += curE - curS; curS = s; curE = e; }
    else if(e > curE) curE = e;
  }
  if(curE !== null) total += curE - curS;
  return total;
}

// Returns {nights: {dateISO: hours}, mode} or {error}.
function extractSleepNights(rows){
  const hi = findSleepHeaderRow(rows);
  if(hi < 0) return {error: "Couldn't find a header row with a date and a sleep column."};
  const headers = rows[hi].map(normHeader);
  const data = rows.slice(hi + 1);
  const col = re => headers.findIndex(h => re.test(h));
  const notStage = h => !/in bed|inbed|awake|core|deep|rem|start|end|quality|source|unit/.test(h);

  const startCol = col(/^start|\bstart|^from\b|bedtime|bed time/);
  const endCol = headers.findIndex(h => /^end|\bend\b|\bwake|\bwoke|^to$|until/.test(h) && !/awake/.test(h));
  const valueCol = col(/^value$|stage|^type$|category|sleep analysis$|^state$/);

  // Per-night total column ("Asleep (hr)", "Total Sleep", "Hours", "Minutes"…)
  let totalCol = headers.findIndex(h => /asleep|total sleep|hours slept|time asleep/.test(h) && notStage(h));
  if(totalCol < 0) totalCol = headers.findIndex(h => /sleep|duration|^hours?\b|^hrs?\b|minutes|^mins?\b/.test(h) && notStage(h) && !/date|time$/.test(h));
  const stageCols = ['core','deep','rem'].map(k => headers.findIndex(h => new RegExp('\\b'+k+'\\b').test(h) && !/start|end/.test(h))).filter(i => i >= 0);
  const inBedCol = headers.findIndex(h => /in bed|inbed/.test(h) && !/start|end/.test(h));

  const nights = {};
  const valueIsStage = valueCol >= 0 && data.some(r => { const k = sleepStageKind(r[valueCol]); return k && String(r[valueCol]).trim() !== '' && isNaN(Number(r[valueCol])) ; });

  // Mode 1: one row per Health sample (start + end, maybe a stage value).
  if(startCol >= 0 && endCol >= 0 && (totalCol < 0 || valueIsStage)){
    const byNight = {};
    for(const r of data){
      const s = parseDateTimeCell(r[startCol]), e = parseDateTimeCell(r[endCol]);
      if(!s || !e) continue;
      const kind = valueCol >= 0 ? sleepStageKind(r[valueCol]) : 'asleep';
      if(!kind || kind === 'awake') continue;
      const key = wakeDateFor(e);
      (byNight[key] = byNight[key] || {asleep: [], inbed: []})[kind].push([dtMins(s), dtMins(e)]);
    }
    for(const [d, g] of Object.entries(byNight)){
      const mins = g.asleep.length ? unionMinutes(g.asleep) : unionMinutes(g.inbed);
      if(mins > 0 && mins <= 24*60) nights[d] = Math.round(mins/60*100)/100;
    }
    return {nights, mode: 'samples'};
  }

  // Mode 2: one row per night.
  const dateCol = endCol >= 0 ? endCol : col(/date|^day$|night|time/);
  if(dateCol < 0 || (totalCol < 0 && !stageCols.length && inBedCol < 0)) return {error: "Couldn't tell which column has the date and which has the sleep amount."};
  const unitFor = c => { const h = c >= 0 ? headers[c] : ''; return /min/.test(h) ? 'min' : (/hr|hour/.test(h) ? 'hr' : ''); };
  const toHours = (v, c) => {
    if(v === '' || v === null || v === undefined) return null;
    if(v instanceof Date) return v.getHours() + v.getMinutes()/60; // a time-formatted cell like 7:25
    const unit = unitFor(c);
    const n = Number(String(v).replace(/,/g, '').trim());
    if(!isNaN(n) && String(v).trim() !== ''){
      if(unit === 'min') return n/60;
      if(unit === 'hr') return n;
      if(typeof v === 'number' && n > 0 && n < 1) return n*24; // Excel duration stored as a fraction of a day
      return n > 24 ? n/60 : n;
    }
    return parseSleepHours(v);
  };
  for(const r of data){
    const p = parseDateTimeCell(r[dateCol]);
    if(!p) continue;
    const key = dateCol === endCol ? wakeDateFor(p) : dtISO(p);
    let h = totalCol >= 0 ? toHours(r[totalCol], totalCol) : null;
    if(!h){
      const stages = stageCols.map(c => toHours(r[c], c)).filter(x => x);
      if(stages.length) h = stages.reduce((a,b) => a+b, 0);
    }
    if(!h && inBedCol >= 0) h = toHours(r[inBedCol], inBedCol);
    if(!h || h <= 0 || h > 24) continue;
    nights[key] = Math.round(((nights[key] || 0) + h) * 100) / 100;
  }
  return {nights, mode: 'daily'};
}

async function importSleepFile(file){
  let rows;
  try{ rows = await readSpreadsheetRows(file); }
  catch(e){
    if(e.message === 'numbers') alert('Numbers files can\'t be read directly. In Numbers, use Share › Export › CSV, then import that.');
    else alert("Couldn't open that spreadsheet. Try saving it as a .csv and importing again.");
    return;
  }
  const result = extractSleepNights(rows);
  if(result.error){ alert(result.error + '\n\nThe sheet needs a date column and a sleep column (hours, minutes, or start/end times).'); return; }

  const today = todayISO();
  const dates = Object.keys(result.nights).filter(d => d <= today).sort();
  if(!dates.length){ alert("Didn't find any sleep values in that file."); return; }

  let added = 0, updated = 0, same = 0;
  for(const d of dates){
    const e = state.entries.find(x => x.date === d);
    if(!e || e.sleepHours === undefined || e.sleepHours === null) added++;
    else if(Math.abs(Number(e.sleepHours) - result.nights[d]) < 0.02) same++;
    else updated++;
  }
  if(!added && !updated){ alert(`All ${same} night${same===1?'':'s'} in that file already match what's in Hem. Nothing to change.`); return; }
  const counts = [
    added ? `• ${added} day${added===1?'':'s'} get sleep added` : '',
    updated ? `• ${updated} day${updated===1?'':'s'} will be updated (different from what's there now)` : '',
    same ? `• ${same} already match` : ''
  ].filter(Boolean).join('\n');
  const msg = `Found sleep for ${dates.length} night${dates.length===1?'':'s'}, ${fmtDate(dates[0])} – ${fmtDate(dates[dates.length-1])}.\n\n${counts}\n\nEach night goes on the morning you woke up, same as "Sleep last night." Nothing else on those days changes.\n\nImport?`;
  if(!confirm(msg)) return;

  for(const d of dates){
    const hours = result.nights[d];
    const e = state.entries.find(x => x.date === d);
    if(e) e.sleepHours = hours;
    // Days you haven't logged get a sleep-only entry, flagged so it doesn't
    // count as a logged day for reminders or the default cycle day 1. Logging
    // anything on that day later turns it into a normal entry.
    else state.entries.push({date: d, symptoms: [], meds: [], severity: {}, notes: '', sleepHours: hours, sleepImported: true});
  }
  state.entries.sort((a,b) => a.date < b.date ? 1 : -1);
  const ok = await saveData();
  render();
  alert(ok ? `Sleep imported for ${added + updated} day${added+updated===1?'':'s'}.` : 'Could not save on this device — check the storage warning above.');
}
function isLoggedEntry(e){ return !e.sleepImported; }

function renderStorageBanner(){
  if(storageAvailable) return '';
  return '<div class="banner">This browser is blocking on-device storage (common in private/incognito mode), so entries won\'t save between visits. Try opening this file in a normal Safari tab.</div>';
}

      ${noSymToggle}
      ${symptomGroups}
      <label class="field-label">Add new symptoms</label>
      <input type="text" id="other-input" placeholder="e.g. dizziness, dry mouth" value="${escapeHtml(f.other)}">
      <div class="hint">Separate multiple with commas — each becomes its own option, added permanently. Tap the × on a custom chip above to remove it later.</div>

      ${severitySection}

      ${dailySection}

      <label class="field-label">Symptom-relief meds taken</label>
      <div class="symptom-grid">${medChips}</div>
      ${medTimeSection}
      <label class="field-label">Add new meds</label>
      <input type="text" id="other-meds-input" placeholder="e.g. melatonin, magnesium" value="${escapeHtml(f.otherMeds)}">
      <div class="hint">Same as above — separate multiple with commas.</div>

      ${sleepSection}

      <label class="field-label">Notes</label>
      <textarea id="notes-input" placeholder="Anything else worth remembering">${escapeHtml(f.notes)}</textarea>
      <button class="primary ${state.justSaved ? 'saved' : ''}" id="save-btn">${state.justSaved ? '&#10003; Saved' : (state.editing ? 'Update entry' : 'Save entry')}</button>
      ${!state.editing ? `<button type="button" class="secondary-btn mt" id="clean-day-btn">${isToday ? 'No symptoms today' : 'No symptoms this day'}</button>
      <div class="hint" style="text-align:center;">One tap saves it. Any meds or sleep filled in above are saved too.</div>` : ''}
    </div>
    <p class="footer-note">Entries save right on this device — nothing leaves your phone.</p>
  `;
}

function renderHistory(){
  if(state.entries.length === 0){
    return `
      ${renderStorageBanner()}
      <div class="empty-state">
        <h3>No entries yet</h3>
        <p>Log today's symptoms and they'll show up here.</p>
      </div>
    `;
  }
  const symptomMap = {};
  allSymptoms().forEach(s => symptomMap[s.id] = s);
  const medMap = {};
  allMeds().forEach(m => medMap[m.id] = m);
  const dailyMap = {};
  allDailyMeds().forEach(m => dailyMap[m.id] = m);

  // Options for the month/day filters, built from what's actually logged.
  const monthsPresent = [...new Set(state.entries.map(e => e.date.slice(0,7)))].sort().reverse();
  const daysPresent = [...new Set(state.entries.map(e => Number(e.date.slice(8,10))))].sort((a,b)=>a-b);
  const monthOptions = monthsPresent.map(m => {
    const label = new Date(Number(m.slice(0,4)), Number(m.slice(5,7))-1, 1).toLocaleDateString(undefined, {month:'long', year:'numeric'});
    return `<option value="${m}" ${state.historyMonth===m?'selected':''}>${label}</option>`;
  }).join('');
  const dayOptions = daysPresent.map(d => `<option value="${d}" ${Number(state.historyDay)===d?'selected':''}>${d}</option>`).join('');

  const filterBar = `
    <div class="card" style="padding:10px 12px;margin-bottom:14px;">
      <input type="text" id="history-search" placeholder="Search symptoms, meds, or notes" value="${escapeHtml(state.historyFilter)}">
      <div class="history-filter-row">
        <select id="history-month-filter">
          <option value="">All months</option>
          ${monthOptions}
        </select>
        <select id="history-day-filter">
          <option value="">All days</option>
          ${dayOptions}
        </select>
        <button id="history-sort-toggle" class="link-btn" type="button">${state.historySort === 'cycleDay' ? 'Sorted by cycle day' : 'Sort by cycle day'}</button>
      </div>
    </div>
  `;

  const filterText = state.historyFilter.trim().toLowerCase();
  let entries = state.entries.filter(e => {
    if(state.historyMonth && e.date.slice(0,7) !== state.historyMonth) return false;
    if(state.historyDay && Number(e.date.slice(8,10)) !== Number(state.historyDay)) return false;
    if(!filterText) return true;
    const symptomLabels = (e.symptoms||[]).map(id => symptomMap[id]?.label || '').join(' ').toLowerCase();
    const medLabels = (e.meds||[]).map(id => medMap[id]?.label || '').join(' ').toLowerCase();
    const notes = (e.notes||'').toLowerCase();
    const dateStr = fmtDate(e.date).toLowerCase();
    return symptomLabels.includes(filterText) || medLabels.includes(filterText) || notes.includes(filterText) || dateStr.includes(filterText);
  });

  if(state.historySort === 'cycleDay'){
    entries = [...entries].sort((a,b) => cycleDayFor(a.date) - cycleDayFor(b.date) || (a.date < b.date ? 1 : -1));
  }

  if(entries.length === 0){
    return `
      ${renderStorageBanner()}
      ${filterBar}
      <div class="empty-state">
        <h3>No matches</h3>
        <p>Nothing logged matches these filters.</p>
      </div>
    `;
  }

  let html = renderStorageBanner() + filterBar;
  let lastGroup = '';
  for(const e of entries){
    const groupKey = state.historySort === 'cycleDay' ? `Cycle day ${cycleDayFor(e.date)}` : fmtMonthHeader(e.date);
    if(groupKey !== lastGroup){
      html += `<div class="month-header">${groupKey}</div>`;
      lastGroup = groupKey;
    }
    const tags = (e.symptoms||[]).map(id => {
      const s = symptomMap[id];
      if(!s) return '';
      const sev = (e.severity||{})[id];
      const sevBadge = sev ? ` <span class="sev-dot" title="${sev}">${SEVERITY_DOTS[sev]}</span>` : '';
      return `<span class="tag" style="background:${s.color}">${escapeHtml(s.label)}${sevBadge}</span>`;
    }).join('');
    const medTags = (e.meds || []).map(id => {
      const m = medMap[id];
      return m ? `<span class="tag" style="background:${m.color}">${escapeHtml(m.label)}</span>` : '';
    }).join('');
    const isClean = isSymptomFree(e);
    const medTagsTimed = (e.meds || []).map(id => {
      const m = medMap[id];
      const t = (e.medTimes||{})[id];
      return m ? `<span class="tag" style="background:${m.color}">${escapeHtml(m.label)}${t ? ' ' + fmtTime(t) : ''}</span>` : '';
    }).join('');
    const metaBits = [];
    Object.keys(e.medTiming||{}).forEach(id => {
      const label = (dailyMap[id] && dailyMap[id].label) || id;
      metaBits.push(`<b>${escapeHtml(label)}:</b> ${timingLabel(e.medTiming[id])}`);
    });
    if(vyvanseStatus(e.date, e.vyvanse) === 'no') metaBits.push(`<b>Vyvanse:</b> Not taken`);
    else if(e.date < VYVANSE_START && e.vyvanse === 'yes') metaBits.push(`<b>Vyvanse:</b> Taken`);
    Object.keys(e.painLocation||{}).forEach(id => {
      const label = (symptomMap[id] && symptomMap[id].label) || id;
      metaBits.push(`<b>${escapeHtml(label)}:</b> ${painLabels(e.painLocation[id]).join(', ')}`);
    });
    if(e.sleepHours !== undefined && e.sleepHours !== null || e.sleepQuality){
      const parts = [];
      if(e.sleepHours !== undefined && e.sleepHours !== null) parts.push(fmtSleep(e.sleepHours));
      if(e.sleepQuality) parts.push(e.sleepQuality);
      metaBits.push(`<b>Sleep:</b> ${parts.join(', ')}`);
    }

    const cycleDay = cycleDayFor(e.date);

    html += `
      <div class="entry-row">
        <div class="top">
          <div><span class="date">${fmtDate(e.date)}</span><span class="weekday">${fmtWeekday(e.date)}</span><span class="cycle-day">day ${cycleDay}</span></div>
          <div>
            ${isMigraineDay(e) ? `<button class="del" data-m-open="${e.date}">migraine</button>` : ''}
            <button class="del" data-edit="${e.date}">edit</button>
            <button class="del" data-del="${e.date}">delete</button>
          </div>
        </div>
        <div class="tags">${tags || (isClean ? '<span class="tag" style="background:var(--sage)">No symptoms</span>' : '')}</div>
        ${medTagsTimed ? `<div class="tags" style="margin-top:2px;"><span style="font-size:11px;color:var(--ink-soft);margin-right:4px;align-self:center;">Took:</span>${medTagsTimed}</div>` : ''}
        ${metaBits.length ? `<div class="entry-meta">${metaBits.join(' · ')}</div>` : ''}
        ${e.notes ? `<div class="notes">${escapeHtml(e.notes)}</div>` : ''}
      </div>
    `;
  }
  return html;
}

function renderPatterns(){
  if(state.entries.length < 3){
    return `
      ${renderStorageBanner()}
      <div class="empty-state">
        <h3>Not enough data yet</h3>
        <p>Log at least a few days — patterns start to show once you have some history.</p>
      </div>
      ${renderDoctorCard()}
      <div class="card">
        <span class="section-label">Backup &amp; export</span>
        <button class="secondary-btn" id="export-backup-btn">Download backup (.json)</button>
        <button class="secondary-btn" id="export-csv-btn">Export as spreadsheet (.csv)</button>
        <button class="secondary-btn" id="import-backup-btn">Restore from backup</button>
        <button class="secondary-btn" id="import-sleep-btn">Import sleep from spreadsheet</button>
        <input type="file" id="import-sleep-input" accept=".csv,.tsv,.txt,.xlsx,.xls,text/csv,text/tab-separated-values,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="display:none;">
        <input type="file" id="import-file-input" accept="application/json" style="display:none;">
        <p style="font-size:11.5px;color:var(--ink-soft);margin:10px 0 0;">
          Moving to a new device or a new version of this app? Restore your backup file here.
        </p>
      </div>
    `;
  }

  const rings = allSymptoms();
  const cycleLength = state.cycleLength;
  const sortedByDate = [...state.entries].sort((a,b) => a.date < b.date ? -1 : 1);
  const earliestEntryDate = sortedByDate[0].date;
  const anchor = getAnchorDate();

  const cx = 170, cy = 170, innerR = 46, outerR = 160;
  const spacing = (outerR - innerR) / rings.length;

  let ringsSvg = '';
  rings.forEach((r, i) => {
    ringsSvg += `<circle cx="${cx}" cy="${cy}" r="${innerR + spacing*i}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  });
  ringsSvg += `<circle cx="${cx}" cy="${cy}" r="${outerR}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  ringsSvg += `<line x1="${cx}" y1="${cy-innerR}" x2="${cx}" y2="${cy-outerR}" stroke="var(--line)" stroke-width="1"/>`;
  const midDay = Math.round(cycleLength/2);
  ringsSvg += `<line x1="${cx}" y1="${cy+innerR}" x2="${cx}" y2="${cy+outerR}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2,3"/>`;

  const counts = {};
  rings.forEach(r => counts[r.id] = 0);
  const medCounts = {};
  allMeds().forEach(m => medCounts[m.id] = 0);
  const symptomDayIdxs = {};

  let dotsSvg = '';
  for(const e of state.entries){
    const raw = daysBetween(anchor, e.date) % cycleLength;
    const dayIdx = ((raw % cycleLength) + cycleLength) % cycleLength;
    const angle = (dayIdx / cycleLength) * 2 * Math.PI - Math.PI/2;
    e.symptoms.forEach(id => {
      const ringIndex = rings.findIndex(r => r.id === id);
      if(ringIndex === -1) return;
      counts[id] = (counts[id] || 0) + 1;
      (symptomDayIdxs[id] = symptomDayIdxs[id] || []).push(dayIdx);
      const rad = innerR + spacing * (ringIndex + 0.5);
      const x = cx + rad * Math.cos(angle);
      const y = cy + rad * Math.sin(angle);
      const color = rings[ringIndex].color;
      dotsSvg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.2" fill="${color}" fill-opacity="0.82" stroke="var(--card)" stroke-width="0.8"/>`;
    });
    (e.meds || []).forEach(id => {
      medCounts[id] = (medCounts[id] || 0) + 1;
    });
  }

  const svg = `
    <svg viewBox="0 0 340 340" width="300" height="300">
      ${ringsSvg}
      ${dotsSvg}
      <text x="${cx}" y="${cy-4}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="var(--ink)">${cycleLength}-day</text>
      <text x="${cx}" y="${cy+11}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="var(--ink-soft)">cycle</text>
      <text x="${cx}" y="${cy-outerR-8}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--ink-soft)">day 1</text>
      <text x="${cx}" y="${cy+outerR+16}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--ink-soft)">day ${midDay+1}</text>
    </svg>
  `;

  const legend = rings.map(r => `
    <div class="legend-row">
      <span class="dot" style="background:${r.color}"></span>
      <span>${r.label}</span>
      <span class="count">${counts[r.id] || 0}</span>
    </div>
  `).join('');

  // --- Insights: plain-language summary of what's in the data so far.
  // Kept descriptive, not diagnostic — useful things to bring up with a doctor.
  const spanDays = daysBetween(earliestEntryDate, sortedByDate[sortedByDate.length-1].date) + 1;
  const cleanDayCount = state.entries.filter(isSymptomFree).length;
  const topSymptoms = rings
    .map(r => ({label: r.label, n: counts[r.id] || 0}))
    .filter(x => x.n > 0)
    .sort((a,b) => b.n - a.n)
    .slice(0, 3);
  const topMeds = allMeds()
    .map(m => ({label: m.label, n: medCounts[m.id] || 0}))
    .filter(x => x.n > 0)
    .sort((a,b) => b.n - a.n)
    .slice(0, 3);

  const severeCounts = {};
  for(const e of state.entries){
    Object.entries(e.severity || {}).forEach(([id, level]) => {
      if(level !== 'severe') return;
      severeCounts[id] = (severeCounts[id]||0) + 1;
    });
  }
  const topSevere = Object.entries(severeCounts)
    .map(([id, n]) => ({label: (rings.find(r=>r.id===id)||{}).label || id, n}))
    .sort((a,b) => b.n - a.n)
    .slice(0, 3);

  let clusterNote = '';
  if(topSymptoms.length){
    const topId = rings.find(r => r.label === topSymptoms[0].label)?.id;
    const idxs = symptomDayIdxs[topId] || [];
    if(idxs.length >= 3){
      const bucketSize = Math.max(1, Math.round(cycleLength/4));
      const bucketCounts = {};
      idxs.forEach(d => { const b = Math.floor(d/bucketSize); bucketCounts[b] = (bucketCounts[b]||0)+1; });
      const buckets = Object.entries(bucketCounts).sort((a,b) => b[1]-a[1]);
      const [topBucket, topBucketCount] = buckets[0];
      if(topBucketCount / idxs.length >= 0.5){
        const startDay = Number(topBucket)*bucketSize + 1;
        const endDay = Math.min(cycleLength, startDay + bucketSize - 1);
        clusterNote = `<li>${escapeHtml(topSymptoms[0].label)} shows up most often around days ${startDay}–${endDay} of your ${cycleLength}-day cycle in the data so far.</li>`;
      }
    }
  }

  const insightsList = `
    <li>${state.entries.length} day${state.entries.length===1?'':'s'} logged over ${spanDays} day${spanDays===1?'':'s'}, starting ${fmtDate(earliestEntryDate)}.</li>
    ${cleanDayCount ? `<li>${cleanDayCount} day${cleanDayCount===1?'':'s'} logged as no symptoms.</li>` : ''}
    ${topSymptoms.length ? `<li>Most logged symptom${topSymptoms.length>1?'s':''}: ${topSymptoms.map(s=>`${escapeHtml(s.label)} (${s.n})`).join(', ')}.</li>` : ''}
    ${topMeds.length ? `<li>Most taken med${topMeds.length>1?'s':''}: ${topMeds.map(m=>`${escapeHtml(m.label)} (${m.n})`).join(', ')}.</li>` : ''}
    ${topSevere.length ? `<li>Logged as severe: ${topSevere.map(s=>`${escapeHtml(s.label)} (${s.n})`).join(', ')}.</li>` : ''}
    ${clusterNote}
  `;

  // --- Timing table: each symptom's/med's occurrences by cycle day + month.
  const timingRows = computeCycleTimingRows(rings, 'symptoms');
  const medTimingRows = computeCycleTimingRows(allMeds(), 'meds');

  // --- Co-occurrence: which symptom pairs tend to land on the same day.
  const pairCounts = computeCooccurrence(rings);
  const symptomLabelMap = {};
  rings.forEach(r => symptomLabelMap[r.id] = r);
  const topPairs = Object.entries(pairCounts)
    .filter(([,n]) => n >= 2)
    .sort((a,b) => b[1]-a[1])
    .slice(0, 5)
    .map(([key, n]) => {
      const [idA, idB] = key.split('|');
      return {a: symptomLabelMap[idA], b: symptomLabelMap[idB], n};
    })
    .filter(p => p.a && p.b);

  return `
    ${renderStorageBanner()}
    <div class="card">
      <span class="section-label">Assumed cycle length</span>
      <div class="cycle-input-row">
        <input type="number" id="cycle-input" value="${cycleLength}" min="14" max="90">
        <span>days — adjust to match your pill pack or what feels right</span>
      </div>

      <span class="section-label">Cycle day 1</span>
      <div class="cycle-input-row">
        <input type="date" id="anchor-input" value="${anchor}" max="${todayISO()}">
        <span>${state.cycleAnchor ? 'set manually' : `defaults to your first entry (${fmtDate(earliestEntryDate)})`}</span>
      </div>
      ${state.cycleAnchor ? `<button id="reset-anchor-btn" class="link-btn" style="margin:-10px 0 16px;">Use first entry instead</button>` : ''}

      ${(() => {
        const suggestion = suggestCycleParams();
        if(!suggestion || suggestion.needMoreData) return `<p style="font-size:11.5px;color:var(--ink-soft);margin:-6px 0 16px;">Log symptom days spanning about 8 weeks and this can suggest a cycle length and day 1 for you, based on when symptoms tend to repeat — useful since birth control doesn't give you a real cycle to anchor on. Keep going.</p>`;
        if(suggestion.confidence < 0.25){
          return `<p style="font-size:11.5px;color:var(--ink-soft);margin:-6px 0 16px;">Checked for a repeating rhythm in your ${suggestion.dataPoints} symptom days, but nothing stands out yet — could mean there isn't a strong cycle, or just needs more data. Keep logging.</p>`;
        }
        const strength = suggestion.confidence >= 0.45 ? 'a fairly clear' : 'a rough';
        return `
          <div class="banner nudge" style="margin:-6px 0 16px;">
            Based on ${suggestion.dataPoints} symptom days, there's ${strength} repeating pattern roughly every <strong>${suggestion.cycleLength} days</strong>, with symptoms tending to start around <strong>${fmtDate(suggestion.anchorDate)}</strong>-ish in that rhythm.
            <br><button id="apply-suggested-cycle-btn" class="link-btn" data-length="${suggestion.cycleLength}" data-anchor="${suggestion.anchorDate}" style="margin-top:6px;">Use this cycle length &amp; day 1</button>
          </div>
        `;
      })()}

      <div class="wheel-wrap">${svg}</div>
      <p style="font-size:12.5px;color:var(--ink-soft);text-align:center;margin:10px 0 0;">
        Each dot is a day a symptom was logged, placed by where that day fell in the cycle above.
        Dots clustering around the same angle across rings hint at a cyclical pattern.
      </p>
      <div class="legend">${legend}</div>
    </div>

    <div class="card">
      <span class="section-label">Timing across months</span>
      ${(timingRows.length || medTimingRows.length) ? `
        ${timingRows.length ? `
          <div class="timing-group-label">Symptoms</div>
          <div class="timing-table">
            ${timingRows.map(r => `
              <div class="timing-row">
                <div class="timing-row-label">
                  <span class="dot" style="background:${r.symptom.color}"></span>${escapeHtml(r.symptom.label)}
                </div>
                <div class="timing-occs">
                  ${r.occ.map(o => `<span class="timing-chip">Day ${o.day} <span class="timing-chip-month">${fmtMonthShort(o.date)}</span></span>`).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        ` : ''}
        ${medTimingRows.length ? `
          <div class="timing-group-label">Meds</div>
          <div class="timing-table">
            ${medTimingRows.map(r => `
              <div class="timing-row">
                <div class="timing-row-label">
                  <span class="dot" style="background:${r.symptom.color}"></span>${escapeHtml(r.symptom.label)}
                </div>
                <div class="timing-occs">
                  ${r.occ.map(o => `<span class="timing-chip">Day ${o.day} <span class="timing-chip-month">${fmtMonthShort(o.date)}</span></span>`).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        ` : ''}
        <p style="font-size:11.5px;color:var(--ink-soft);margin:10px 0 0;">
          Each chip is one occurrence, showing where it fell in your ${cycleLength}-day cycle. Chips clustered on close-together day numbers across different months point to a cyclical pattern.
        </p>
      ` : `<p style="font-size:13px;color:var(--ink-soft);margin:0;">Not enough repeats yet — once something shows up on 2+ different days, it'll appear here so you can compare timing across months.</p>`}
    </div>

    <div class="card">
      <span class="section-label">What the data shows so far</span>
      <ul style="margin:0;padding-left:18px;font-size:13.5px;line-height:1.6;color:var(--ink);">
        ${insightsList}
      </ul>
      <p style="font-size:11.5px;color:var(--ink-soft);margin:10px 0 0;">
        These are just counts and patterns from what you've logged — worth bringing up with your doctor, not a diagnosis.
      </p>
    </div>

    ${renderSuggestionsCard(rings, symptomDayIdxs, pairCounts, cycleLength)}

    <div class="card">
      <span class="section-label">Symptoms that show up together</span>
      ${topPairs.length ? `
        <ul style="margin:0;padding-left:18px;font-size:13.5px;line-height:1.7;color:var(--ink);">
          ${topPairs.map(p => `<li>${escapeHtml(p.a.label)} + ${escapeHtml(p.b.label)} — ${p.n} day${p.n===1?'':'s'} together</li>`).join('')}
        </ul>
      ` : `<p style="font-size:13px;color:var(--ink-soft);margin:0;">Not enough overlap yet — keep logging and pairs will show up here.</p>`}
    </div>

    ${renderDoctorCard()}
    <div class="card">
      <span class="section-label">Backup &amp; export</span>
      <button class="secondary-btn" id="export-backup-btn">Download backup (.json)</button>
      <button class="secondary-btn" id="export-csv-btn">Export as spreadsheet (.csv)</button>
      <button class="secondary-btn" id="import-backup-btn">Restore from backup</button>
        <button class="secondary-btn" id="import-sleep-btn">Import sleep from spreadsheet</button>
        <input type="file" id="import-sleep-input" accept=".csv,.tsv,.txt,.xlsx,.xls,text/csv,text/tab-separated-values,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="display:none;">
      <input type="file" id="import-file-input" accept="application/json" style="display:none;">
      <p style="font-size:11.5px;color:var(--ink-soft);margin:10px 0 0;">
        The backup file is the only way to move your entries to a new device or a new version of this app — keep a copy somewhere safe (Files, email to yourself, iCloud).
      </p>
    </div>

    <p class="footer-note">First entry logged: ${fmtDate(earliestEntryDate)}.
      <button id="clear-data-btn">Clear all data</button>
    </p>
  `;
}

// =====================================================================
// Migraine tab ("Brainstorm")
// Every Hem day with Migraine checked is a migraine day — nothing is copied.
// This tab stores only the extra migraine answers, keyed by that day's date
// (state.migraines[date]). Meds, med times, sleep, Hem severity and cycle day
// are read live from the Hem entry, so editing the Hem day updates the tab.
// =====================================================================
const M_QUALITY = ['Throbbing or pulsing','Pressing or tight','Stabbing or sharp','Dull ache','Burning'];
const M_PLACES = ['Home','Work','Car','Outdoors','Store or errands','Restaurant','Kids activity','Traveling'];
const M_AURA = ['Visual aura (zigzags, sparkles, blind spots)','Tingling or numbness','Trouble speaking'];
const M_SYMPTOMS = ['Nausea','Vomiting','Light sensitivity','Sound sensitivity','Smell sensitivity','Dizziness','Neck pain or stiffness','Fatigue','Brain fog','Worse with movement'];
const M_TRIGGERS = [

// Pain-reliever classes. "ten" and "simple" are the groups neurologists use to
// watch for medication-overuse headache (10+ / 15+ days a month).
const MED_CLASSES = [
  {id:'triptan', label:'Triptan', grp:'ten'},
  {id:'combo', label:'Combination (Excedrin, Fioricet)', grp:'ten'},
  {id:'opioid', label:'Opioid', grp:'ten'},
  {id:'ergot', label:'Ergot (DHE)', grp:'ten'},

  {id:'aspirin', label:'Aspirin', grp:'simple'},
  {id:'gepant', label:'Gepant (Nurtec, Ubrelvy)', grp:'acute'},
  {id:'antiemetic', label:'Anti-nausea', grp:'other'},

];
const M_RANGES = [

];

function guessMedClass(label){
  const t = String(label||'').toLowerCase();
  if(/treximet|excedrin|fioricet|fiorinal|butalbital/.test(t)) return 'combo';
  if(/triptan|imitrex|maxalt|relpax|zomig|amerge|frova|axert/.test(t)) return 'triptan';
  if(/nurtec|ubrelvy|zavzpret|gepant/.test(t)) return 'gepant';
  if(/ibuprofen|advil|motrin|naproxen|aleve|celecoxib|celebrex|ketorolac|toradol|meloxicam|diclofenac|cambia|nsaid/.test(t)) return 'nsaid';
  if(/tylenol|acetaminophen|paracetamol/.test(t)) return 'acet';
  if(/aspirin|bayer/.test(t)) return 'aspirin';
  if(/oxycodone|hydrocodone|codeine|tramadol|norco|percocet|vicodin/.test(t)) return 'opioid';
  if(/\bdhe\b|dihydroergot|ergotamine|cafergot|migranal/.test(t)) return 'ergot';
  if(/zofran|ondansetron|reglan|metoclopramide|compazine|prochlorperazine|phenergan|promethazine/.test(t)) return 'antiemetic';
  return 'other';
}
function medLabelM(id){ const m = allMeds().find(x => x.id === id); return m ? m.label : id; }
function medClassOf(id){ return (state.medClasses && state.medClasses[id]) || guessMedClass(medLabelM(id)); }
function medGrp(id){ const c = MED_CLASSES.find(x => x.id === medClassOf(id)); return c ? c.grp : 'other'; }
function isPainReliever(id){ return ['ten','simple','acute'].includes(medGrp(id)); }

function entryFor(date){ return state.entries.find(e => e.date === date) || null; }
function isMigraineDay(e){ return !!e && (e.symptoms||[]).includes('migraine'); }
function migraineDates(){ return state.entries.filter(isMigraineDay).map(e => e.date).sort().reverse(); }

function blankMigraine(date){
  const e = entryFor(date);
  const prev = state.migraines[addDays(date, -1)];
  return {
    date, continued: !!(prev && prev.ongoingNextDay && isMigraineDay(entryFor(addDays(date,-1)))),
    startTime:'', endTime:'', ongoingNextDay:false, reliefTime:'', reliefLevel:'',
    pain:null, regions:[], quality:[], places:[], placeOther:'', aura:[],
    symptoms: (e && (e.symptoms||[]).includes('nausea')) ? ['Nausea'] : [],
    triggers:[], medsExcluded:[], medHelped:{}, impact:[], hoursLost:'', notes:'',
    weather:null, reviewed:false
  };
}
function migraineFor(date){
  const base = blankMigraine(date);
  const saved = state.migraines[date];
  return saved ? {...base, ...saved} : base;
}
function hhmmNow(){ const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function toMin(hhmm){ if(!hhmm) return null; const [h,m] = hhmm.split(':').map(Number); return h*60 + m; }
function dtOf(date, hhmm){ const [y,mo,d] = date.split('-').map(Number); const [h,mi] = (hhmm||'12:00').split(':').map(Number); return new Date(y, mo-1, d, h, mi); }
function fmtMins(mins){
  if(mins === null || mins === undefined || isNaN(mins)) return '';
  mins = Math.round(mins);
  const h = Math.floor(mins/60), m = mins % 60;
  if(!h) return `${m}m`;
  return m ? `${h}h ${m}m` : `${h}h`;
}
function median(arr){ if(!arr.length) return null; const s = [...arr].sort((a,b)=>a-b); const k = Math.floor(s.length/2); return s.length % 2 ? s[k] : (s[k-1]+s[k])/2; }
function sevToPain(sev){ return ({mild:3, moderate:6, severe:9})[sev] || null; }
function dayPain(date){
  const m = state.migraines[date];
  if(m && m.pain !== null && m.pain !== undefined) return m.pain;
  const e = entryFor(date);
  return sevToPain(e && (e.severity||{}).migraine) || 5;
}
// One plum ramp, light to dark, for the 0–10 scale and the calendar.
function painBg(n){ return `color-mix(in srgb, #6B4C6B ${Math.round(10 + n*8.5)}%, #F3EEE6)`; }
function painInk(n){ return n >= 5 ? '#fff' : 'var(--ink)'; }
function painRGB(n){
  const p = (10 + n*8.5)/100, a = [107,76,107], b = [243,238,230];
  return a.map((v,i) => Math.round(v*p + b[i]*(1-p)));
}

// Meds from the Hem entry, with this tab's include/helped answers.
function migraineMeds(date, m){
  const e = entryFor(date);
  if(!e) return [];
  const daily = new Set(allDailyMeds().map(x => x.id));
  return (e.meds||[]).filter(id => !daily.has(id)).map(id => ({
    id, label: medLabelM(id), time: (e.medTimes||{})[id] || '',
    included: !(m.medsExcluded||[]).includes(id), helped: (m.medHelped||{})[id] || ''
  })).sort((a,b) => (a.time||'99') < (b.time||'99') ? -1 : 1);
}

// Days chained with "continued from yesterday" count as one migraine episode.
function groupEpisodes(datesAsc){
  const eps = [];
  datesAsc.forEach(d => {
    const m = migraineFor(d);
    const last = eps[eps.length-1];
    if(last && m.continued && last.dates[last.dates.length-1] === addDays(d,-1)) last.dates.push(d);
    else eps.push({dates:[d]});
  });
  eps.forEach(ep => {
    const first = migraineFor(ep.dates[0]);
    const lastD = ep.dates[ep.dates.length-1];
    const last = migraineFor(lastD);
    ep.start = first.startTime ? dtOf(ep.dates[0], first.startTime) : null;
    let end = null;
    if(last.endTime) end = dtOf(lastD, last.endTime);
    else if(last.reliefLevel === 'complete' && last.reliefTime) end = dtOf(lastD, last.reliefTime);
    ep.end = end;
    ep.mins = (ep.start && ep.end && ep.end > ep.start) ? (ep.end - ep.start)/60000 : null;
  });
  return eps;
}

// Pain-reliever days across ALL Hem days (overuse counts every use, not only migraine days).
function rescueCounts(startISO, endISO){
  const any = new Set(), ten = new Set(), simple = new Set();
  state.entries.forEach(e => {
    if(e.date < startISO || e.date > endISO) return;
    (e.meds||[]).forEach(id => {
      const g = medGrp(id);
      if(g === 'ten'){ ten.add(e.date); any.add(e.date); }
      else if(g === 'simple'){ simple.add(e.date); any.add(e.date); }
      else if(g === 'acute') any.add(e.date);
    });
  });
  const both = new Set([...ten, ...simple]);
  let status = 'ok';
  if(ten.size >= 10 || simple.size >= 15 || (both.size >= 10 && ten.size && simple.size)) status = 'over';
  else if(ten.size >= 7 || simple.size >= 11 || (both.size >= 7 && ten.size && simple.size)) status = 'warn';
  return {any:any.size, ten:ten.size, simple:simple.size, status};
}
const RESCUE_STATUS = {ok:'Low', warn:'Getting close', over:'Overuse range'};

// ---------- Weather (Open-Meteo, no account needed) ----------
async function migraineCoords(){
  if(navigator.geolocation){
    try{
      const p = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, {timeout:9000, maximumAge:6*3600000}));
      state.mLoc = {lat:+p.coords.latitude.toFixed(2), lon:+p.coords.longitude.toFixed(2)};
      saveData();
      return state.mLoc;
    }catch(e){}
  }
  if(state.mLoc) return state.mLoc;
  throw new Error('location');
}
const WX_CODES = [[0,'Clear'],[3,'Cloudy'],[48,'Fog'],[57,'Drizzle'],[67,'Rain'],[77,'Snow'],[82,'Showers'],[86,'Snow showers'],[99,'Thunderstorms']];
function wxLabel(code){ if(code === null || code === undefined) return ''; if(code === 1 || code === 2) return 'Partly cloudy'; const f = WX_CODES.find(([c]) => code <= c); return f ? f[1] : ''; }
async function fetchMigraineWeather(date, hhmm, coords){
  const when = dtOf(date, hhmm || '12:00');
  if(when > new Date(Date.now() + 3600000)) throw new Error('future');
  const c = coords || await migraineCoords();
  const vars = 'surface_pressure,temperature_2m,relative_humidity_2m,weather_code';
  const ageDays = (Date.now() - when) / 86400000;
  let url;
  if(ageDays < 85){
    url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&hourly=${vars}&temperature_unit=fahrenheit&timezone=auto&past_days=${Math.min(92, Math.ceil(ageDays) + 2)}&forecast_days=1`;
  } else {
    url = `https://archive-api.open-meteo.com/v1/archive?latitude=${c.lat}&longitude=${c.lon}&hourly=${vars}&temperature_unit=fahrenheit&timezone=auto&start_date=${addDays(date,-1)}&end_date=${date}`;
  }
  const r = await fetch(url);
  if(!r.ok) throw new Error('http');
  const h = (await r.json()).hourly;
  const key = `${date}T${String(when.getHours()).padStart(2,'0')}:00`;
  const i = h.time.indexOf(key);
  if(i < 0 || h.surface_pressure[i] === null) throw new Error('hour');
  const p = h.surface_pressure[i], p24 = i >= 24 ? h.surface_pressure[i-24] : null;
  return {
    forKey: key, pressure: p, change24: (p24 === null || p24 === undefined) ? null : Math.round((p - p24)*10)/10,
    temp: h.temperature_2m[i], humidity: h.relative_humidity_2m[i], code: h.weather_code[i]
  };
}
function wxKey(date, m){ return `${date}T${(m.startTime || '12:00').slice(0,2)}:00`; }
function inHg(hpa){ return (hpa * 0.02953).toFixed(2); }
function wxTrend(w){
  if(!w || w.change24 === null || w.change24 === undefined) return '';
  if(w.change24 <= -3) return 'fall';
  if(w.change24 >= 3) return 'rise';
  return 'steady';
}
function wxSentence(w){
  if(!w) return '';
  const ch = (w.change24 === null || w.change24 === undefined) ? '' : `, ${w.change24 > 0 ? '+' : ''}${(w.change24*0.02953).toFixed(2)} inHg in 24h`;
  return `${Math.round(w.temp)}°F, ${wxLabel(w.code) || 'n/a'}, ${inHg(w.pressure)} inHg${ch}`;
}
async function refreshMigraineWeather(date){
  const m = state.migraines[date];
  if(!m) return;
  try{
    m.weather = await fetchMigraineWeather(date, m.startTime);
    m.weatherErr = '';
  }catch(e){ m.weatherErr = e.message; }
  saveData();
  if(state.view === 'migraine' && !state.mEditing) render();
}
async function backfillMigraineWeather(){
  const todo = migraineDates().filter(d => { const m = state.migraines[d]; return !(m && m.weather && m.weather.forKey === wxKey(d, m)); });
  if(!todo.length) return;
  let coords;
  try{ coords = await migraineCoords(); }
  catch(e){ alert("Couldn't get your location. Allow location for this app in Settings, then try again."); return; }
  let done = 0, failed = 0;
  for(const d of todo){
    state.mWxBusy = `Adding weather… ${done + failed + 1} of ${todo.length}`;
    render();
    if(!state.migraines[d]) state.migraines[d] = blankMigraine(d);
    const m = state.migraines[d];
    try{ m.weather = await fetchMigraineWeather(d, m.startTime, coords); m.weatherErr = ''; done++; }
    catch(e){ m.weatherErr = e.message; failed++; }
    await new Promise(r => setTimeout(r, 150));
  }
  saveData();
  state.mWxBusy = '';
  render();
  if(failed) alert(`Weather added to ${done} migraine day${done===1?'':'s'}. ${failed} couldn't be found.`);
}

// ---------- Open / save ----------
function openMigraine(date){
  state.mEditing = date;
  state.mForm = JSON.parse(JSON.stringify(migraineFor(date)));
  state.view = 'migraine';
  render();
  window.scrollTo(0, 0);
}
function closeMigraine(){
  state.mEditing = null;
  state.mForm = null;
  state.mFromHem = false;
  render();
  window.scrollTo(0, 0);
}
function saveMigraine(){
  const f = state.mForm;
  if(!f) return;
  f.reviewed = true;
  f.hoursLost = String(f.hoursLost || '').trim();
  const needsWx = !(f.weather && f.weather.forKey === wxKey(f.date, f));
  state.migraines[f.date] = f;
  const ok = saveData();
  const date = f.date;
  closeMigraine();
  if(!ok){ alert('Could not save on this device — check the storage warning.'); return; }
  if(needsWx) refreshMigraineWeather(date);
}
function mToggle(field, val){
  const arr = state.mForm[field] || (state.mForm[field] = []);
  const i = arr.indexOf(val);
  if(i >= 0) arr.splice(i, 1); else arr.push(val);
  render();
}

function chipRow(field, options, selected, single){
  return `<div class="chip-row">${options.map(o => {

}

}

function renderMigraineCalendar(dates){
  const now = todayISO();
  const ym = state.mCalMonth || now.slice(0,7);
  const [y, mo] = ym.split('-').map(Number);
  const first = new Date(y, mo-1, 1), daysIn = new Date(y, mo, 0).getDate();
  const set = new Set(dates);
  const rxDays = new Set(state.entries.filter(e => (e.meds||[]).some(isPainReliever)).map(e => e.date));
  let cells = ['S','M','T','W','T','F','S'].map(x => `<div class="dow">${x}</div>`).join('');
  for(let i = 0; i < first.getDay(); i++) cells += '<div></div>';
  for(let dd = 1; dd <= daysIn; dd++){
    const iso = `${ym}-${String(dd).padStart(2,'0')}`;
    const mig = set.has(iso);
    const p = mig ? dayPain(iso) : 0;
    const style = mig ? `background:${painBg(p)};color:${painInk(p)}` : '';
    cells += `<button type="button" class="d ${mig ? 'mig' : ''} ${mig && p >= 5 ? 'light' : ''} ${iso === now ? 'today' : ''}" ${mig ? `data-m-open="${iso}" aria-label="Migraine ${fmtDate(iso)}, pain ${p}"` : 'tabindex="-1" aria-hidden="true"'} style="${style}">${dd}${rxDays.has(iso) ? '<span class="rx"></span>' : ''}</button>`;
  }
  const monthCount = dates.filter(d => d.startsWith(ym)).length;
  return `
    <div class="card">
      <div class="m-cal-head">
        <button type="button" data-m-cal="-1" aria-label="Previous month">&#8249;</button>
        <h3>${fmtMonthHeader(ym + '-01')} <span style="font-family:'Inter',sans-serif;font-size:12px;font-weight:400;color:var(--ink-soft);">· ${monthCount} day${monthCount===1?'':'s'}</span></h3>
        <button type="button" data-m-cal="1" aria-label="Next month" ${ym >= now.slice(0,7) ? 'disabled style="opacity:.35"' : ''}>&#8250;</button>
      </div>
      <div class="m-cal">${cells}</div>
      <div class="m-legend">
        <span>Pain<span class="ramp">${[2,4,6,8,10].map(n => `<i style="background:${painBg(n)}"></i>`).join('')}</span>worse</span>
        <span><span class="rxdot"></span>pain reliever taken</span>
      </div>
    </div>`;
}

  const lastDays = dates.length ? daysBetween(dates[0], today) : null;

  if(!dates.length){

    else if(m.startTime) times.push(`started ${fmtTime(m.startTime)}`);
    if(m.reliefTime) times.push(`relief ${fmtTime(m.reliefTime)}${m.reliefLevel ? ` (${m.reliefLevel})` : ''}`);
    if(m.ongoingNextDay) times.push('into the next day');
    else if(m.endTime) times.push(`ended ${fmtTime(m.endTime)}`);
    if(times.length) bits.push(times.join(' · '));
    if(meds.length) bits.push(`<b>Meds:</b> ${meds.map(x => escapeHtml(x.label) + (x.time ? ' ' + fmtTime(x.time) : '') + (x.helped ? ` (${({yes:'helped',some:'some help',no:'no help'})[x.helped]})` : '')).join(', ')}`);
    if(e && e.sleepHours !== undefined && e.sleepHours !== null) bits.push(`<b>Sleep before:</b> ${fmtSleep(e.sleepHours)}${e.sleepQuality ? ', ' + e.sleepQuality : ''}`);
    if(m.weather) bits.push(`<b>Weather:</b> ${escapeHtml(wxSentence(m.weather))}`);

    const pain = (m.pain !== null && m.pain !== undefined) ? `<span class="m-badge ok" style="background:${painBg(m.pain)};color:${painInk(m.pain)}">${m.pain}/10</span>` : '';
    list += `

        <div class="top">
          <div><span class="date">${fmtDate(d)}</span><span class="weekday">${fmtWeekday(d)}</span><span class="cycle-day">day ${cycleDayFor(d)}</span></div>

          <div class="m-class-row"><span>${escapeHtml(mm.label)}</span>
            <select data-m-class="${mm.id}">${MED_CLASSES.map(c => `<option value="${c.id}" ${medClassOf(mm.id) === c.id ? 'selected' : ''}>${c.label}</option>`).join('')}</select>

      ${DOCTOR_FIELDS.filter(fd => fd.key !== 'hem-doctor-notes').map(fd => `
        <label class="doctor-field-label" for="m-${fd.key}">${fd.label}</label>

      <label class="doctor-field-label" for="m-reason">Questions or reason for the visit (optional)</label>
      <textarea id="m-reason" class="doctor-reason" rows="3" placeholder="e.g. Migraines more frequent since August. Asking about a preventive.">${escapeHtml(reason)}</textarea>
      <select id="m-range" class="doctor-range">${M_RANGES.map(r => `<option value="${r.id}" ${r.id === savedRange ? 'selected' : ''}>${r.label}</option>`).join('')}</select>
      <button class="primary doctor-btn" id="m-export-pdf">Create migraine report (PDF)</button>

    ${renderMigraineCalendar(dates)}
    ${noWx ? `<button type="button" class="secondary-btn" id="m-wx-backfill" style="margin-bottom:16px;" ${state.mWxBusy ? 'disabled' : ''}>${state.mWxBusy ? escapeHtml(state.mWxBusy) : `Add weather to ${noWx} migraine day${noWx===1?'':'s'}`}</button>` : ''}
