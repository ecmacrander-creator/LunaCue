function renderHistory(){
  if(state.entries.length === 0){
    return `
      ${renderStorageBanner()}
      <div class="empty-state">
        <h3>No entries yet</h3>
        <p>Log today's symptoms and they'll show up here.</p>
      </div>
    `;
  }
  const symptomMap = {};
  allSymptoms().forEach(s => symptomMap[s.id] = s);
  const medMap = {};
  allMeds().forEach(m => medMap[m.id] = m);
  const dailyMap = {};
  allDailyMeds().forEach(m => dailyMap[m.id] = m);

  // Options for the month/day filters, built from what's actually logged.
  const monthsPresent = [...new Set(state.entries.map(e => e.date.slice(0,7)))].sort().reverse();
  const daysPresent = [...new Set(state.entries.map(e => Number(e.date.slice(8,10))))].sort((a,b)=>a-b);
  const monthOptions = monthsPresent.map(m => {
    const label = new Date(Number(m.slice(0,4)), Number(m.slice(5,7))-1, 1).toLocaleDateString(undefined, {month:'long', year:'numeric'});
    return `<option value="${m}" ${state.historyMonth===m?'selected':''}>${label}</option>`;
  }).join('');
  const dayOptions = daysPresent.map(d => `<option value="${d}" ${Number(state.historyDay)===d?'selected':''}>${d}</option>`).join('');

  const filterBar = `
    <div class="card" style="padding:10px 12px;margin-bottom:14px;">
      <input type="text" id="history-search" placeholder="Search symptoms, meds, or notes" value="${escapeHtml(state.historyFilter)}">
      <div class="history-filter-row">
        <select id="history-month-filter">
          <option value="">All months</option>
          ${monthOptions}
        </select>
        <select id="history-day-filter">
          <option value="">All days</option>
          ${dayOptions}
        </select>
        <button id="history-sort-toggle" class="link-btn" type="button">${state.historySort === 'cycleDay' ? 'Sorted by cycle day' : 'Sort by cycle day'}</button>
      </div>
    </div>
  `;

  const filterText = state.historyFilter.trim().toLowerCase();
  let entries = state.entries.filter(e => {
    if(state.historyMonth && e.date.slice(0,7) !== state.historyMonth) return false;
    if(state.historyDay && Number(e.date.slice(8,10)) !== Number(state.historyDay)) return false;
    if(!filterText) return true;
    const symptomLabels = (e.symptoms||[]).map(id => symptomMap[id]?.label || '').join(' ').toLowerCase();
    const medLabels = (e.meds||[]).map(id => medMap[id]?.label || '').join(' ').toLowerCase();
    const notes = (e.notes||'').toLowerCase();
    const dateStr = fmtDate(e.date).toLowerCase();
    return symptomLabels.includes(filterText) || medLabels.includes(filterText) || notes.includes(filterText) || dateStr.includes(filterText);
  });

  if(state.historySort === 'cycleDay'){
    entries = [...entries].sort((a,b) => cycleDayFor(a.date) - cycleDayFor(b.date) || (a.date < b.date ? 1 : -1));
  }

  if(entries.length === 0){
    return `
      ${renderStorageBanner()}
      ${filterBar}
      <div class="empty-state">
        <h3>No matches</h3>
        <p>Nothing logged matches these filters.</p>
      </div>
    `;
  }

  let html = renderStorageBanner() + filterBar;
  let lastGroup = '';
  for(const e of entries){
    const groupKey = state.historySort === 'cycleDay' ? `Cycle day ${cycleDayFor(e.date)}` : fmtMonthHeader(e.date);
    if(groupKey !== lastGroup){
      html += `<div class="month-header">${groupKey}</div>`;
      lastGroup = groupKey;
    }
    const tags = (e.symptoms||[]).map(id => {
      const s = symptomMap[id];
      if(!s) return '';
      const sev = (e.severity||{})[id];
      const sevBadge = sev ? ` <span class="sev-dot" title="${sev}">${SEVERITY_DOTS[sev]}</span>` : '';
      return `<span class="tag" style="background:${s.color}">${escapeHtml(s.label)}${sevBadge}</span>`;
    }).join('');
    const medTags = (e.meds || []).map(id => {
      const m = medMap[id];
      return m ? `<span class="tag" style="background:${m.color}">${escapeHtml(m.label)}</span>` : '';
    }).join('');
    const isClean = isSymptomFree(e);
    const medTagsTimed = (e.meds || []).map(id => {
      const m = medMap[id];
      const t = (e.medTimes||{})[id];
      return m ? `<span class="tag" style="background:${m.color}">${escapeHtml(m.label)}${t ? ' ' + fmtTime(t) : ''}</span>` : '';
    }).join('');
    const metaBits = [];
    Object.keys(e.medTiming||{}).forEach(id => {
      const label = (dailyMap[id] && dailyMap[id].label) || id;
      metaBits.push(`<b>${escapeHtml(label)}:</b> ${timingLabel(e.medTiming[id])}`);
    });
    Object.keys(e.painLocation||{}).forEach(id => {
      const label = (symptomMap[id] && symptomMap[id].label) || id;
      metaBits.push(`<b>${escapeHtml(label)}:</b> ${painLabels(e.painLocation[id]).join(', ')}`);
    });
    if(e.sleepHours !== undefined && e.sleepHours !== null || e.sleepQuality){
      const parts = [];
      if(e.sleepHours !== undefined && e.sleepHours !== null) parts.push(fmtSleep(e.sleepHours));
      if(e.sleepQuality) parts.push(e.sleepQuality);
      metaBits.push(`<b>Sleep:</b> ${parts.join(', ')}`);
    }

    const cycleDay = cycleDayFor(e.date);

    html += `
      <div class="entry-row">
        <div class="top">
          <div><span class="date">${fmtDate(e.date)}</span><span class="weekday">${fmtWeekday(e.date)}</span><span class="cycle-day">day ${cycleDay}</span></div>
          <div>
            <button class="del" data-edit="${e.date}">edit</button>
            <button class="del" data-del="${e.date}">delete</button>
          </div>
        </div>
        <div class="tags">${tags || (isClean ? '<span class="tag" style="background:var(--sage)">No symptoms</span>' : '')}</div>
        ${medTagsTimed ? `<div class="tags" style="margin-top:2px;"><span style="font-size:11px;color:var(--ink-soft);margin-right:4px;align-self:center;">Took:</span>${medTagsTimed}</div>` : ''}
        ${metaBits.length ? `<div class="entry-meta">${metaBits.join(' · ')}</div>` : ''}
        ${e.notes ? `<div class="notes">${escapeHtml(e.notes)}</div>` : ''}
      </div>
    `;
  }
  return html;
}

function renderPatterns(){
  if(state.entries.length < 3){
    return `
      ${renderStorageBanner()}
      <div class="empty-state">
        <h3>Not enough data yet</h3>
        <p>Log at least a few days — patterns start to show once you have some history.</p>
      </div>
      ${renderDoctorCard()}
      <div class="card">
        <span class="section-label">Backup &amp; export</span>
        <button class="secondary-btn" id="export-backup-btn">Download backup (.json)</button>
        <button class="secondary-btn" id="export-csv-btn">Export as spreadsheet (.csv)</button>
        <button class="secondary-btn" id="import-backup-btn">Restore from backup</button>
        <button class="secondary-btn" id="import-sleep-btn">Import sleep from spreadsheet</button>
        <input type="file" id="import-sleep-input" accept=".csv,.tsv,.txt,.xlsx,.xls,text/csv,text/tab-separated-values,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="display:none;">
        <input type="file" id="import-file-input" accept="application/json" style="display:none;">
        <p style="font-size:11.5px;color:var(--ink-soft);margin:10px 0 0;">
          Moving to a new device or a new version of this app? Restore your backup file here.
        </p>
      </div>
    `;
  }

  const rings = allSymptoms();
  const cycleLength = state.cycleLength;
  const sortedByDate = [...state.entries].sort((a,b) => a.date < b.date ? -1 : 1);
  const earliestEntryDate = sortedByDate[0].date;
  const anchor = getAnchorDate();

  const cx = 170, cy = 170, innerR = 46, outerR = 160;
  const spacing = (outerR - innerR) / rings.length;

  let ringsSvg = '';
  rings.forEach((r, i) => {
    ringsSvg += `<circle cx="${cx}" cy="${cy}" r="${innerR + spacing*i}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  });
  ringsSvg += `<circle cx="${cx}" cy="${cy}" r="${outerR}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  ringsSvg += `<line x1="${cx}" y1="${cy-innerR}" x2="${cx}" y2="${cy-outerR}" stroke="var(--line)" stroke-width="1"/>`;
  const midDay = Math.round(cycleLength/2);
  ringsSvg += `<line x1="${cx}" y1="${cy+innerR}" x2="${cx}" y2="${cy+outerR}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2,3"/>`;

  const counts = {};
  rings.forEach(r => counts[r.id] = 0);
  const medCounts = {};
  allMeds().forEach(m => medCounts[m.id] = 0);
  const symptomDayIdxs = {};

  let dotsSvg = '';
  for(const e of state.entries){
    const raw = daysBetween(anchor, e.date) % cycleLength;
    const dayIdx = ((raw % cycleLength) + cycleLength) % cycleLength;
    const angle = (dayIdx / cycleLength) * 2 * Math.PI - Math.PI/2;
    e.symptoms.forEach(id => {
      const ringIndex = rings.findIndex(r => r.id === id);
      if(ringIndex === -1) return;
      counts[id] = (counts[id] || 0) + 1;
      (symptomDayIdxs[id] = symptomDayIdxs[id] || []).push(dayIdx);
      const rad = innerR + spacing * (ringIndex + 0.5);
      const x = cx + rad * Math.cos(angle);
      const y = cy + rad * Math.sin(angle);
      const color = rings[ringIndex].color;
      dotsSvg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.2" fill="${color}" fill-opacity="0.82" stroke="var(--card)" stroke-width="0.8"/>`;
    });
    (e.meds || []).forEach(id => {
      medCounts[id] = (medCounts[id] || 0) + 1;
    });
  }

  const svg = `
    <svg viewBox="0 0 340 340" width="300" height="300">
      ${ringsSvg}
      ${dotsSvg}
      <text x="${cx}" y="${cy-4}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="var(--ink)">${cycleLength}-day</text>
      <text x="${cx}" y="${cy+11}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="var(--ink-soft)">cycle</text>
      <text x="${cx}" y="${cy-outerR-8}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--ink-soft)">day 1</text>
      <text x="${cx}" y="${cy+outerR+16}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--ink-soft)">day ${midDay+1}</text>
    </svg>
  `;

  const legend = rings.map(r => `
    <div class="legend-row">
      <span class="dot" style="background:${r.color}"></span>
      <span>${r.label}</span>
      <span class="count">${counts[r.id] || 0}</span>
    </div>
  `).join('');

  // --- Insights: plain-language summary of what's in the data so far.
  // Kept descriptive, not diagnostic — useful things to bring up with a doctor.
  const spanDays = daysBetween(earliestEntryDate, sortedByDate[sortedByDate.length-1].date) + 1;
  const cleanDayCount = state.entries.filter(isSymptomFree).length;
  const topSymptoms = rings
    .map(r => ({label: r.label, n: counts[r.id] || 0}))
    .filter(x => x.n > 0)
    .sort((a,b) => b.n - a.n)
    .slice(0, 3);
  const topMeds = allMeds()
    .map(m => ({label: m.label, n: medCounts[m.id] || 0}))
    .filter(x => x.n > 0)
    .sort((a,b) => b.n - a.n)
    .slice(0, 3);

  const severeCounts = {};
  for(const e of state.entries){
    Object.entries(e.severity || {}).forEach(([id, level]) => {
      if(level !== 'severe') return;
      severeCounts[id] = (severeCounts[id]||0) + 1;
    });
  }
  const topSevere = Object.entries(severeCounts)
    .map(([id, n]) => ({label: (rings.find(r=>r.id===id)||{}).label || id, n}))
    .sort((a,b) => b.n - a.n)
    .slice(0, 3);

  let clusterNote = '';
  if(topSymptoms.length){
    const topId = rings.find(r => r.label === topSymptoms[0].label)?.id;
    const idxs = symptomDayIdxs[topId] || [];
    if(idxs.length >= 3){
      const bucketSize = Math.max(1, Math.round(cycleLength/4));
      const bucketCounts = {};
      idxs.forEach(d => { const b = Math.floor(d/bucketSize); bucketCounts[b] = (bucketCounts[b]||0)+1; });
      const buckets = Object.entries(bucketCounts).sort((a,b) => b[1]-a[1]);
      const [topBucket, topBucketCount] = buckets[0];
      if(topBucketCount / idxs.length >= 0.5){
        const startDay = Number(topBucket)*bucketSize + 1;
        const endDay = Math.min(cycleLength, startDay + bucketSize - 1);
        clusterNote = `<li>${escapeHtml(topSymptoms[0].label)} shows up most often around days ${startDay}–${endDay} of your ${cycleLength}-day cycle in the data so far.</li>`;
      }
    }
  }

  const insightsList = `
    <li>${state.entries.length} day${state.entries.length===1?'':'s'} logged over ${spanDays} day${spanDays===1?'':'s'}, starting ${fmtDate(earliestEntryDate)}.</li>
    ${cleanDayCount ? `<li>${cleanDayCount} day${cleanDayCount===1?'':'s'} logged as no symptoms.</li>` : ''}
    ${topSymptoms.length ? `<li>Most logged symptom${topSymptoms.length>1?'s':''}: ${topSymptoms.map(s=>`${escapeHtml(s.label)} (${s.n})`).join(', ')}.</li>` : ''}
    ${topMeds.length ? `<li>Most taken med${topMeds.length>1?'s':''}: ${topMeds.map(m=>`${escapeHtml(m.label)} (${m.n})`).join(', ')}.</li>` : ''}
    ${topSevere.length ? `<li>Logged as severe: ${topSevere.map(s=>`${escapeHtml(s.label)} (${s.n})`).join(', ')}.</li>` : ''}
    ${clusterNote}
  `;

  // --- Timing table: each symptom's/med's occurrences by cycle day + month.
  const timingRows = computeCycleTimingRows(rings, 'symptoms');
  const medTimingRows = computeCycleTimingRows(allMeds(), 'meds');

  // --- Co-occurrence: which symptom pairs tend to land on the same day.
  const pairCounts = computeCooccurrence(rings);
  const symptomLabelMap = {};
  rings.forEach(r => symptomLabelMap[r.id] = r);
  const topPairs = Object.entries(pairCounts)
    .filter(([,n]) => n >= 2)
    .sort((a,b) => b[1]-a[1])
    .slice(0, 5)
    .map(([key, n]) => {
      const [idA, idB] = key.split('|');
      return {a: symptomLabelMap[idA], b: symptomLabelMap[idB], n};
    })
    .filter(p => p.a && p.b);

  return `
    ${renderStorageBanner()}
    <div class="card">
      <span class="section-label">Assumed cycle length</span>
      <div class="cycle-input-row">
        <input type="number" id="cycle-input" value="${cycleLength}" min="14" max="90">
        <span>days — adjust to match your pill pack or what feels right</span>
      </div>

      <span class="section-label">Cycle day 1</span>
      <div class="cycle-input-row">
        <input type="date" id="anchor-input" value="${anchor}" max="${todayISO()}">
        <span>${state.cycleAnchor ? 'set manually' : `defaults to your first entry (${fmtDate(earliestEntryDate)})`}</span>
      </div>
      ${state.cycleAnchor ? `<button id="reset-anchor-btn" class="link-btn" style="margin:-10px 0 16px;">Use first entry instead</button>` : ''}

      ${(() => {
        const suggestion = suggestCycleParams();
        if(!suggestion || suggestion.needMoreData) return `<p style="font-size:11.5px;color:var(--ink-soft);margin:-6px 0 16px;">Log symptom days spanning about 8 weeks and this can suggest a cycle length and day 1 for you, based on when symptoms tend to repeat — useful since birth control doesn't give you a real cycle to anchor on. Keep going.</p>`;
        if(suggestion.confidence < 0.25){
          return `<p style="font-size:11.5px;color:var(--ink-soft);margin:-6px 0 16px;">Checked for a repeating rhythm in your ${suggestion.dataPoints} symptom days, but nothing stands out yet — could mean there isn't a strong cycle, or just needs more data. Keep logging.</p>`;
        }
        const strength = suggestion.confidence >= 0.45 ? 'a fairly clear' : 'a rough';
        return `
          <div class="banner nudge" style="margin:-6px 0 16px;">
            Based on ${suggestion.dataPoints} symptom days, there's ${strength} repeating pattern roughly every <strong>${suggestion.cycleLength} days</strong>, with symptoms tending to start around <strong>${fmtDate(suggestion.anchorDate)}</strong>-ish in that rhythm.
            <br><button id="apply-suggested-cycle-btn" class="link-btn" data-length="${suggestion.cycleLength}" data-anchor="${suggestion.anchorDate}" style="margin-top:6px;">Use this cycle length &amp; day 1</button>
          </div>
        `;
      })()}

      <div class="wheel-wrap">${svg}</div>
      <p style="font-size:12.5px;color:var(--ink-soft);text-align:center;margin:10px 0 0;">
        Each dot is a day a symptom was logged, placed by where that day fell in the cycle above.
        Dots clustering around the same angle across rings hint at a cyclical pattern.
      </p>
      <div class="legend">${legend}</div>
    </div>

    <div class="card">
      <span class="section-label">Timing across months</span>
      ${(timingRows.length || medTimingRows.length) ? `
        ${timingRows.length ? `
          <div class="timing-group-label">Symptoms</div>
          <div class="timing-table">
            ${timingRows.map(r => `
              <div class="timing-row">
                <div class="timing-row-label">
                  <span class="dot" style="background:${r.symptom.color}"></span>${escapeHtml(r.symptom.label)}
                </div>
                <div class="timing-occs">
                  ${r.occ.map(o => `<span class="timing-chip">Day ${o.day} <span class="timing-chip-month">${fmtMonthShort(o.date)}</span></span>`).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        ` : ''}
        ${medTimingRows.length ? `
          <div class="timing-group-label">Meds</div>
          <div class="timing-table">
            ${medTimingRows.map(r => `
              <div class="timing-row">
                <div class="timing-row-label">
                  <span class="dot" style="background:${r.symptom.color}"></span>${escapeHtml(r.symptom.label)}
                </div>
                <div class="timing-occs">
                  ${r.occ.map(o => `<span class="timing-chip">Day ${o.day} <span class="timing-chip-month">${fmtMonthShort(o.date)}</span></span>`).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        ` : ''}
        <p style="font-size:11.5px;color:var(--ink-soft);margin:10px 0 0;">
          Each chip is one occurrence, showing where it fell in your ${cycleLength}-day cycle. Chips clustered on close-together day numbers across different months point to a cyclical pattern.
        </p>
      ` : `<p style="font-size:13px;color:var(--ink-soft);margin:0;">Not enough repeats yet — once something shows up on 2+ different days, it'll appear here so you can compare timing across months.</p>`}
    </div>

    <div class="card">
      <span class="section-label">What the data shows so far</span>
      <ul style="margin:0;padding-left:18px;font-size:13.5px;line-height:1.6;color:var(--ink);">
        ${insightsList}
      </ul>
      <p style="font-size:11.5px;color:var(--ink-soft);margin:10px 0 0;">
        These are just counts and patterns from what you've logged — worth bringing up with your doctor, not a diagnosis.
      </p>
    </div>

    ${renderSuggestionsCard(rings, symptomDayIdxs, pairCounts, cycleLength)}

    <div class="card">
      <span class="section-label">Symptoms that show up together</span>
      ${topPairs.length ? `
        <ul style="margin:0;padding-left:18px;font-size:13.5px;line-height:1.7;color:var(--ink);">
          ${topPairs.map(p => `<li>${escapeHtml(p.a.label)} + ${escapeHtml(p.b.label)} — ${p.n} day${p.n===1?'':'s'} together</li>`).join('')}
        </ul>
      ` : `<p style="font-size:13px;color:var(--ink-soft);margin:0;">Not enough overlap yet — keep logging and pairs will show up here.</p>`}
    </div>

    ${renderDoctorCard()}
    <div class="card">
      <span class="section-label">Backup &amp; export</span>
      <button class="secondary-btn" id="export-backup-btn">Download backup (.json)</button>
      <button class="secondary-btn" id="export-csv-btn">Export as spreadsheet (.csv)</button>
      <button class="secondary-btn" id="import-backup-btn">Restore from backup</button>
        <button class="secondary-btn" id="import-sleep-btn">Import sleep from spreadsheet</button>
        <input type="file" id="import-sleep-input" accept=".csv,.tsv,.txt,.xlsx,.xls,text/csv,text/tab-separated-values,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="display:none;">
      <input type="file" id="import-file-input" accept="application/json" style="display:none;">
      <p style="font-size:11.5px;color:var(--ink-soft);margin:10px 0 0;">
        The backup file is the only way to move your entries to a new device or a new version of this app — keep a copy somewhere safe (Files, email to yourself, iCloud).
      </p>
    </div>

    <p class="footer-note">First entry logged: ${fmtDate(earliestEntryDate)}.
      <button id="clear-data-btn">Clear all data</button>
    </p>
  `;
}

function escapeHtml(str){
  return (str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  document.getElementById('today-label').textContent = new Date().toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric', year:'numeric'});
  ['log','history','patterns'].forEach(v => {
    document.getElementById('tab-'+v).classList.toggle('active', state.view === v);
  });
  const main = document.getElementById('main');
  if(!state.loaded){
    main.innerHTML = `<div class="empty-state"><p>Loading…</p></div>`;
    return;
  }
  if(state.view === 'log') main.innerHTML = renderLog();
  else if(state.view === 'history') main.innerHTML = renderHistory();
  else main.innerHTML = renderPatterns();
  attachHandlers();
}

function attachHandlers(){
  document.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', () => toggleSymptom(el.getAttribute('data-toggle')));
  });
  document.querySelectorAll('[data-remove-custom]').forEach(el => {
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      removeCustomSymptom(el.getAttribute('data-remove-custom'));
    });
  });
  document.querySelectorAll('[data-toggle-med]').forEach(el => {
    el.addEventListener('click', () => toggleMed(el.getAttribute('data-toggle-med')));
  });
  document.querySelectorAll('[data-remove-med]').forEach(el => {
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      removeCustomMed(el.getAttribute('data-remove-med'));
    });
  });
  document.querySelectorAll('[data-severity]').forEach(el => {
    el.addEventListener('click', () => setSeverity(el.getAttribute('data-severity'), el.getAttribute('data-level')));
  });
  document.querySelectorAll('[data-timing]').forEach(el => {
    el.addEventListener('click', () => setMedTiming(el.getAttribute('data-timing'), el.getAttribute('data-timing-val')));
  });
  document.querySelectorAll('[data-loc]').forEach(el => {
    el.addEventListener('click', () => togglePainLocation(el.getAttribute('data-loc'), el.getAttribute('data-loc-val')));
  });
  document.querySelectorAll('[data-sleepq]').forEach(el => {
    el.addEventListener('click', () => setSleepQuality(el.getAttribute('data-sleepq')));
  });
  document.querySelectorAll('[data-medtime]').forEach(el => {
    el.addEventListener('input', e => {
      const id = el.getAttribute('data-medtime');
      if(e.target.value) state.form.medTimes[id] = e.target.value;
      else delete state.form.medTimes[id];
    });
  });
  document.querySelectorAll('[data-remove-daily]').forEach(el => {
    el.addEventListener('click', (ev) => { ev.stopPropagation(); removeCustomDailyMed(el.getAttribute('data-remove-daily')); });
  });
  const pasteSleepBtn = document.getElementById('paste-sleep-btn');
  if(pasteSleepBtn) pasteSleepBtn.addEventListener('click', pasteSleep);
  const sleepHoursInput = document.getElementById('sleep-hours-input');
  if(sleepHoursInput) sleepHoursInput.addEventListener('input', e => { state.form.sleepHours = e.target.value; });
  const otherDailyInput = document.getElementById('other-daily-meds-input');
  if(otherDailyInput) otherDailyInput.addEventListener('input', e => { state.form.otherDailyMeds = e.target.value; });
  const noSymToggleEl = document.getElementById('no-symptoms-toggle');
  if(noSymToggleEl) noSymToggleEl.addEventListener('click', toggleNoSymptomsForm);
  const cleanDayBtn = document.getElementById('clean-day-btn');
  if(cleanDayBtn) cleanDayBtn.addEventListener('click', logCleanDay);
  const dateInput = document.getElementById('date-input');
  if(dateInput) dateInput.addEventListener('change', e => { state.form.date = e.target.value; render(); });
  const otherInput = document.getElementById('other-input');
  if(otherInput) otherInput.addEventListener('input', e => { state.form.other = e.target.value; });
  const otherMedsInput = document.getElementById('other-meds-input');
  if(otherMedsInput) otherMedsInput.addEventListener('input', e => { state.form.otherMeds = e.target.value; });
  const notesInput = document.getElementById('notes-input');
  if(notesInput) notesInput.addEventListener('input', e => { state.form.notes = e.target.value; });
  const saveBtn = document.getElementById('save-btn');
  if(saveBtn) saveBtn.addEventListener('click', saveEntry);
  const cancelEditBtn = document.getElementById('cancel-edit-btn');
  if(cancelEditBtn) cancelEditBtn.addEventListener('click', cancelEdit);
  document.querySelectorAll('[data-edit]').forEach(el => {
    el.addEventListener('click', () => editEntry(el.getAttribute('data-edit')));
  });
  document.querySelectorAll('[data-del]').forEach(el => {
    el.addEventListener('click', () => {
      if(confirm('Delete this entry?')) deleteEntry(el.getAttribute('data-del'));
    });
  });
  const cycleInput = document.getElementById('cycle-input');
  if(cycleInput) cycleInput.addEventListener('change', e => updateCycleLength(e.target.value));
  const anchorInput = document.getElementById('anchor-input');
  if(anchorInput) anchorInput.addEventListener('change', e => updateCycleAnchor(e.target.value));
  const resetAnchorBtn = document.getElementById('reset-anchor-btn');
  if(resetAnchorBtn) resetAnchorBtn.addEventListener('click', resetCycleAnchor);
  const applySuggestedCycleBtn = document.getElementById('apply-suggested-cycle-btn');
  if(applySuggestedCycleBtn) applySuggestedCycleBtn.addEventListener('click', () => {
    updateCycleLength(applySuggestedCycleBtn.getAttribute('data-length'));
    updateCycleAnchor(applySuggestedCycleBtn.getAttribute('data-anchor'));
  });
  const historySearch = document.getElementById('history-search');
  if(historySearch) historySearch.addEventListener('input', e => {
    state.historyFilter = e.target.value;
    const cursorPos = e.target.selectionStart;
    render();
    const freshInput = document.getElementById('history-search');
    if(freshInput){ freshInput.focus(); freshInput.setSelectionRange(cursorPos, cursorPos); }
  });
  const historyMonthFilter = document.getElementById('history-month-filter');
  if(historyMonthFilter) historyMonthFilter.addEventListener('change', e => {
    state.historyMonth = e.target.value;
    render();
  });
  const historyDayFilter = document.getElementById('history-day-filter');
  if(historyDayFilter) historyDayFilter.addEventListener('change', e => {
    state.historyDay = e.target.value;
    render();
  });
  const historySortToggle = document.getElementById('history-sort-toggle');
  if(historySortToggle) historySortToggle.addEventListener('click', () => {
    state.historySort = state.historySort === 'cycleDay' ? 'date' : 'cycleDay';
    render();
  });
  const clearBtn = document.getElementById('clear-data-btn');
  if(clearBtn) clearBtn.addEventListener('click', async () => {
    if(confirm('Delete all logged entries? This cannot be undone.')){
      state.entries = [];
      await saveData();
      render();
    }
  });
  const exportBackupBtn = document.getElementById('export-backup-btn');
  if(exportBackupBtn) exportBackupBtn.addEventListener('click', exportBackup);
  const exportCsvBtn = document.getElementById('export-csv-btn');
  if(exportCsvBtn) exportCsvBtn.addEventListener('click', exportCSV);
  const exportDoctorBtn = document.getElementById('export-doctor-btn');
  if(exportDoctorBtn) exportDoctorBtn.addEventListener('click', exportDoctorReport);
  const doctorReason = document.getElementById('doctor-reason');
  document.querySelectorAll('[data-doctor-key]').forEach(el => {
    el.addEventListener('input', () => { try{ window.localStorage.setItem(el.getAttribute('data-doctor-key'), el.value); }catch(e){} });
  });
  if(doctorReason) doctorReason.addEventListener('input', () => { try{ window.localStorage.setItem('hem-doctor-reason', doctorReason.value); }catch(e){} });
  const doctorLog = document.getElementById('doctor-include-log');
  if(doctorLog) doctorLog.addEventListener('change', () => { try{ window.localStorage.setItem('hem-doctor-log', doctorLog.checked ? '1' : '0'); }catch(e){} });
  const importBtn = document.getElementById('import-backup-btn');
  const importInput = document.getElementById('import-file-input');
  if(importBtn && importInput){
    importBtn.addEventListener('click', () => importInput.click());
    importInput.addEventListener('change', (e) => {
      if(e.target.files && e.target.files[0]) importBackupFile(e.target.files[0]);
    });
  }
  const importSleepBtn = document.getElementById('import-sleep-btn');
  const importSleepInput = document.getElementById('import-sleep-input');
  if(importSleepBtn && importSleepInput){
    importSleepBtn.addEventListener('click', () => importSleepInput.click());
    importSleepInput.addEventListener('change', (e) => {
      if(e.target.files && e.target.files[0]) importSleepFile(e.target.files[0]);
      e.target.value = '';
    });
  }
}

document.querySelectorAll('nav.tabbar button').forEach(btn => {
  btn.addEventListener('click', () => setView(btn.getAttribute('data-view')));
});

loadData();
</script>
</body>
</html>
