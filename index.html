function renderMigraine(){
  if(state.mEditing && state.mForm) return renderMigraineForm();
  return renderMigraineList();
}

function attachMigraineHandlers(){
  const q = s => document.querySelectorAll(s);
  q('[data-m-open]').forEach(el => {
    el.addEventListener('click', () => { state.mFromHem = false; openMigraine(el.getAttribute('data-m-open')); });
    el.addEventListener('keydown', ev => { if(ev.key === 'Enter' && el.classList.contains('m-row')) openMigraine(el.getAttribute('data-m-open')); });
  });
  q('[data-m-cal]').forEach(el => el.addEventListener('click', () => {
    const ym = state.mCalMonth || todayISO().slice(0,7);
    const [y, m] = ym.split('-').map(Number);
    const d = new Date(y, m - 1 + Number(el.getAttribute('data-m-cal')), 1);
    state.mCalMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    render();
  }));
  const wxBtn = document.getElementById('m-wx-backfill');
  if(wxBtn) wxBtn.addEventListener('click', backfillMigraineWeather);
  q('[data-m-class]').forEach(el => el.addEventListener('change', () => {
    state.medClasses[el.getAttribute('data-m-class')] = el.value;
    saveData();
    render();
  }));
  const range = document.getElementById('m-range');
  if(range) range.addEventListener('change', () => { try{ window.localStorage.setItem('hem-mig-range', range.value); }catch(e){} });
  const reason = document.getElementById('m-reason');
  if(reason) reason.addEventListener('input', () => { try{ window.localStorage.setItem('hem-mig-reason', reason.value); }catch(e){} });
  const pdfBtn = document.getElementById('m-export-pdf');
  if(pdfBtn) pdfBtn.addEventListener('click', exportMigraineReport);
  const csvBtn = document.getElementById('m-export-csv');
  if(csvBtn) csvBtn.addEventListener('click', exportMigraineCSV);

  if(!state.mForm) return;
  const f = state.mForm;
  q('[data-m-chip]').forEach(el => el.addEventListener('click', ev => {
    if(ev.target.closest('[data-m-remove-trigger]')) return;
    const field = el.getAttribute('data-m-chip'), val = el.getAttribute('data-val');
    if(field === 'regions-extra') mToggle('regions', val === 'Whole head' ? 'whole' : 'moves');
    else mToggle(field, val);
  }));
  q('[data-m-relief]').forEach(el => el.addEventListener('click', () => {
    const v = el.getAttribute('data-val').toLowerCase();
    f.reliefLevel = f.reliefLevel === v ? '' : v;
    if(f.reliefLevel && !f.reliefTime) f.reliefTime = hhmmNow();
    render();
  }));
  q('[data-m-remove-trigger]').forEach(el => el.addEventListener('click', ev => {
    ev.stopPropagation();
    const t = el.getAttribute('data-m-remove-trigger');
    if(!confirm(`Remove "${t}" from your trigger options? Past migraines keep it.`)) return;
    state.mCustomTriggers = state.mCustomTriggers.filter(x => x !== t);
    saveData();
    render();
  }));
  const addTrig = () => {
    const inp = document.getElementById('m-new-trigger');
    const t = (inp.value || '').trim();
    if(!t) return;
    const all = M_TRIGGERS.flatMap(g => g[1]).concat(state.mCustomTriggers);
    const existing = all.find(x => x.toLowerCase() === t.toLowerCase());
    const label = existing || (t.charAt(0).toUpperCase() + t.slice(1));
    if(!existing) state.mCustomTriggers.push(label);
    if(!f.triggers.includes(label)) f.triggers.push(label);
    saveData();
    render();
  };
  const addBtn = document.getElementById('m-add-trigger');
  if(addBtn) addBtn.addEventListener('click', addTrig);
  const newTrig = document.getElementById('m-new-trigger');
  if(newTrig) newTrig.addEventListener('keydown', ev => { if(ev.key === 'Enter'){ ev.preventDefault(); addTrig(); } });
  q('[data-m-pain]').forEach(el => el.addEventListener('click', () => {
    const n = Number(el.getAttribute('data-m-pain'));
    f.pain = f.pain === n ? null : n;
    render();
  }));
  q('[data-m-region]').forEach(el => {
    const go = () => mToggle('regions', el.getAttribute('data-m-region'));
    el.addEventListener('click', go);
    el.addEventListener('keydown', ev => { if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); go(); } });
  });
  q('[data-m-input]').forEach(el => el.addEventListener('input', () => {
    f[el.getAttribute('data-m-input')] = el.value;
  }));
  // Times re-render so the relief math and weather note update.
  q('input[type="time"][data-m-input]').forEach(el => el.addEventListener('change', () => { f[el.getAttribute('data-m-input')] = el.value; render(); }));
  q('[data-m-now]').forEach(el => el.addEventListener('click', () => { f[el.getAttribute('data-m-now')] = hhmmNow(); render(); }));
  q('[data-m-toggle]').forEach(el => el.addEventListener('click', () => {
    const k = el.getAttribute('data-m-toggle');
    f[k] = !f[k];
    if(k === 'continued' && f.continued) f.startTime = '';
    if(k === 'ongoingNextDay' && f.ongoingNextDay) f.endTime = '';
    render();
  }));
  q('[data-m-med]').forEach(el => el.addEventListener('change', () => {
    const id = el.getAttribute('data-m-med');
    f.medsExcluded = (f.medsExcluded||[]).filter(x => x !== id);
    if(!el.checked) f.medsExcluded.push(id);
    render();
  }));
  q('[data-m-helped]').forEach(el => el.addEventListener('click', () => {
    const id = el.getAttribute('data-m-helped'), v = el.getAttribute('data-val');
    f.medHelped = f.medHelped || {};
    if(f.medHelped[id] === v) delete f.medHelped[id]; else f.medHelped[id] = v;
    render();
  }));
  const wxRefresh = document.getElementById('m-wx-refresh');
  if(wxRefresh) wxRefresh.addEventListener('click', async () => {
    state.mWxForm = 'Getting weather…';
    const keep = f.weather; f.weather = null; render();
    try{ f.weather = await fetchMigraineWeather(f.date, f.startTime); state.mWxForm = ''; }
    catch(e){ f.weather = keep; state.mWxForm = ''; alert("Couldn't get weather for that time."); }
    render();
  });
  const editHem = document.getElementById('m-edit-hem');
  if(editHem) editHem.addEventListener('click', () => {
    // Keep what's been answered so far, then jump to the Hem day.
    state.migraines[f.date] = {...f};
    saveData();
    const d = f.date;
    state.mEditing = null; state.mForm = null; state.mFromHem = false;
    editEntry(d);
    window.scrollTo(0, 0);
  });
  const save = document.getElementById('m-save');
  if(save) save.addEventListener('click', saveMigraine);
  const cancel = document.getElementById('m-cancel');
  if(cancel) cancel.addEventListener('click', closeMigraine);
}

// ---------- Export ----------
function migraineSide(regions){
  const r = regions || [];
  const l = r.some(x => x.endsWith('-l')), rt = r.some(x => x.endsWith('-r'));
  if(l && rt) return 'Both sides';
  if(l) return 'Left side only';
  if(rt) return 'Right side only';
  if(r.length) return 'Whole head or center';
  return '';
}
function countBy(list){
  const c = {};
  list.forEach(v => { if(v) c[v] = (c[v]||0) + 1; });
  return Object.entries(c).sort((a,b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1));
}
function buildMigraineData(rangeId){
  const today = todayISO();
  const allAsc = migraineDates().slice().reverse();
  const start = rangeId === 'all' ? (allAsc[0] || today) : addDays(today, -(Number(rangeId) - 1));
  const dates = allAsc.filter(d => d >= start && d <= today);
  const rangeLabel = (M_RANGES.find(r => r.id === rangeId) || {}).label || '';
  const spanDays = daysBetween(start, today) + 1;
  const recs = dates.map(d => ({d, e: entryFor(d), m: migraineFor(d)}));
  const n = recs.length;
  const episodes = groupEpisodes(dates);
  const durations = episodes.map(ep => ep.mins).filter(x => x !== null);
  const pains = recs.map(r => r.m.pain).filter(p => p !== null && p !== undefined);

  // Pain-reliever days by calendar month (all Hem days).
  const months = [];
  let cur = start.slice(0,7);
  while(cur <= today.slice(0,7)){
    months.push(cur);
    const [y, m] = cur.split('-').map(Number);
    const nx = new Date(y, m, 1);
    cur = `${nx.getFullYear()}-${String(nx.getMonth()+1).padStart(2,'0')}`;
  }
  const monthRows = months.map(ym => {
    const s = ym + '-01' < start ? start : ym + '-01';
    const [y, m] = ym.split('-').map(Number);
    const endD = `${ym}-${String(new Date(y, m, 0).getDate()).padStart(2,'0')}`;
    const e = endD > today ? today : endD;
    const rc = rescueCounts(s, e);
    const partial = s !== ym + '-01' || e !== endD;
    return [fmtMonthHeader(ym + '-01') + (partial ? ' (partial)' : ''), String(dates.filter(d => d.startsWith(ym)).length), String(rc.any), String(rc.ten), String(rc.simple), RESCUE_STATUS[rc.status]];
  });

  // Medication response
  const medStats = {};
  recs.forEach(({d, m}) => {
    const meds = migraineMeds(d, m).filter(x => x.included);
    meds.forEach(x => {
      const s = medStats[x.id] || (medStats[x.id] = {label:x.label, n:0, yes:0, some:0, no:0, ttr:[]});
      s.n++;
      if(x.helped) s[x.helped]++;
    });
    const firstTimed = meds.find(x => x.time);
    if(firstTimed && m.reliefTime){
      const diff = toMin(m.reliefTime) - toMin(firstTimed.time);
      if(diff >= 0) medStats[firstTimed.id].ttr.push(diff);
    }
  });
  const medRows = Object.entries(medStats).sort((a,b) => b[1].n - a[1].n).map(([id, s]) => {
    const rated = s.yes + s.some + s.no;
    return [s.label, (MED_CLASSES.find(c => c.id === medClassOf(id))||{}).label || '', String(s.n),
      rated ? `${s.yes} yes / ${s.some} some / ${s.no} no` : 'not rated',
      s.ttr.length ? `${fmtMins(median(s.ttr))} (n=${s.ttr.length})` : ''];
  });

  const pct = c => n ? `${Math.round(c/n*100)}%` : '';
  const triggerRows = countBy(recs.flatMap(r => r.m.triggers||[])).map(([k,c]) => [k, String(c), pct(c)]);
  const featureRows = [
    ...countBy(recs.map(r => migraineSide(r.m.regions))).map(([k,c]) => ['Side', k, String(c), pct(c)]),
    ...countBy(recs.flatMap(r => (r.m.regions||[]).filter(x => !['whole','moves'].includes(x)).map(x => { const t = M_REGIONS[x].replace(/^(Left|Right) /,'').replace(/^Behind (left|right) eye$/,'Behind eye'); return t.charAt(0).toUpperCase() + t.slice(1); }))).map(([k,c]) => ['Location', k, String(c), pct(c)]),
    ...countBy(recs.flatMap(r => r.m.quality||[])).map(([k,c]) => ['Quality', k, String(c), pct(c)]),
    ...countBy(recs.flatMap(r => r.m.aura||[])).map(([k,c]) => ['Aura', k, String(c), pct(c)]),
    ...countBy(recs.flatMap(r => r.m.symptoms||[])).map(([k,c]) => ['Symptom', k, String(c), pct(c)]),
    ...countBy(recs.flatMap(r => [...(r.m.places||[]), r.m.placeOther ? r.m.placeOther.trim() : ''])).map(([k,c]) => ['Where', k, String(c), pct(c)])
  ];
  const auraCount = recs.filter(r => (r.m.aura||[]).length).length;

  // Cycle (estimated)
  const cds = recs.map(r => cycleDayFor(r.d));
  const peri = cds.filter(cd => cd >= state.cycleLength - 1 || cd <= 3).length;

  // Sleep: night before migraine days vs every logged night in range
  const sleepAll = state.entries.filter(e => e.date >= start && e.date <= today && e.sleepHours !== undefined && e.sleepHours !== null).map(e => Number(e.sleepHours));
  const sleepMig = recs.filter(r => r.e && r.e.sleepHours !== undefined && r.e.sleepHours !== null).map(r => Number(r.e.sleepHours));
  const avg = a => a.length ? a.reduce((x,y) => x+y, 0) / a.length : null;
  const poorBefore = recs.filter(r => r.e && r.e.sleepQuality === 'poor').length;
  const shortBefore = sleepMig.filter(h => h < 6).length;

  // Weather
  const wx = recs.map(r => r.m.weather).filter(Boolean);
  const falling = wx.filter(w => wxTrend(w) === 'fall').length;
  const changes = wx.map(w => w.change24).filter(c => c !== null && c !== undefined);

  const impactRows = countBy(recs.flatMap(r => r.m.impact||[])).map(([k,c]) => [k, String(c)]);
  const hoursLost = recs.reduce((a, r) => a + (parseFloat(r.m.hoursLost) || 0), 0);

  const logRows = [...recs].reverse().map(({d, e, m}) => {
    const times = [];
    if(m.continued) times.push('cont. from prev day');
    else if(m.startTime) times.push('start ' + fmtTime(m.startTime));
    if(m.ongoingNextDay) times.push('past midnight');
    else if(m.endTime) times.push('end ' + fmtTime(m.endTime));
    const meds = migraineMeds(d, m).filter(x => x.included).map(x => x.label + (x.time ? ' ' + fmtTime(x.time) : '') + (x.helped ? ` (${({yes:'helped',some:'some',no:'no help'})[x.helped]})` : '')).join('; ');
    const relief = m.reliefTime ? fmtTime(m.reliefTime) + (m.reliefLevel ? ' ' + m.reliefLevel : '') : '';
    const pain = (m.pain !== null && m.pain !== undefined) ? `${m.pain}/10` : ((e && (e.severity||{}).migraine) || '');
    const loc = [migraineSide(m.regions), ...(m.aura||[]).length ? ['aura'] : []].filter(Boolean).join(', ');
    const sleep = e && e.sleepHours !== undefined && e.sleepHours !== null ? fmtSleep(e.sleepHours) + (e.sleepQuality ? ' ' + e.sleepQuality : '') : (e && e.sleepQuality) || '';
    return [fmtDateLong(d), String(cycleDayFor(d)), times.join(', '), pain, loc, meds, relief, (m.triggers||[]).join(', '), sleep];
  });

  return {start, end: today, rangeLabel, spanDays, n, episodes: episodes.length, per30: n ? (n / spanDays * 30) : 0,
    avgPain: pains.length ? avg(pains) : null, painN: pains.length, medDur: median(durations), durN: durations.length,
    monthRows, medRows, triggerRows, featureRows, auraCount, peri, cds,
    avgSleepAll: avg(sleepAll), avgSleepMig: avg(sleepMig), sleepMigN: sleepMig.length, poorBefore, shortBefore,
    wxN: wx.length, falling, medChange: median(changes), impactRows, hoursLost, reviewed: recs.filter(r => r.m.reviewed).length, logRows};
}

async function exportMigraineReport(){
  const btn = document.getElementById('m-export-pdf');
  const rangeId = (document.getElementById('m-range') || {}).value || '90';
  const reason = ((document.getElementById('m-reason') || {}).value || '').trim();
  try{ window.localStorage.setItem('hem-mig-range', rangeId); }catch(e){}
  const data = buildMigraineData(rangeId);
  if(!data.n){ alert('No migraine days in that range. Try a longer range.'); return; }
  if(btn){ btn.disabled = true; btn.textContent = 'Building PDF...'; }
  let jsPDF;
  try{ jsPDF = await loadPDF(); }
  catch(e){
    alert("Couldn't load the PDF tool. Check your connection and try again.");
    if(btn){ btn.disabled = false; btn.textContent = 'Create migraine report (PDF)'; }
    return;
  }
  const doc = new jsPDF({unit:'pt', format:'letter'});
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const M = 48;
  const ink = [43,40,34], soft = [107,101,88], plum = [107,76,107], line = [221,214,200];
  let y = M;

  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(...ink);
  doc.text('Migraine Summary', M, y);
  y += 18;
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...soft);
  doc.text(pdfText(`${fmtDateLong(data.start)} - ${fmtDateLong(data.end)}  (${data.rangeLabel})  |  Generated ${fmtDateLong(todayISO())}`), M, y);
  y += 10;
  doc.setDrawColor(...line); doc.setLineWidth(0.75); doc.line(M, y, W - M, y);
  y += 20;

  if(reason){
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
    const lines = doc.splitTextToSize(pdfText(reason), W - 2*M - 24);
    const boxH = 30 + lines.length * 13;
    doc.setFillColor(243,237,243); doc.roundedRect(M, y, W - 2*M, boxH, 5, 5, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...plum);
    doc.text('QUESTIONS / REASON FOR VISIT', M + 12, y + 16);
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(...ink);
    doc.text(lines, M + 12, y + 31);
    y += boxH + 14;
  }
  const background = DOCTOR_FIELDS.filter(fd => fd.key !== 'hem-doctor-notes').map(fd => [fd.label, readDoctorField(fd.key).trim()]).filter(([,v]) => v);
  if(background.length){
    doc.autoTable({startY: y, margin:{left:M, right:M}, theme:'plain',
      body: background.map(([k,v]) => [pdfText(k), pdfText(v)]),
      styles:{font:'helvetica', fontSize:10, textColor:ink, cellPadding:{top:3,bottom:3,left:0,right:6}, valign:'top'},
      columnStyles:{0:{cellWidth:150, fontStyle:'bold', textColor:soft}}});
    y = doc.lastAutoTable.finalY + 14;
  }

  const tiles = [
    ['Migraine days', String(data.n)],
    ['Per 30 days', data.per30.toFixed(1)],
    ['Avg peak pain', data.avgPain !== null ? data.avgPain.toFixed(1) + '/10' : '-'],
    ['Median duration', data.medDur !== null ? fmtMins(data.medDur) : '-']
  ];
  const tileW = (W - 2*M - 3*10) / 4;
  tiles.forEach(([label, val], i) => {
    const x = M + i*(tileW + 10);
    doc.setFillColor(246,243,236); doc.roundedRect(x, y, tileW, 46, 5, 5, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(...ink);
    doc.text(val, x + 10, y + 21);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...soft);
    doc.text(label, x + 10, y + 36);
  });
  y += 58;
  const metaBits = [];
  if(data.episodes !== data.n) metaBits.push(`${data.n} migraine days make up ${data.episodes} separate migraines (some lasted overnight).`);
  if(data.painN < data.n) metaBits.push(`Pain score recorded on ${data.painN} of ${data.n} days.`);
  if(data.durN) metaBits.push(`Duration based on ${data.durN} migraine${data.durN===1?'':'s'} with start and end times.`);
  if(data.auraCount) metaBits.push(`Aura on ${data.auraCount} of ${data.n} migraine days.`); else if(data.reviewed) metaBits.push('No aura recorded on days with details.');
  if(data.hoursLost) metaBits.push(`About ${Math.round(data.hoursLost*10)/10} hours lost in total.`);
  if(metaBits.length){
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...soft);
    const ml = doc.splitTextToSize(pdfText(metaBits.join(' ')), W - 2*M);
    doc.text(ml, M, y);
    y += ml.length * 11 + 14;
  }

  const heading = (t) => {
    if(y > H - 90){ doc.addPage(); y = M; }
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...plum);
    doc.text(t, M, y); y += 8;
  };
  const note = (t) => {
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...soft);
    const nl = doc.splitTextToSize(pdfText(t), W - 2*M);
    if(y + nl.length * 11 > H - 50){ doc.addPage(); y = M; }
    doc.text(nl, M, y);
    y += nl.length * 11 + 14;
  };
  const tableStyle = {
    margin: {left:M, right:M},
    styles: {font:'helvetica', fontSize:9, textColor:ink, cellPadding:4, lineColor:line, lineWidth:0.5, valign:'top', overflow:'linebreak'},
    headStyles: {fillColor:[239,234,224], textColor:ink, fontStyle:'bold'},
    alternateRowStyles: {fillColor:[251,249,244]},
    theme: 'grid'
  };
  const after = () => { y = doc.lastAutoTable.finalY + 22; };
  const clean = rows => rows.map(r => r.map(pdfText));

  heading('Pain-reliever days per month (medication overuse check)');
  doc.autoTable({...tableStyle, startY: y,
    head: [['Month','Migraine days','Any pain reliever','Triptan / combo / opioid','Simple analgesic','Status']],
    body: clean(data.monthRows),
    columnStyles: {0:{fontStyle:'bold'}, 1:{halign:'center'}, 2:{halign:'center'}, 3:{halign:'center'}, 4:{halign:'center'}},
    didParseCell: h => { if(h.section === 'body' && h.column.index === 5){ if(h.cell.raw === RESCUE_STATUS.over){ h.cell.styles.textColor = [140,74,91]; h.cell.styles.fontStyle = 'bold'; } else if(h.cell.raw === RESCUE_STATUS.warn) h.cell.styles.textColor = [138,91,28]; } }
  });
  after();
  note('Counts every logged day with that kind of medication, not only migraine days. Overuse range: 10+ days/month of triptans, combination analgesics, opioids or ergots, or 15+ days/month of simple analgesics (ibuprofen, naproxen, acetaminophen, aspirin). Days with no meds logged count as none.');

  if(data.medRows.length){
    heading('Medications taken for migraine');
    doc.autoTable({...tableStyle, startY: y,
      head: [['Medication','Type','Migraine days','Did it help?','Median time to relief']],
      body: clean(data.medRows), columnStyles: {0:{fontStyle:'bold'}, 2:{halign:'center'}}});
    after();
    note('Time to relief is measured from the first dose that day to when relief was first noticed.');
  }

  if(data.triggerRows.length){
    heading('Suspected triggers');
    doc.autoTable({...tableStyle, startY: y, head: [['Trigger','Migraine days','% of migraine days']],
      body: clean(data.triggerRows), columnStyles: {1:{halign:'center'}, 2:{halign:'center'}}});
    after();
  }

  if(data.featureRows.length){
    heading('What the migraines are like');
    doc.autoTable({...tableStyle, startY: y, head: [['','Detail','Days','%']],
      body: clean(data.featureRows), columnStyles: {0:{fontStyle:'bold', cellWidth:70, textColor:soft}, 2:{halign:'center', cellWidth:50}, 3:{halign:'center', cellWidth:50}}});
    after();
  }

  heading('Sleep, cycle and weather');
  const ctx = [];
  if(data.sleepMigN){
    ctx.push(['Sleep the night before', `Avg ${fmtSleep(Math.round(data.avgSleepMig*100)/100)} before migraine days (n=${data.sleepMigN})` + (data.avgSleepAll !== null ? ` vs ${fmtSleep(Math.round(data.avgSleepAll*100)/100)} across all logged nights` : '') + `. Under 6h before ${data.shortBefore}; rated poor before ${data.poorBefore}.`]);
  } else ctx.push(['Sleep the night before', 'Not logged for these days.']);
  ctx.push(['Est. cycle day', `${data.peri} of ${data.n} fell within 2 days before to 3 days after est. day 1. Cycle days: ${[...data.cds].sort((a,b)=>a-b).join(', ')}.`]);
  if(data.wxN){
    ctx.push(['Barometric pressure', `Falling (3+ hPa drop in the prior 24h) at start on ${data.falling} of ${data.wxN} days with weather.` + (data.medChange !== null ? ` Median 24h change ${data.medChange > 0 ? '+' : ''}${data.medChange.toFixed(1)} hPa.` : '')]);
  }
  if(data.impactRows.length) ctx.push(['Impact', data.impactRows.map(([k,c]) => `${k}: ${c}`).join('; ') + '.']);
  doc.autoTable({startY: y, margin:{left:M, right:M}, theme:'plain', body: clean(ctx),
    styles:{font:'helvetica', fontSize:9.5, textColor:ink, cellPadding:{top:3,bottom:4,left:0,right:6}, valign:'top'},
    columnStyles:{0:{cellWidth:130, fontStyle:'bold', textColor:soft}}});
  y = doc.lastAutoTable.finalY + 10;
  note(`Cycle days are estimates from a ${state.cycleLength}-day cycle counted from ${fmtDateLong(getAnchorDate())}, not recorded period dates. Weather is from Open-Meteo for the start hour (noon if no start time).`);

  heading('Migraine log (most recent first)');
  doc.autoTable({...tableStyle, startY: y,
    head: [['Date','Cycle day','Timing','Pain','Side / aura','Meds (time, response)','Relief','Triggers','Sleep before']],
    body: clean(data.logRows), showHead: 'everyPage',
    styles: {...tableStyle.styles, fontSize:7.5, cellPadding:3},
    columnStyles: {0:{cellWidth:58}, 1:{halign:'center', cellWidth:32}, 2:{cellWidth:62}, 3:{cellWidth:34, halign:'center'}, 4:{cellWidth:48}, 5:{cellWidth:90}, 6:{cellWidth:44}, 7:{cellWidth:85}}});

  const pages = doc.internal.getNumberOfPages();
  for(let i = 1; i <= pages; i++){
    doc.setPage(i);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...soft);
    doc.text('Self-reported migraine log. Counts and patterns are descriptive, not a diagnosis.', M, H - 24);
    doc.text(`Page ${i} of ${pages}`, W - M, H - 24, {align:'right'});
  }

  const filename = `Migraine-Summary-${data.start}-to-${data.end}.pdf`;
  const blob = doc.output('blob');
  let shared = false;
  try{
    const file = new File([blob], filename, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Migraine summary'});
      shared = true;
    }
  }catch(e){ if(e && e.name === 'AbortError') shared = true; }
  if(!shared){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  if(btn){ btn.disabled = false; btn.textContent = 'Create migraine report (PDF)'; }
}

function exportMigraineCSV(){
  const rangeId = (document.getElementById('m-range') || {}).value || '90';
  const data = buildMigraineData(rangeId);
  const dates = migraineDates().slice().reverse().filter(d => d >= data.start);
  if(!dates.length){ alert('No migraine days in that range.'); return; }
  const rows = [['Date','Weekday','Est. cycle day','Continued from previous day','Start','End','Past midnight','Relief noticed','Relief level','Hem severity','Peak pain (0-10)','Pain location','Side','Pain quality','Where','Aura','Symptoms','Triggers','Meds for migraine (time, helped)','Meds unchecked','Sleep night before','Sleep quality','Pressure (inHg)','24h pressure change (hPa)','Temp (F)','Humidity (%)','Conditions','Impact','Hours lost','Notes','Hem notes']];
  dates.forEach(d => {
    const e = entryFor(d), m = migraineFor(d);
    const meds = migraineMeds(d, m);
    const w = m.weather;
    rows.push([d, fmtWeekday(d), cycleDayFor(d), m.continued ? 'Yes' : '', m.startTime ? fmtTime(m.startTime) : '', m.endTime ? fmtTime(m.endTime) : '', m.ongoingNextDay ? 'Yes' : '',
      m.reliefTime ? fmtTime(m.reliefTime) : '', m.reliefLevel || '', (e && (e.severity||{}).migraine) || '', (m.pain === null || m.pain === undefined) ? '' : m.pain,
      (m.regions||[]).map(x => M_REGIONS[x]).join('; '), migraineSide(m.regions), (m.quality||[]).join('; '),
      [...(m.places||[]), m.placeOther].filter(Boolean).join('; '), (m.aura||[]).join('; '), (m.symptoms||[]).join('; '), (m.triggers||[]).join('; '),
      meds.filter(x => x.included).map(x => x.label + (x.time ? ' ' + fmtTime(x.time) : '') + (x.helped ? ` (${x.helped})` : '')).join('; '),
      meds.filter(x => !x.included).map(x => x.label).join('; '),
      e && e.sleepHours !== undefined && e.sleepHours !== null ? fmtSleep(e.sleepHours) : '', (e && e.sleepQuality) || '',
      w ? inHg(w.pressure) : '', w && w.change24 !== null && w.change24 !== undefined ? w.change24 : '', w ? Math.round(w.temp) : '', w ? Math.round(w.humidity) : '', w ? wxLabel(w.code) : '',
      (m.impact||[]).join('; '), m.hoursLost || '', (m.notes||'').replace(/\n/g,' '), ((e && e.notes) || '').replace(/\n/g,' ')]);
  });
  const csv = rows.map(r => r.map(f => '"' + String(f).replace(/"/g,'""') + '"').join(',')).join('\n');
  triggerDownload(csv, `migraines-${data.start}-to-${data.end}.csv`, 'text/csv');
}

function escapeHtml(str){
  return (str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  document.getElementById('today-label').textContent = new Date().toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric', year:'numeric'});
  const mig = state.view === 'migraine';
  document.getElementById('page-title').textContent = mig ? 'Brainstorm' : 'Symptom log';
  document.getElementById('page-eyebrow').textContent = mig ? 'Hem · Migraine' : 'Hem';
  ['log','history','patterns','migraine'].forEach(v => {
    document.getElementById('tab-'+v).classList.toggle('active', state.view === v);
  });
  const main = document.getElementById('main');
  if(!state.loaded){
    main.innerHTML = `<div class="empty-state"><p>Loading…</p></div>`;
    return;
  }
  if(state.view === 'log') main.innerHTML = renderLog();
  else if(state.view === 'history') main.innerHTML = renderHistory();
  else if(state.view === 'migraine') main.innerHTML = renderMigraine();
  else main.innerHTML = renderPatterns();
  attachHandlers();
  attachMigraineHandlers();
}

function attachHandlers(){
  document.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', () => toggleSymptom(el.getAttribute('data-toggle')));
  });
  document.querySelectorAll('[data-remove-custom]').forEach(el => {
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      removeCustomSymptom(el.getAttribute('data-remove-custom'));
    });
  });
  document.querySelectorAll('[data-toggle-med]').forEach(el => {
    el.addEventListener('click', () => toggleMed(el.getAttribute('data-toggle-med')));
  });
  document.querySelectorAll('[data-remove-med]').forEach(el => {
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      removeCustomMed(el.getAttribute('data-remove-med'));
    });
  });
  document.querySelectorAll('[data-severity]').forEach(el => {
    el.addEventListener('click', () => setSeverity(el.getAttribute('data-severity'), el.getAttribute('data-level')));
  });
  document.querySelectorAll('[data-vyvanse]').forEach(el => {
    el.addEventListener('click', () => setVyvanse(el.getAttribute('data-vyvanse')));
  });
  document.querySelectorAll('[data-timing]').forEach(el => {
    el.addEventListener('click', () => setMedTiming(el.getAttribute('data-timing'), el.getAttribute('data-timing-val')));
  });
  document.querySelectorAll('[data-loc]').forEach(el => {
    el.addEventListener('click', () => togglePainLocation(el.getAttribute('data-loc'), el.getAttribute('data-loc-val')));
  });
  document.querySelectorAll('[data-sleepq]').forEach(el => {
    el.addEventListener('click', () => setSleepQuality(el.getAttribute('data-sleepq')));
  });
  document.querySelectorAll('[data-medtime]').forEach(el => {
    el.addEventListener('input', e => {
      const id = el.getAttribute('data-medtime');
      if(e.target.value) state.form.medTimes[id] = e.target.value;
      else delete state.form.medTimes[id];
    });
  });
  document.querySelectorAll('[data-remove-daily]').forEach(el => {
    el.addEventListener('click', (ev) => { ev.stopPropagation(); removeCustomDailyMed(el.getAttribute('data-remove-daily')); });
  });
  const pasteSleepBtn = document.getElementById('paste-sleep-btn');
  if(pasteSleepBtn) pasteSleepBtn.addEventListener('click', pasteSleep);
  const sleepHoursInput = document.getElementById('sleep-hours-input');
  if(sleepHoursInput) sleepHoursInput.addEventListener('input', e => { state.form.sleepHours = e.target.value; });
  const otherDailyInput = document.getElementById('other-daily-meds-input');
  if(otherDailyInput) otherDailyInput.addEventListener('input', e => { state.form.otherDailyMeds = e.target.value; });
  const noSymToggleEl = document.getElementById('no-symptoms-toggle');
  if(noSymToggleEl) noSymToggleEl.addEventListener('click', toggleNoSymptomsForm);
  const cleanDayBtn = document.getElementById('clean-day-btn');
  if(cleanDayBtn) cleanDayBtn.addEventListener('click', logCleanDay);
  const dateInput = document.getElementById('date-input');
  if(dateInput) dateInput.addEventListener('change', e => { state.form.date = e.target.value; render(); });
  const otherInput = document.getElementById('other-input');
  if(otherInput) otherInput.addEventListener('input', e => { state.form.other = e.target.value; });
  const otherMedsInput = document.getElementById('other-meds-input');
  if(otherMedsInput) otherMedsInput.addEventListener('input', e => { state.form.otherMeds = e.target.value; });
  const notesInput = document.getElementById('notes-input');
  if(notesInput) notesInput.addEventListener('input', e => { state.form.notes = e.target.value; });
  const saveBtn = document.getElementById('save-btn');
  if(saveBtn) saveBtn.addEventListener('click', saveEntry);
  const cancelEditBtn = document.getElementById('cancel-edit-btn');
  if(cancelEditBtn) cancelEditBtn.addEventListener('click', cancelEdit);
  document.querySelectorAll('[data-edit]').forEach(el => {
    el.addEventListener('click', () => editEntry(el.getAttribute('data-edit')));
  });
  document.querySelectorAll('[data-del]').forEach(el => {
    el.addEventListener('click', () => {
      if(confirm('Delete this entry?')) deleteEntry(el.getAttribute('data-del'));
    });
  });
  const cycleInput = document.getElementById('cycle-input');
  if(cycleInput) cycleInput.addEventListener('change', e => updateCycleLength(e.target.value));
  const anchorInput = document.getElementById('anchor-input');
  if(anchorInput) anchorInput.addEventListener('change', e => updateCycleAnchor(e.target.value));
  const resetAnchorBtn = document.getElementById('reset-anchor-btn');
  if(resetAnchorBtn) resetAnchorBtn.addEventListener('click', resetCycleAnchor);
  const applySuggestedCycleBtn = document.getElementById('apply-suggested-cycle-btn');
  if(applySuggestedCycleBtn) applySuggestedCycleBtn.addEventListener('click', () => {
    updateCycleLength(applySuggestedCycleBtn.getAttribute('data-length'));
    updateCycleAnchor(applySuggestedCycleBtn.getAttribute('data-anchor'));
  });
  const historySearch = document.getElementById('history-search');
  if(historySearch) historySearch.addEventListener('input', e => {
    state.historyFilter = e.target.value;
    const cursorPos = e.target.selectionStart;
    render();
    const freshInput = document.getElementById('history-search');
    if(freshInput){ freshInput.focus(); freshInput.setSelectionRange(cursorPos, cursorPos); }
  });
  const historyMonthFilter = document.getElementById('history-month-filter');
  if(historyMonthFilter) historyMonthFilter.addEventListener('change', e => {
    state.historyMonth = e.target.value;
    render();
  });
  const historyDayFilter = document.getElementById('history-day-filter');
  if(historyDayFilter) historyDayFilter.addEventListener('change', e => {
    state.historyDay = e.target.value;
    render();
  });
  const historySortToggle = document.getElementById('history-sort-toggle');
  if(historySortToggle) historySortToggle.addEventListener('click', () => {
    state.historySort = state.historySort === 'cycleDay' ? 'date' : 'cycleDay';
    render();
  });
  const clearBtn = document.getElementById('clear-data-btn');
  if(clearBtn) clearBtn.addEventListener('click', async () => {
    if(confirm('Delete all logged entries? This cannot be undone.')){
      state.entries = [];
      await saveData();
      render();
    }
  });
  const exportBackupBtn = document.getElementById('export-backup-btn');
  if(exportBackupBtn) exportBackupBtn.addEventListener('click', exportBackup);
  const exportCsvBtn = document.getElementById('export-csv-btn');
  if(exportCsvBtn) exportCsvBtn.addEventListener('click', exportCSV);
  const exportDoctorBtn = document.getElementById('export-doctor-btn');
  if(exportDoctorBtn) exportDoctorBtn.addEventListener('click', exportDoctorReport);
  const doctorReason = document.getElementById('doctor-reason');
  document.querySelectorAll('[data-doctor-key]').forEach(el => {
    el.addEventListener('input', () => { try{ window.localStorage.setItem(el.getAttribute('data-doctor-key'), el.value); }catch(e){} });
  });
  if(doctorReason) doctorReason.addEventListener('input', () => { try{ window.localStorage.setItem('hem-doctor-reason', doctorReason.value); }catch(e){} });
  const doctorLog = document.getElementById('doctor-include-log');
  if(doctorLog) doctorLog.addEventListener('change', () => { try{ window.localStorage.setItem('hem-doctor-log', doctorLog.checked ? '1' : '0'); }catch(e){} });
  const importBtn = document.getElementById('import-backup-btn');
  const importInput = document.getElementById('import-file-input');
  if(importBtn && importInput){
    importBtn.addEventListener('click', () => importInput.click());
    importInput.addEventListener('change', (e) => {
      if(e.target.files && e.target.files[0]) importBackupFile(e.target.files[0]);
    });
  }
  const importSleepBtn = document.getElementById('import-sleep-btn');
  const importSleepInput = document.getElementById('import-sleep-input');
  if(importSleepBtn && importSleepInput){
    importSleepBtn.addEventListener('click', () => importSleepInput.click());
    importSleepInput.addEventListener('change', (e) => {
      if(e.target.files && e.target.files[0]) importSleepFile(e.target.files[0]);
      e.target.value = '';
    });
  }
}

document.querySelectorAll('nav.tabbar button').forEach(btn => {
  btn.addEventListener('click', () => setView(btn.getAttribute('data-view')));
});

loadData();
</script>
</body>
</html>
