<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F6F3EC">
<link rel="apple-touch-icon" href="hem-icon.png">
<link rel="icon" href="hem-icon.png">
<title>Hem — symptom log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F3EC;
    --bg-alt:#EFEAE0;
    --card:#FBF9F4;
    --ink:#2B2822;
    --ink-soft:#6B6558;
    --line:#DDD6C8;
    --plum:#6B4C6B;
    --plum-dark:#5A3E5A;
    --sage:#6F8368;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;margin:0;letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  #shell{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  header{
    padding:28px 20px 18px;
    border-bottom:1px solid var(--line);
  }
  header .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  header h1{font-size:26px;}
  header .today{
    margin-top:4px;
    font-size:13px;
    color:var(--ink-soft);
  }
  main{
    flex:1;
    padding:20px 20px 100px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:16px;
  }
  .section-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:10px;
    display:block;
  }
  .banner{
    font-size:12px;
    color:#8C4A5B;
    background:#F3E7E4;
    border:1px solid #E2C9C4;
    border-radius:10px;
    padding:9px 12px;
    margin-bottom:16px;
  }
  .banner.nudge{
    color:var(--plum);
    background:#EFE7EC;
    border-color:#DCC9D6;
  }
  .link-btn{
    background:none;
    border:none;
    color:var(--plum);
    text-decoration:underline;
    font-size:12px;
    cursor:pointer;
    font-family:inherit;
    padding:0;
    display:block;
  }
  input[type="date"], input[type="number"], input[type="text"], textarea{
    width:100%;
    max-width:100%;
    min-width:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--ink);
    background:var(--bg-alt);
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 12px;
    outline:none;
  }
  input[type="date"]{
    appearance:none;
    -webkit-appearance:none;
  }
  input:focus, textarea:focus{
    border-color:var(--plum);
  }
  textarea{resize:vertical;min-height:64px;font-family:inherit;}
  .symptom-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .symptom-category{
    margin-bottom:14px;
  }
  .symptom-category:last-child{
    margin-bottom:0;
  }
  .symptom-category-label{
    font-size:11.5px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .symptom-toggle{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 10px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--bg-alt);
    cursor:pointer;
    user-select:none;
    font-size:13.5px;
    line-height:1.25;
    position:relative;
  }
  .chip-remove{
    margin-left:auto;
    padding-left:6px;
    font-size:15px;
    line-height:1;
    color:var(--ink-soft);
  }
  .symptom-toggle.active .chip-remove{color:rgba(255,255,255,0.7);}
  .symptom-toggle .dot{
    width:9px;height:9px;border-radius:50%;flex:none;
    border:1px solid rgba(0,0,0,0.15);
  }
  .symptom-toggle.active{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }
  .symptom-toggle.active .dot{border-color:rgba(255,255,255,0.5);}
  label.field-label{
    display:block;
    font-size:12.5px;
    color:var(--ink-soft);
    margin:14px 0 6px;
  }
  .hint{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
  button.primary{
    width:100%;
    margin-top:18px;
    padding:13px;
    border:none;
    border-radius:10px;
    background:var(--plum);
    color:#fff;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  button.primary:active{background:var(--plum-dark);}
  button.primary.saved{background:var(--sage);}
  .secondary-btn{
    display:block;
    width:100%;
    margin-bottom:8px;
    padding:11px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--bg-alt);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:13.5px;
    cursor:pointer;
  }
  .secondary-btn:last-of-type{margin-bottom:0;}
  .secondary-btn:active{background:var(--line);}
  .secondary-btn.mt{margin-top:10px;}
  .severity-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:4px;
  }
  .severity-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    flex-wrap:wrap;
  }
  .severity-row-label{font-size:13px;color:var(--ink);flex:1;min-width:0;}
  .severity-btns{display:flex;gap:6px;flex:none;}
  .sev-btn{
    border:1px solid var(--line);
    background:var(--bg-alt);
    color:var(--ink-soft);
    border-radius:20px;
    padding:5px 10px;
    font-size:11px;
    font-family:'Inter',sans-serif;
    text-transform:capitalize;
    cursor:pointer;
  }
  .sev-btn.active{
    background:var(--plum);
    border-color:var(--plum);
    color:#fff;
  }
  .sev-dot{
    font-size:7px;
    letter-spacing:-1px;
    opacity:0.9;
  }
  .empty-state{
    text-align:center;
    padding:36px 16px;
    color:var(--ink-soft);
  }
  .empty-state h3{font-size:17px;color:var(--ink);margin-bottom:6px;}
  .empty-state p{font-size:13.5px;margin:0;}
  .month-header{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:20px 0 8px;
  }
  .month-header:first-child{margin-top:0;}
  .entry-row{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:10px;
  }
  .entry-row .top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
  }
  .entry-row .date{font-weight:600;font-size:15px;}
  .entry-row .weekday{font-size:11.5px;color:var(--ink-soft);margin-left:6px;font-weight:400;}
  .entry-row .cycle-day{
    font-size:10.5px;
    color:var(--plum);
    background:var(--bg-alt);
    border-radius:20px;
    padding:2px 8px;
    margin-left:8px;
    font-family:'IBM Plex Mono',monospace;
  }
  .entry-row .del{
    background:none;border:none;color:var(--ink-soft);
    font-size:12px;cursor:pointer;padding:4px 2px;
    font-family:'IBM Plex Mono',monospace;
    margin-left:10px;
  }
  .entry-row .del:first-of-type{margin-left:0;}
  .entry-row .del:active{color:#8C4A5B;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
  .tag{
    font-size:11.5px;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
    font-weight:500;
  }
  .entry-row .notes{font-size:13px;color:var(--ink-soft);margin-top:4px;}
  .wheel-wrap{display:flex;justify-content:center;margin:6px 0 4px;}
  .legend{
    display:flex;
    flex-direction:column;
    gap:7px;
    margin-top:16px;
  }
  .legend-row{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:13px;
  }
  .legend-row .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .legend-row .count{margin-left:auto;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .cycle-input-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
  }
  .cycle-input-row input{width:72px;flex:none;}
  .cycle-input-row span{font-size:13px;color:var(--ink-soft);}
  nav.tabbar{
    position:fixed;
    bottom:0;left:0;right:0;
    max-width:480px;
    margin:0 auto;
    background:var(--card);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 10px calc(10px + env(safe-area-inset-bottom));
  }
  nav.tabbar button{
    flex:1;
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:6px 4px;
    cursor:pointer;
    color:var(--ink-soft);
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:500;
  }
  nav.tabbar button.active{color:var(--plum);}
  nav.tabbar svg{width:20px;height:20px;}
  .footer-note{
    text-align:center;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:22px;
  }
  .footer-note button{
    background:none;border:none;color:var(--ink-soft);
    text-decoration:underline;font-size:11.5px;cursor:pointer;
    font-family:inherit;padding:0;
  }
</style>
</head>
<body>
<div id="shell">
  <header>
    <div class="eyebrow">Hem</div>
    <h1>Symptom log</h1>
    <div class="today mono" id="today-label"></div>
  </header>
  <main id="main"></main>
  <nav class="tabbar">
    <button data-view="log" id="tab-log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z" stroke-linejoin="round"/><path d="M8 2v4M16 2v4M4 10h16"/></svg>
      Log
    </button>
    <button data-view="history" id="tab-history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      History
    </button>
    <button data-view="patterns" id="tab-patterns">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="5.5" r="1.1" fill="currentColor" stroke="none"/></svg>
      Patterns
    </button>
  </nav>
</div>

<script>
const BASE_SYMPTOMS = [
  {id:'nausea', label:'Nausea', color:'#6F8368'},
  {id:'migraine', label:'Migraine', color:'#6B4C6B'},
  {id:'anxiety', label:'Anxiety', color:'#4F5D75'},
  {id:'irritable', label:'Irritable', color:'#A9724F'},
  {id:'bowel-frequent', label:'Small, frequent bowel movements', color:'#8C4A5B'},
  {id:'bowel-loose', label:'Loose bowel movement', color:'#9C6B4F'},
  {id:'rlq-pain', label:'Lower right quadrant pain', color:'#5A5A8C'},
  {id:'insomnia', label:'Insomnia', color:'#B08A3E'},
];
const CUSTOM_PALETTE = ['#7C9A92','#8A8272','#4F7A6B','#7A5C6B','#5C7A9C','#9C8A4F','#6B4A5C','#5C8A5C','#8A5C4A','#4A6B8A'];
const BASE_MEDS = [
  {id:'ibuprofen', label:'Ibuprofen', color:'#3E6E8E'},
  {id:'tylenol', label:'Tylenol', color:'#5C7A5C'},
  {id:'famotidine', label:'Famotidine', color:'#6E5C8E'},
  {id:'zofran', label:'Zofran', color:'#8E6E3E'},
  {id:'gas-medicine', label:'Gas medicine', color:'#5C8A8A'},
];
const MEDS_CUSTOM_PALETTE = ['#4A6B8A','#6B4A8A','#8A6B4A','#4A8A6B','#8A4A6B','#6B8A4A','#4A4A8A','#8A8A4A'];
const STORAGE_KEY = 'loop-tracker-data';

// Groups symptoms into categories on the Log tab so the list is easier to
// scan. Each built-in symptom gets an explicit category; a symptom you add
// yourself is sorted in automatically by matching keywords in its label —
// no extra tapping required, and nothing is stored, so it stays in sync
// even if you rename how you think about it.
const SYMPTOM_CATEGORIES = ['Mood & emotional', 'Head & sleep', 'Digestive', 'Pain & body', 'Other'];
const CATEGORY_KEYWORDS = {
  'Mood & emotional': ['anxi','irritab','mood','cry','fight','angry','sad','stress','overwhelm','depress','argu'],
  'Head & sleep': ['migrain','headache','insomnia','sleep','tired','fatigue','dizzy','brain fog','brain','energy'],
  'Digestive': ['nausea','bowel','stomach','gas','bloat','reflux','constipat','diarrhea','vomit','gut','appetite'],
  'Pain & body': ['pain','ache','cramp','sore','tender','breast','groin','neck','back','joint','muscle','quadrant','headache']
};
const BASE_SYMPTOM_CATEGORY = {
  'nausea': 'Digestive',
  'migraine': 'Head & sleep',
  'anxiety': 'Mood & emotional',
  'irritable': 'Mood & emotional',
  'bowel-frequent': 'Digestive',
  'bowel-loose': 'Digestive',
  'rlq-pain': 'Pain & body',
  'insomnia': 'Head & sleep'
};
function categoryFor(symptom){
  if(BASE_SYMPTOM_CATEGORY[symptom.id]) return BASE_SYMPTOM_CATEGORY[symptom.id];
  const label = symptom.label.toLowerCase();
  for(const cat of SYMPTOM_CATEGORIES){
    const keywords = CATEGORY_KEYWORDS[cat];
    if(keywords && keywords.some(k => label.includes(k))) return cat;
  }
  return 'Other';
}

const SEVERITY_LEVELS = ['mild', 'moderate', 'severe'];
const SEVERITY_DOTS = {mild: '●', moderate: '●●', severe: '●●●'};

let storageAvailable = true;
let state = {
  entries: [],
  cycleLength: 28,
  cycleAnchor: null, // manually-set "day 1" date; null = default to earliest entry
  customSymptoms: [],
  customMeds: [],
  loaded: false,
  view: 'log',
  historyFilter: '',
  editing: null, // date string of the entry currently being edited, or null
  justSaved: false, // briefly true right after a successful save, to show a checkmark
  form: { date: todayISO(), symptoms: new Set(), meds: new Set(), other: '', otherMeds: '', notes: '', severity: {} }
};

// The date cycle day 1 counts from — a manual override if set, otherwise
// the earliest logged entry. Shared by History's day badges and the
// Patterns wheel so they always agree.
function getAnchorDate(){
  if(state.cycleAnchor) return state.cycleAnchor;
  if(state.entries.length === 0) return todayISO();
  const sorted = [...state.entries].sort((a,b) => a.date < b.date ? -1 : 1);
  return sorted[0].date;
}
function cycleDayFor(dateISO){
  const cycleLength = state.cycleLength;
  const anchor = getAnchorDate();
  const raw = daysBetween(anchor, dateISO) % cycleLength;
  return (((raw % cycleLength) + cycleLength) % cycleLength) + 1;
}

function allSymptoms(){
  return BASE_SYMPTOMS.concat(state.customSymptoms);
}
function allMeds(){
  return BASE_MEDS.concat(state.customMeds);
}
function todayISO(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,10);
}
function fmtDate(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
}
function fmtWeekday(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString(undefined, {weekday:'short'});
}
function fmtMonthHeader(iso){
  const [y,m] = iso.split('-').map(Number);
  return new Date(y,m-1,1).toLocaleDateString(undefined, {month:'long', year:'numeric'});
}
function daysBetween(aISO, bISO){
  const [ay,am,ad]=aISO.split('-').map(Number);
  const [by,bm,bd]=bISO.split('-').map(Number);
  const a = Date.UTC(ay,am-1,ad);
  const b = Date.UTC(by,bm-1,bd);
  return Math.round((b-a)/86400000);
}
function slugify(str){
  return str.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}

// Uses the browser's own local storage — works entirely on your device,
// with no dependency on Claude's servers, so it's reliable once this page
// is loaded as a real published link in Safari (not previewed in Claude).
function loadData(){
  try{
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state.entries = parsed.entries || [];
      state.cycleLength = parsed.cycleLength || 28;
      state.cycleAnchor = parsed.cycleAnchor || null;
      state.customSymptoms = parsed.customSymptoms || [];
      state.customMeds = parsed.customMeds || [];
    }
  }catch(e){
    storageAvailable = false;
    console.error('Storage unavailable:', e);
  }
  state.loaded = true;
  render();
}

function saveData(){
  try{
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify({
      entries: state.entries,
      cycleLength: state.cycleLength,
      cycleAnchor: state.cycleAnchor,
      customSymptoms: state.customSymptoms,
      customMeds: state.customMeds
    }));
    storageAvailable = true;
    return true;
  }catch(e){
    storageAvailable = false;
    console.error('Storage error:', e);
    return false;
  }
}

function setView(v){
  state.view = v;
  render();
}
function toggleSymptom(id){
  if(state.form.symptoms.has(id)){
    state.form.symptoms.delete(id);
    delete state.form.severity[id];
  } else {
    state.form.symptoms.add(id);
  }
  render();
}
function setSeverity(id, level){
  if(state.form.severity[id] === level) delete state.form.severity[id];
  else state.form.severity[id] = level;
  render();
}
function toggleMed(id){
  if(state.form.meds.has(id)) state.form.meds.delete(id);
  else state.form.meds.add(id);
  render();
}
// Splits a comma-separated field so multiple typed items each become
// their own separate, reusable option in the given list.
function resolveOtherItems(text, allItemsFn, customArray, palette){
  const labels = text.split(',').map(s => s.trim()).filter(Boolean);
  const ids = [];
  for(const label of labels){
    let id = slugify(label);
    if(!id) continue;
    const existing = allItemsFn().find(s => s.id === id || s.label.toLowerCase() === label.toLowerCase());
    if(existing){
      ids.push(existing.id);
      continue;
    }
    const color = palette[customArray.length % palette.length];
    customArray.push({id, label, color});
    ids.push(id);
  }
  return ids;
}
function resolveOtherSymptoms(text){
  return resolveOtherItems(text, allSymptoms, state.customSymptoms, CUSTOM_PALETTE);
}
function resolveOtherMeds(text){
  return resolveOtherItems(text, allMeds, state.customMeds, MEDS_CUSTOM_PALETTE);
}

async function removeCustomSymptom(id){
  if(!confirm('Remove this symptom option? It will also be cleared from any past entries.')) return;
  state.customSymptoms = state.customSymptoms.filter(s => s.id !== id);
  state.entries = state.entries.map(e => ({...e, symptoms: e.symptoms.filter(sid => sid !== id)}));
  await saveData();
  render();
}
async function removeCustomMed(id){
  if(!confirm('Remove this med option? It will also be cleared from any past entries.')) return;
  state.customMeds = state.customMeds.filter(s => s.id !== id);
  state.entries = state.entries.map(e => ({...e, meds: (e.meds||[]).filter(mid => mid !== id)}));
  await saveData();
  render();
}

function editEntry(date){
  const entry = state.entries.find(e => e.date === date);
  if(!entry) return;
  state.editing = date;
  state.form = {
    date: entry.date,
    symptoms: new Set(entry.symptoms || []),
    meds: new Set(entry.meds || []),
    other: '',
    otherMeds: '',
    notes: entry.notes || '',
    severity: {...(entry.severity || {})}
  };
  state.view = 'log';
  render();
}
function cancelEdit(){
  state.editing = null;
  state.form = { date: todayISO(), symptoms: new Set(), meds: new Set(), other: '', otherMeds: '', notes: '', severity: {} };
  render();
}

async function saveEntry(){
  const f = state.form;
  const otherSymptomIds = resolveOtherSymptoms(f.other);
  const otherMedIds = resolveOtherMeds(f.otherMeds);
  const symptomIds = Array.from(new Set([...Array.from(f.symptoms), ...otherSymptomIds]));
  const medIds = Array.from(new Set([...Array.from(f.meds), ...otherMedIds]));
  if(symptomIds.length === 0 && medIds.length === 0){ return; }

  const idx = state.entries.findIndex(e => e.date === f.date);
  const isEditingThis = state.editing === f.date;
  let finalSymptoms, finalMeds, finalSeverity;
  if(idx >= 0 && !isEditingThis){
    // Quick add to an existing day (not an explicit edit) — merge in.
    finalSymptoms = Array.from(new Set([...state.entries[idx].symptoms, ...symptomIds]));
    finalMeds = Array.from(new Set([...(state.entries[idx].meds||[]), ...medIds]));
    finalSeverity = {...(state.entries[idx].severity||{}), ...f.severity};
  } else {
    // Explicit edit, or a brand new entry — use exactly what's checked now.
    finalSymptoms = symptomIds;
    finalMeds = medIds;
    finalSeverity = {...f.severity};
  }
  // Drop severity for any symptom that's no longer on the entry.
  Object.keys(finalSeverity).forEach(id => { if(!finalSymptoms.includes(id)) delete finalSeverity[id]; });

  const entry = {
    date: f.date,
    symptoms: finalSymptoms,
    meds: finalMeds,
    severity: finalSeverity,
    notes: f.notes.trim() || (idx >= 0 && !isEditingThis ? state.entries[idx].notes : '')
  };
  if(idx >= 0) state.entries[idx] = entry;
  else state.entries.push(entry);
  state.entries.sort((a,b) => a.date < b.date ? 1 : -1);

  const ok = await saveData();
  state.editing = null;
  state.form = { date: todayISO(), symptoms: new Set(), meds: new Set(), other: '', otherMeds: '', notes: '', severity: {} };
  if(ok){
    state.justSaved = true;
    render();
    setTimeout(() => { state.justSaved = false; render(); }, 1600);
  } else {
    state.justSaved = false;
    render();
    alert('Could not save on this device — check the storage warning above.');
  }
}
async function deleteEntry(date){
  state.entries = state.entries.filter(e => e.date !== date);
  if(state.editing === date) cancelEdit();
  await saveData();
  render();
}
function updateCycleLength(val){
  const n = parseInt(val, 10);
  state.cycleLength = (n && n > 0 && n <= 90) ? n : state.cycleLength;
  saveData();
  render();
}
function updateCycleAnchor(val){
  if(!val) return;
  state.cycleAnchor = val;
  saveData();
  render();
}
function resetCycleAnchor(){
  state.cycleAnchor = null;
  saveData();
  render();
}

// Logs today (or the selected date) as a deliberate "nothing to report"
// day — distinct from simply not opening the app that day.
async function logCleanDay(){
  const f = state.form;
  const idx = state.entries.findIndex(e => e.date === f.date);
  if(idx >= 0){
    const existing = state.entries[idx];
    const hasData = (existing.symptoms||[]).length > 0 || (existing.meds||[]).length > 0;
    if(hasData && !confirm('This day already has symptoms or meds logged. Replace it with a clean day (nothing to report)?')) return;
  }
  const entry = {
    date: f.date,
    symptoms: [],
    meds: [],
    severity: {},
    notes: f.notes.trim() || (idx >= 0 ? state.entries[idx].notes : ''),
    clean: true
  };
  if(idx >= 0) state.entries[idx] = entry;
  else state.entries.push(entry);
  state.entries.sort((a,b) => a.date < b.date ? 1 : -1);

  const ok = await saveData();
  state.editing = null;
  state.form = { date: todayISO(), symptoms: new Set(), meds: new Set(), other: '', otherMeds: '', notes: '', severity: {} };
  if(ok){
    state.justSaved = true;
    render();
    setTimeout(() => { state.justSaved = false; render(); }, 1600);
  } else {
    render();
    alert('Could not save on this device — check the storage warning above.');
  }
}

// How many days since the most recent logged entry — used for a gentle
// reminder nudge on the Log tab. null if nothing's been logged yet.
function daysSinceLastLog(){
  if(state.entries.length === 0) return null;
  const mostRecent = [...state.entries].sort((a,b) => a.date < b.date ? 1 : -1)[0].date;
  return daysBetween(mostRecent, todayISO());
}

// Counts how often each pair of symptoms was logged on the same day —
// surfaces combinations worth noticing without the person spotting them by eye.
function computeCooccurrence(rings){
  const ringIds = new Set(rings.map(r => r.id));
  const pairCounts = {};
  for(const e of state.entries){
    const syms = (e.symptoms||[]).filter(id => ringIds.has(id));
    for(let i=0;i<syms.length;i++){
      for(let j=i+1;j<syms.length;j++){
        const key = [syms[i],syms[j]].sort().join('|');
        pairCounts[key] = (pairCounts[key]||0)+1;
      }
    }
  }
  return pairCounts;
}

function triggerDownload(content, filename, mimeType){
  const blob = new Blob([content], {type: mimeType});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// Full backup — everything needed to restore the app exactly, including
// your custom symptoms/meds and cycle length. Re-importable.
function exportBackup(){
  const payload = {
    exportedAt: new Date().toISOString(),
    entries: state.entries,
    cycleLength: state.cycleLength,
    cycleAnchor: state.cycleAnchor,
    customSymptoms: state.customSymptoms,
    customMeds: state.customMeds
  };
  triggerDownload(JSON.stringify(payload, null, 2), `hem-backup-${todayISO()}.json`, 'application/json');
}

// Human-readable spreadsheet export — one row per day, good for sharing
// with a doctor or reviewing in Excel/Numbers/Sheets.
function exportCSV(){
  const symptomMap = {}; allSymptoms().forEach(s => symptomMap[s.id] = s.label);
  const medMap = {}; allMeds().forEach(m => medMap[m.id] = m.label);
  const rows = [['Date','Symptoms','Meds taken','Notes']];
  const sorted = [...state.entries].sort((a,b) => a.date < b.date ? -1 : 1);
  for(const e of sorted){
    const symptomsStr = (e.symptoms||[]).map(id => symptomMap[id] || id).join('; ');
    const medsStr = (e.meds||[]).map(id => medMap[id] || id).join('; ');
    rows.push([e.date, symptomsStr, medsStr, (e.notes||'').replace(/\n/g,' ')]);
  }
  const csv = rows.map(r => r.map(f => '"' + String(f).replace(/"/g,'""') + '"').join(',')).join('\n');
  triggerDownload(csv, `hem-export-${todayISO()}.csv`, 'text/csv');
}

async function importBackupFile(file){
  const text = await file.text();
  let parsed;
  try{
    parsed = JSON.parse(text);
  }catch(e){
    alert("Could not read that file — make sure it's a Hem backup .json file.");
    return;
  }
  if(!Array.isArray(parsed.entries)){
    alert("That file doesn't look like a Hem backup.");
    return;
  }
  if(!confirm(`Import ${parsed.entries.length} entries? This replaces everything currently in the app on this device.`)) return;
  state.entries = parsed.entries || [];
  state.cycleLength = parsed.cycleLength || 28;
  state.cycleAnchor = parsed.cycleAnchor || null;
  state.customSymptoms = parsed.customSymptoms || [];
  state.customMeds = parsed.customMeds || [];
  await saveData();
  render();
  alert('Import complete.');
}

function renderStorageBanner(){
  if(storageAvailable) return '';
  return '<div class="banner">This browser is blocking on-device storage (common in private/incognito mode), so entries won\'t save between visits. Try opening this file in a normal Safari tab.</div>';
}

function renderLog(){
  const f = state.form;
  const baseSymptomIds = new Set(BASE_SYMPTOMS.map(s => s.id));
  const baseMedIds = new Set(BASE_MEDS.map(s => s.id));

  const renderSymptomChip = s => {
    const removable = !baseSymptomIds.has(s.id);
    return `
    <div class="symptom-toggle ${f.symptoms.has(s.id) ? 'active' : ''}" data-toggle="${s.id}">
      <span class="dot" style="background:${s.color}"></span>${escapeHtml(s.label)}
      ${removable ? `<span class="chip-remove" data-remove-custom="${s.id}">&times;</span>` : ''}
    </div>
  `;
  };

  const symptomGroups = SYMPTOM_CATEGORIES.map(cat => {
    const items = allSymptoms().filter(s => categoryFor(s) === cat);
    if(!items.length) return '';
    return `
    <div class="symptom-category">
      <div class="symptom-category-label">${cat}</div>
      <div class="symptom-grid">${items.map(renderSymptomChip).join('')}</div>
    </div>
  `;
  }).join('');

  const medChips = allMeds().map(m => {
    const removable = !baseMedIds.has(m.id);
    return `
    <div class="symptom-toggle ${f.meds.has(m.id) ? 'active' : ''}" data-toggle-med="${m.id}">
      <span class="dot" style="background:${m.color}"></span>${escapeHtml(m.label)}
      ${removable ? `<span class="chip-remove" data-remove-med="${m.id}">&times;</span>` : ''}
    </div>
  `;
  }).join('');

  // Severity picker — only for symptoms already ticked above (a symptom
  // typed into "Add new symptoms" needs to be saved once before it can
  // get a severity, since it isn't a chip yet).
  const checkedSymptoms = allSymptoms().filter(s => f.symptoms.has(s.id));
  const severitySection = checkedSymptoms.length ? `
    <label class="field-label">How bad? (optional)</label>
    <div class="severity-list">
      ${checkedSymptoms.map(s => `
        <div class="severity-row">
          <span class="severity-row-label">${escapeHtml(s.label)}</span>
          <div class="severity-btns">
            ${SEVERITY_LEVELS.map(level => `
              <button type="button" class="sev-btn ${f.severity[s.id] === level ? 'active' : ''}" data-severity="${s.id}" data-level="${level}">${level}</button>
            `).join('')}
          </div>
        </div>
      `).join('')}
    </div>
  ` : '';

  const editingBanner = state.editing ? `
    <div class="banner nudge">
      Editing ${fmtDate(state.editing)}.
      <button id="cancel-edit-btn" class="link-btn">Cancel</button>
    </div>
  ` : '';

  const daysSince = daysSinceLastLog();
  const reminderBanner = (!state.editing && daysSince !== null && daysSince >= 2) ? `
    <div class="banner nudge">
      Last logged ${daysSince} days ago — log today when you get a chance.
    </div>
  ` : '';

  return `
    ${renderStorageBanner()}
    ${editingBanner}
    ${reminderBanner}
    <div class="card">
      <span class="section-label">Date</span>
      <input type="date" id="date-input" value="${f.date}" max="${todayISO()}">

      <label class="field-label">Symptoms today (tap all that apply)</label>
      ${symptomGroups}
      <label class="field-label">Add new symptoms</label>
      <input type="text" id="other-input" placeholder="e.g. dizziness, dry mouth" value="${escapeHtml(f.other)}">
      <div class="hint">Separate multiple with commas — each becomes its own option, added permanently. Tap the × on a custom chip above to remove it later.</div>

      ${severitySection}

      <label class="field-label">Meds taken</label>
      <div class="symptom-grid">${medChips}</div>
      <label class="field-label">Add new meds</label>
      <input type="text" id="other-meds-input" placeholder="e.g. melatonin, magnesium" value="${escapeHtml(f.otherMeds)}">
      <div class="hint">Same as above — separate multiple with commas.</div>

      <label class="field-label">Notes</label>
      <textarea id="notes-input" placeholder="Anything else worth remembering">${escapeHtml(f.notes)}</textarea>
      <button class="primary ${state.justSaved ? 'saved' : ''}" id="save-btn">${state.justSaved ? '&#10003; Saved' : (state.editing ? 'Update entry' : 'Save entry')}</button>
      ${!state.editing ? `<button type="button" class="secondary-btn mt" id="clean-day-btn">Log a clean day (no symptoms)</button>` : ''}
    </div>
    <p class="footer-note">Entries save right on this device — nothing leaves your phone.</p>
  `;
}

function renderHistory(){
  if(state.entries.length === 0){
    return `
      ${renderStorageBanner()}
      <div class="empty-state">
        <h3>No entries yet</h3>
        <p>Log today's symptoms and they'll show up here.</p>
      </div>
    `;
  }
  const symptomMap = {};
  allSymptoms().forEach(s => symptomMap[s.id] = s);
  const medMap = {};
  allMeds().forEach(m => medMap[m.id] = m);

  const searchBar = `
    <div class="card" style="padding:10px 12px;margin-bottom:14px;">
      <input type="text" id="history-search" placeholder="Search symptoms, meds, or notes" value="${escapeHtml(state.historyFilter)}">
    </div>
  `;

  const filterText = state.historyFilter.trim().toLowerCase();
  const entries = filterText ? state.entries.filter(e => {
    const symptomLabels = (e.symptoms||[]).map(id => symptomMap[id]?.label || '').join(' ').toLowerCase();
    const medLabels = (e.meds||[]).map(id => medMap[id]?.label || '').join(' ').toLowerCase();
    const notes = (e.notes||'').toLowerCase();
    const dateStr = fmtDate(e.date).toLowerCase();
    return symptomLabels.includes(filterText) || medLabels.includes(filterText) || notes.includes(filterText) || dateStr.includes(filterText);
  }) : state.entries;

  if(entries.length === 0){
    return `
      ${renderStorageBanner()}
      ${searchBar}
      <div class="empty-state">
        <h3>No matches</h3>
        <p>Nothing logged matches "${escapeHtml(state.historyFilter)}".</p>
      </div>
    `;
  }

  let html = renderStorageBanner() + searchBar;
  let lastMonth = '';
  for(const e of entries){
    const monthKey = e.date.slice(0,7);
    if(monthKey !== lastMonth){
      html += `<div class="month-header">${fmtMonthHeader(e.date)}</div>`;
      lastMonth = monthKey;
    }
    const tags = (e.symptoms||[]).map(id => {
      const s = symptomMap[id];
      if(!s) return '';
      const sev = (e.severity||{})[id];
      const sevBadge = sev ? ` <span class="sev-dot" title="${sev}">${SEVERITY_DOTS[sev]}</span>` : '';
      return `<span class="tag" style="background:${s.color}">${escapeHtml(s.label)}${sevBadge}</span>`;
    }).join('');
    const medTags = (e.meds || []).map(id => {
      const m = medMap[id];
      return m ? `<span class="tag" style="background:${m.color}">${escapeHtml(m.label)}</span>` : '';
    }).join('');
    const isClean = (e.symptoms||[]).length === 0 && (e.meds||[]).length === 0;

    const cycleDay = cycleDayFor(e.date);

    html += `
      <div class="entry-row">
        <div class="top">
          <div><span class="date">${fmtDate(e.date)}</span><span class="weekday">${fmtWeekday(e.date)}</span><span class="cycle-day">day ${cycleDay}</span></div>
          <div>
            <button class="del" data-edit="${e.date}">edit</button>
            <button class="del" data-del="${e.date}">delete</button>
          </div>
        </div>
        <div class="tags">${tags || (isClean ? '<span class="tag" style="background:var(--sage)">No symptoms</span>' : '')}</div>
        ${medTags ? `<div class="tags" style="margin-top:2px;"><span style="font-size:11px;color:var(--ink-soft);margin-right:4px;align-self:center;">Took:</span>${medTags}</div>` : ''}
        ${e.notes ? `<div class="notes">${escapeHtml(e.notes)}</div>` : ''}
      </div>
    `;
  }
  return html;
}

function renderPatterns(){
  if(state.entries.length < 3){
    return `
      ${renderStorageBanner()}
      <div class="empty-state">
        <h3>Not enough data yet</h3>
        <p>Log at least a few days — patterns start to show once you have some history.</p>
      </div>
      <div class="card">
        <span class="section-label">Backup &amp; export</span>
        <button class="secondary-btn" id="export-backup-btn">Download backup (.json)</button>
        <button class="secondary-btn" id="export-csv-btn">Export as spreadsheet (.csv)</button>
        <button class="secondary-btn" id="import-backup-btn">Restore from backup</button>
        <input type="file" id="import-file-input" accept="application/json" style="display:none;">
        <p style="font-size:11.5px;color:var(--ink-soft);margin:10px 0 0;">
          Moving to a new device or a new version of this app? Restore your backup file here.
        </p>
      </div>
    `;
  }

  const rings = allSymptoms();
  const cycleLength = state.cycleLength;
  const sortedByDate = [...state.entries].sort((a,b) => a.date < b.date ? -1 : 1);
  const earliestEntryDate = sortedByDate[0].date;
  const anchor = getAnchorDate();

  const cx = 170, cy = 170, innerR = 46, outerR = 160;
  const spacing = (outerR - innerR) / rings.length;

  let ringsSvg = '';
  rings.forEach((r, i) => {
    ringsSvg += `<circle cx="${cx}" cy="${cy}" r="${innerR + spacing*i}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  });
  ringsSvg += `<circle cx="${cx}" cy="${cy}" r="${outerR}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  ringsSvg += `<line x1="${cx}" y1="${cy-innerR}" x2="${cx}" y2="${cy-outerR}" stroke="var(--line)" stroke-width="1"/>`;
  const midDay = Math.round(cycleLength/2);
  ringsSvg += `<line x1="${cx}" y1="${cy+innerR}" x2="${cx}" y2="${cy+outerR}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2,3"/>`;

  const counts = {};
  rings.forEach(r => counts[r.id] = 0);
  const medCounts = {};
  allMeds().forEach(m => medCounts[m.id] = 0);
  const symptomDayIdxs = {};

  let dotsSvg = '';
  for(const e of state.entries){
    const raw = daysBetween(anchor, e.date) % cycleLength;
    const dayIdx = ((raw % cycleLength) + cycleLength) % cycleLength;
    const angle = (dayIdx / cycleLength) * 2 * Math.PI - Math.PI/2;
    e.symptoms.forEach(id => {
      const ringIndex = rings.findIndex(r => r.id === id);
      if(ringIndex === -1) return;
      counts[id] = (counts[id] || 0) + 1;
      (symptomDayIdxs[id] = symptomDayIdxs[id] || []).push(dayIdx);
      const rad = innerR + spacing * (ringIndex + 0.5);
      const x = cx + rad * Math.cos(angle);
      const y = cy + rad * Math.sin(angle);
      const color = rings[ringIndex].color;
      dotsSvg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.2" fill="${color}" fill-opacity="0.82" stroke="var(--card)" stroke-width="0.8"/>`;
    });
    (e.meds || []).forEach(id => {
      medCounts[id] = (medCounts[id] || 0) + 1;
    });
  }

  const svg = `
    <svg viewBox="0 0 340 340" width="300" height="300">
      ${ringsSvg}
      ${dotsSvg}
      <text x="${cx}" y="${cy-4}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="var(--ink)">${cycleLength}-day</text>
      <text x="${cx}" y="${cy+11}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="var(--ink-soft)">cycle</text>
      <text x="${cx}" y="${cy-outerR-8}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--ink-soft)">day 1</text>
      <text x="${cx}" y="${cy+outerR+16}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--ink-soft)">day ${midDay+1}</text>
    </svg>
  `;

  const legend = rings.map(r => `
    <div class="legend-row">
      <span class="dot" style="background:${r.color}"></span>
      <span>${r.label}</span>
      <span class="count">${counts[r.id] || 0}</span>
    </div>
  `).join('');

  // --- Insights: plain-language summary of what's in the data so far.
  // Kept descriptive, not diagnostic — useful things to bring up with a doctor.
  const spanDays = daysBetween(earliestEntryDate, sortedByDate[sortedByDate.length-1].date) + 1;
  const cleanDayCount = state.entries.filter(e => (e.symptoms||[]).length === 0 && (e.meds||[]).length === 0).length;
  const topSymptoms = rings
    .map(r => ({label: r.label, n: counts[r.id] || 0}))
    .filter(x => x.n > 0)
    .sort((a,b) => b.n - a.n)
    .slice(0, 3);
  const topMeds = allMeds()
    .map(m => ({label: m.label, n: medCounts[m.id] || 0}))
    .filter(x => x.n > 0)
    .sort((a,b) => b.n - a.n)
    .slice(0, 3);

  const severeCounts = {};
  for(const e of state.entries){
    Object.entries(e.severity || {}).forEach(([id, level]) => {
      if(level !== 'severe') return;
      severeCounts[id] = (severeCounts[id]||0) + 1;
    });
  }
  const topSevere = Object.entries(severeCounts)
    .map(([id, n]) => ({label: (rings.find(r=>r.id===id)||{}).label || id, n}))
    .sort((a,b) => b.n - a.n)
    .slice(0, 3);

  let clusterNote = '';
  if(topSymptoms.length){
    const topId = rings.find(r => r.label === topSymptoms[0].label)?.id;
    const idxs = symptomDayIdxs[topId] || [];
    if(idxs.length >= 3){
      const bucketSize = Math.max(1, Math.round(cycleLength/4));
      const bucketCounts = {};
      idxs.forEach(d => { const b = Math.floor(d/bucketSize); bucketCounts[b] = (bucketCounts[b]||0)+1; });
      const buckets = Object.entries(bucketCounts).sort((a,b) => b[1]-a[1]);
      const [topBucket, topBucketCount] = buckets[0];
      if(topBucketCount / idxs.length >= 0.5){
        const startDay = Number(topBucket)*bucketSize + 1;
        const endDay = Math.min(cycleLength, startDay + bucketSize - 1);
        clusterNote = `<li>${escapeHtml(topSymptoms[0].label)} shows up most often around days ${startDay}–${endDay} of your ${cycleLength}-day cycle in the data so far.</li>`;
      }
    }
  }

  const insightsList = `
    <li>${state.entries.length} day${state.entries.length===1?'':'s'} logged over ${spanDays} day${spanDays===1?'':'s'}, starting ${fmtDate(earliestEntryDate)}.</li>
    ${cleanDayCount ? `<li>${cleanDayCount} clean day${cleanDayCount===1?'':'s'} logged (nothing to report).</li>` : ''}
    ${topSymptoms.length ? `<li>Most logged symptom${topSymptoms.length>1?'s':''}: ${topSymptoms.map(s=>`${escapeHtml(s.label)} (${s.n})`).join(', ')}.</li>` : ''}
    ${topMeds.length ? `<li>Most taken med${topMeds.length>1?'s':''}: ${topMeds.map(m=>`${escapeHtml(m.label)} (${m.n})`).join(', ')}.</li>` : ''}
    ${topSevere.length ? `<li>Logged as severe: ${topSevere.map(s=>`${escapeHtml(s.label)} (${s.n})`).join(', ')}.</li>` : ''}
    ${clusterNote}
  `;

  // --- Co-occurrence: which symptom pairs tend to land on the same day.
  const pairCounts = computeCooccurrence(rings);
  const symptomLabelMap = {};
  rings.forEach(r => symptomLabelMap[r.id] = r);
  const topPairs = Object.entries(pairCounts)
    .filter(([,n]) => n >= 2)
    .sort((a,b) => b[1]-a[1])
    .slice(0, 5)
    .map(([key, n]) => {
      const [idA, idB] = key.split('|');
      return {a: symptomLabelMap[idA], b: symptomLabelMap[idB], n};
    })
    .filter(p => p.a && p.b);

  return `
    ${renderStorageBanner()}
    <div class="card">
      <span class="section-label">Assumed cycle length</span>
      <div class="cycle-input-row">
        <input type="number" id="cycle-input" value="${cycleLength}" min="14" max="90">
        <span>days — adjust to match your pill pack or what feels right</span>
      </div>

      <span class="section-label">Cycle day 1</span>
      <div class="cycle-input-row">
        <input type="date" id="anchor-input" value="${anchor}" max="${todayISO()}">
        <span>${state.cycleAnchor ? 'set manually' : `defaults to your first entry (${fmtDate(earliestEntryDate)})`}</span>
      </div>
      ${state.cycleAnchor ? `<button id="reset-anchor-btn" class="link-btn" style="margin:-10px 0 16px;">Use first entry instead</button>` : ''}

      <div class="wheel-wrap">${svg}</div>
      <p style="font-size:12.5px;color:var(--ink-soft);text-align:center;margin:10px 0 0;">
        Each dot is a day a symptom was logged, placed by where that day fell in the cycle above.
        Dots clustering around the same angle across rings hint at a cyclical pattern.
      </p>
      <div class="legend">${legend}</div>
    </div>

    <div class="card">
      <span class="section-label">What the data shows so far</span>
      <ul style="margin:0;padding-left:18px;font-size:13.5px;line-height:1.6;color:var(--ink);">
        ${insightsList}
      </ul>
      <p style="font-size:11.5px;color:var(--ink-soft);margin:10px 0 0;">
        These are just counts and patterns from what you've logged — worth bringing up with your doctor, not a diagnosis.
      </p>
    </div>

    <div class="card">
      <span class="section-label">Symptoms that show up together</span>
      ${topPairs.length ? `
        <ul style="margin:0;padding-left:18px;font-size:13.5px;line-height:1.7;color:var(--ink);">
          ${topPairs.map(p => `<li>${escapeHtml(p.a.label)} + ${escapeHtml(p.b.label)} — ${p.n} day${p.n===1?'':'s'} together</li>`).join('')}
        </ul>
      ` : `<p style="font-size:13px;color:var(--ink-soft);margin:0;">Not enough overlap yet — keep logging and pairs will show up here.</p>`}
    </div>

    <div class="card">
      <span class="section-label">Backup &amp; export</span>
      <button class="secondary-btn" id="export-backup-btn">Download backup (.json)</button>
      <button class="secondary-btn" id="export-csv-btn">Export as spreadsheet (.csv)</button>
      <button class="secondary-btn" id="import-backup-btn">Restore from backup</button>
      <input type="file" id="import-file-input" accept="application/json" style="display:none;">
      <p style="font-size:11.5px;color:var(--ink-soft);margin:10px 0 0;">
        The backup file is the only way to move your entries to a new device or a new version of this app — keep a copy somewhere safe (Files, email to yourself, iCloud).
      </p>
    </div>

    <p class="footer-note">First entry logged: ${fmtDate(earliestEntryDate)}.
      <button id="clear-data-btn">Clear all data</button>
    </p>
  `;
}

function escapeHtml(str){
  return (str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  document.getElementById('today-label').textContent = new Date().toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric', year:'numeric'});
  ['log','history','patterns'].forEach(v => {
    document.getElementById('tab-'+v).classList.toggle('active', state.view === v);
  });
  const main = document.getElementById('main');
  if(!state.loaded){
    main.innerHTML = `<div class="empty-state"><p>Loading…</p></div>`;
    return;
  }
  if(state.view === 'log') main.innerHTML = renderLog();
  else if(state.view === 'history') main.innerHTML = renderHistory();
  else main.innerHTML = renderPatterns();
  attachHandlers();
}

function attachHandlers(){
  document.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', () => toggleSymptom(el.getAttribute('data-toggle')));
  });
  document.querySelectorAll('[data-remove-custom]').forEach(el => {
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      removeCustomSymptom(el.getAttribute('data-remove-custom'));
    });
  });
  document.querySelectorAll('[data-toggle-med]').forEach(el => {
    el.addEventListener('click', () => toggleMed(el.getAttribute('data-toggle-med')));
  });
  document.querySelectorAll('[data-remove-med]').forEach(el => {
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      removeCustomMed(el.getAttribute('data-remove-med'));
    });
  });
  document.querySelectorAll('[data-severity]').forEach(el => {
    el.addEventListener('click', () => setSeverity(el.getAttribute('data-severity'), el.getAttribute('data-level')));
  });
  const cleanDayBtn = document.getElementById('clean-day-btn');
  if(cleanDayBtn) cleanDayBtn.addEventListener('click', logCleanDay);
  const dateInput = document.getElementById('date-input');
  if(dateInput) dateInput.addEventListener('change', e => { state.form.date = e.target.value; });
  const otherInput = document.getElementById('other-input');
  if(otherInput) otherInput.addEventListener('input', e => { state.form.other = e.target.value; });
  const otherMedsInput = document.getElementById('other-meds-input');
  if(otherMedsInput) otherMedsInput.addEventListener('input', e => { state.form.otherMeds = e.target.value; });
  const notesInput = document.getElementById('notes-input');
  if(notesInput) notesInput.addEventListener('input', e => { state.form.notes = e.target.value; });
  const saveBtn = document.getElementById('save-btn');
  if(saveBtn) saveBtn.addEventListener('click', saveEntry);
  const cancelEditBtn = document.getElementById('cancel-edit-btn');
  if(cancelEditBtn) cancelEditBtn.addEventListener('click', cancelEdit);
  document.querySelectorAll('[data-edit]').forEach(el => {
    el.addEventListener('click', () => editEntry(el.getAttribute('data-edit')));
  });
  document.querySelectorAll('[data-del]').forEach(el => {
    el.addEventListener('click', () => {
      if(confirm('Delete this entry?')) deleteEntry(el.getAttribute('data-del'));
    });
  });
  const cycleInput = document.getElementById('cycle-input');
  if(cycleInput) cycleInput.addEventListener('change', e => updateCycleLength(e.target.value));
  const anchorInput = document.getElementById('anchor-input');
  if(anchorInput) anchorInput.addEventListener('change', e => updateCycleAnchor(e.target.value));
  const resetAnchorBtn = document.getElementById('reset-anchor-btn');
  if(resetAnchorBtn) resetAnchorBtn.addEventListener('click', resetCycleAnchor);
  const historySearch = document.getElementById('history-search');
  if(historySearch) historySearch.addEventListener('input', e => {
    state.historyFilter = e.target.value;
    const cursorPos = e.target.selectionStart;
    render();
    const freshInput = document.getElementById('history-search');
    if(freshInput){ freshInput.focus(); freshInput.setSelectionRange(cursorPos, cursorPos); }
  });
  const clearBtn = document.getElementById('clear-data-btn');
  if(clearBtn) clearBtn.addEventListener('click', async () => {
    if(confirm('Delete all logged entries? This cannot be undone.')){
      state.entries = [];
      await saveData();
      render();
    }
  });
  const exportBackupBtn = document.getElementById('export-backup-btn');
  if(exportBackupBtn) exportBackupBtn.addEventListener('click', exportBackup);
  const exportCsvBtn = document.getElementById('export-csv-btn');
  if(exportCsvBtn) exportCsvBtn.addEventListener('click', exportCSV);
  const importBtn = document.getElementById('import-backup-btn');
  const importInput = document.getElementById('import-file-input');
  if(importBtn && importInput){
    importBtn.addEventListener('click', () => importInput.click());
    importInput.addEventListener('change', (e) => {
      if(e.target.files && e.target.files[0]) importBackupFile(e.target.files[0]);
    });
  }
}

document.querySelectorAll('nav.tabbar button').forEach(btn => {
  btn.addEventListener('click', () => setView(btn.getAttribute('data-view')));
});

loadData();
</script>
</body>
</html>
