<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F6F3EC">
<link rel="apple-touch-icon" href="hem-icon.png">
<link rel="icon" href="hem-icon.png">
<title>Hem — symptom log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F3EC;
    --bg-alt:#EFEAE0;
    --card:#FBF9F4;
    --ink:#2B2822;
    --ink-soft:#6B6558;
    --line:#DDD6C8;
    --plum:#6B4C6B;
    --plum-dark:#5A3E5A;
    --sage:#6F8368;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;margin:0;letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  #shell{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  header{
    padding:28px 20px 18px;
    border-bottom:1px solid var(--line);
  }
  header .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  header h1{font-size:26px;}
  header .today{
    margin-top:4px;
    font-size:13px;
    color:var(--ink-soft);
  }
  main{
    flex:1;
    padding:20px 20px 100px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:16px;
  }
  .section-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:10px;
    display:block;
  }
  .tip-block{border-top:1px solid var(--line);padding:10px 0;}
  .tip-block:first-of-type{border-top:none;}
  .tip-block summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;font-size:14px;}
  .tip-block summary::-webkit-details-marker{display:none;}
  .tip-block summary::after{content:'+';margin-left:auto;color:var(--ink-soft);font-size:16px;}
  .tip-block[open] summary::after{content:'\2212';}
  .tip-block .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .tip-title{font-weight:600;color:var(--ink);}
  .tip-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);}
  .tip-personal{font-size:12.5px;color:var(--ink-soft);margin:8px 0 6px;line-height:1.5;}
  .tip-list{margin:0;padding-left:18px;font-size:13.5px;line-height:1.6;color:var(--ink);}
  .tip-doc{font-size:12px;color:var(--ink);margin:8px 0 0;padding:8px 10px;border-radius:8px;background:var(--line);line-height:1.5;}
  .banner{
    font-size:12px;
    color:#8C4A5B;
    background:#F3E7E4;
    border:1px solid #E2C9C4;
    border-radius:10px;
    padding:9px 12px;
    margin-bottom:16px;
  }
  .banner.nudge{
    color:var(--plum);
    background:#EFE7EC;
    border-color:#DCC9D6;
  }
  .link-btn{
    background:none;
    border:none;
    color:var(--plum);
    text-decoration:underline;
    font-size:12px;
    cursor:pointer;
    font-family:inherit;
    padding:0;
    display:block;
  }
  input[type="date"], input[type="number"], input[type="text"], textarea{
    width:100%;
    max-width:100%;
    min-width:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--ink);
    background:var(--bg-alt);
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 12px;
    outline:none;
  }
  input[type="date"]{
    appearance:none;
    -webkit-appearance:none;
  }
  input:focus, textarea:focus{
    border-color:var(--plum);
  }
  textarea{resize:vertical;min-height:64px;font-family:inherit;}
  .symptom-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .symptom-category{
    margin-bottom:14px;
  }
  .symptom-category:last-child{
    margin-bottom:0;
  }
  .symptom-category-label{
    font-size:11.5px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .timing-table{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .timing-row-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:6px;
  }
  .timing-occs{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .timing-chip{
    display:flex;
    align-items:center;
    gap:4px;
    background:var(--bg-alt);
    border:1px solid var(--line);
    border-radius:8px;
    padding:4px 8px;
    font-size:12px;
    color:var(--ink);
  }
  .timing-chip-month{
    color:var(--ink-soft);
    font-size:11px;
  }
  .history-filter-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:8px;
    flex-wrap:wrap;
  }
  .history-filter-row select{
    flex:1 1 auto;
    min-width:0;
    padding:6px 8px;
    font-size:12.5px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--bg-alt);
    color:var(--ink);
  }
  .history-filter-row .link-btn{
    white-space:nowrap;
    font-size:12px;
  }
  .timing-group-label{
    font-size:11.5px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--ink-soft);
    margin:14px 0 8px;
  }
  .timing-group-label:first-child{
    margin-top:0;
  }
  .symptom-toggle{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 10px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--bg-alt);
    cursor:pointer;
    user-select:none;
    font-size:13.5px;
    line-height:1.25;
    position:relative;
  }
  .chip-remove{
    margin-left:auto;
    padding-left:6px;
    font-size:15px;
    line-height:1;
    color:var(--ink-soft);
  }
  .symptom-toggle.active .chip-remove{color:rgba(255,255,255,0.7);}
  .symptom-toggle .dot{
    width:9px;height:9px;border-radius:50%;flex:none;
    border:1px solid rgba(0,0,0,0.15);
  }
  .symptom-toggle.active{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }
  .symptom-toggle.active .dot{border-color:rgba(255,255,255,0.5);}
  label.field-label{
    display:block;
    font-size:12.5px;
    color:var(--ink-soft);
    margin:14px 0 6px;
  }
  .hint{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
  button.primary{
    width:100%;
    margin-top:18px;
    padding:13px;
    border:none;
    border-radius:10px;
    background:var(--plum);
    color:#fff;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  button.primary:active{background:var(--plum-dark);}
  button.primary.saved{background:var(--sage);}
  .doctor-range{width:100%;padding:10px;font-size:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg-alt);color:var(--ink);font-family:'Inter',sans-serif;}
  button.primary.doctor-btn{margin-top:10px;}
  .doctor-field-label{display:block;font-size:12.5px;font-weight:500;color:var(--ink);margin:0 0 4px;}
  .doctor-reason{width:100%;padding:10px;font-size:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg-alt);color:var(--ink);font-family:'Inter',sans-serif;resize:vertical;margin-bottom:8px;}
  .sev-guide{font-size:12px;line-height:1.45;color:var(--ink-soft);margin:-2px 0 8px;}
  .sev-guide strong{color:var(--ink);font-weight:600;}
  .doctor-check{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink);margin-top:10px;}
  .doctor-check input{margin-top:3px;accent-color:var(--plum);}
  button.primary.doctor-btn:disabled{opacity:0.6;}
  .secondary-btn{
    display:block;
    width:100%;
    margin-bottom:8px;
    padding:11px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--bg-alt);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:13.5px;
    cursor:pointer;
  }
  .secondary-btn:last-of-type{margin-bottom:0;}
  .secondary-btn:active{background:var(--line);}
  .secondary-btn.mt{margin-top:10px;}
  .severity-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:4px;
  }
  .severity-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    flex-wrap:wrap;
  }
  .severity-row-label{font-size:13px;color:var(--ink);flex:1;min-width:0;}
  .severity-btns{display:flex;gap:6px;flex:none;}
  .sev-btn{
    border:1px solid var(--line);
    background:var(--bg-alt);
    color:var(--ink-soft);
    border-radius:20px;
    padding:5px 10px;
    font-size:11px;
    font-family:'Inter',sans-serif;
    text-transform:capitalize;
    cursor:pointer;
  }
  .sev-btn.active{
    background:var(--plum);
    border-color:var(--plum);
    color:#fff;
  }
  .sev-btn.missed.active{background:#8C4A5B;border-color:#8C4A5B;}
  .sev-btn.sage.active{background:var(--sage);border-color:var(--sage);}
  .loc-block{display:flex;flex-direction:column;gap:6px;padding:6px 0 2px 10px;border-left:2px solid var(--line);margin-left:2px;}
  .loc-btns{display:flex;flex-wrap:wrap;gap:6px;}
  .loc-btns .sev-btn{text-transform:none;}
  .sleep-hours{width:90px !important;flex:none;text-align:center;}
  .time-input{width:130px !important;flex:none;}
  .no-sym-toggle{margin-bottom:10px;}
  .no-sym-toggle.active{background:var(--sage);border-color:var(--sage);}
  .entry-meta{font-size:12px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
  .entry-meta b{font-weight:600;color:var(--ink);}
  details.add-daily{margin-top:8px;}
  details.add-daily summary{font-size:12px;color:var(--ink-soft);cursor:pointer;}
  details.add-daily input{margin-top:6px;}
  .sev-dot{
    font-size:7px;
    letter-spacing:-1px;
    opacity:0.9;
  }
  .empty-state{
    text-align:center;
    padding:36px 16px;
    color:var(--ink-soft);
  }
  .empty-state h3{font-size:17px;color:var(--ink);margin-bottom:6px;}
  .empty-state p{font-size:13.5px;margin:0;}
  .month-header{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:20px 0 8px;
  }
  .month-header:first-child{margin-top:0;}
  .entry-row{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:10px;
  }
  .entry-row .top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
  }
  .entry-row .date{font-weight:600;font-size:15px;}
  .entry-row .weekday{font-size:11.5px;color:var(--ink-soft);margin-left:6px;font-weight:400;}
  .entry-row .cycle-day{
    font-size:10.5px;
    color:var(--plum);
    background:var(--bg-alt);
    border-radius:20px;
    padding:2px 8px;
    margin-left:8px;
    font-family:'IBM Plex Mono',monospace;
  }
  .entry-row .del{
    background:none;border:none;color:var(--ink-soft);
    font-size:12px;cursor:pointer;padding:4px 2px;
    font-family:'IBM Plex Mono',monospace;
    margin-left:10px;
  }
  .entry-row .del:first-of-type{margin-left:0;}
  .entry-row .del:active{color:#8C4A5B;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
  .tag{
    font-size:11.5px;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
    font-weight:500;
  }
  .entry-row .notes{font-size:13px;color:var(--ink-soft);margin-top:4px;}
  .wheel-wrap{display:flex;justify-content:center;margin:6px 0 4px;}
  .legend{
    display:flex;
    flex-direction:column;
    gap:7px;
    margin-top:16px;
  }
  .legend-row{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:13px;
  }
  .legend-row .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .legend-row .count{margin-left:auto;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .cycle-input-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
  }
  .cycle-input-row input{width:72px;flex:none;}
  .cycle-input-row span{font-size:13px;color:var(--ink-soft);}
  nav.tabbar{
    position:fixed;
    bottom:0;left:0;right:0;
    max-width:480px;
    margin:0 auto;
    background:var(--card);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 10px calc(10px + env(safe-area-inset-bottom));
  }
  nav.tabbar button{
    flex:1;
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:6px 4px;
    cursor:pointer;
    color:var(--ink-soft);
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:500;
  }
  nav.tabbar button.active{color:var(--plum);}
  nav.tabbar svg{width:20px;height:20px;}
  .footer-note{
    text-align:center;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:22px;
  }
  .footer-note button{
    background:none;border:none;color:var(--ink-soft);
    text-decoration:underline;font-size:11.5px;cursor:pointer;
    font-family:inherit;padding:0;
  }
  /* ---------- Migraine tab (Brainstorm) ---------- */
  nav.tabbar button.mig-tab.active{color:var(--plum);}
  .m-hero{display:flex;align-items:center;gap:12px;}
  .m-hero svg{width:52px;height:52px;flex:none;}
  .m-hero h2{font-size:20px;}
  .m-hero p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.45;}
  .m-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
  .m-stat{background:var(--bg-alt);border-radius:10px;padding:10px 10px 9px;}
  .m-stat b{display:block;font-family:'Fraunces',Georgia,serif;font-size:22px;line-height:1.1;font-weight:600;}
  .m-stat span{font-size:11.5px;color:var(--ink-soft);line-height:1.3;display:block;margin-top:2px;}
  .meter-wrap{margin-top:16px;}
  .meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;}
  .meter-top b{font-weight:600;}
  .meter-status{font-size:11px;font-weight:600;border-radius:20px;padding:2px 9px;background:var(--bg-alt);color:var(--sage);white-space:nowrap;}
  .meter-status.warn{background:#F6ECDC;color:#8A5B1C;}
  .meter-status.over{background:#F3E7E4;color:#8C4A5B;}
  .meter{position:relative;height:8px;background:var(--bg-alt);border-radius:99px;margin:22px 0 6px;}
  .meter i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--plum);min-width:8px;}
  .meter.warn i{background:#B07A2E;}
  .meter.over i{background:#8C4A5B;}
  .meter .tick{position:absolute;top:-17px;bottom:-3px;width:1px;background:var(--ink-soft);opacity:.55;}
  .meter .tick span{position:absolute;top:-1px;left:4px;font:10px 'IBM Plex Mono',monospace;color:var(--ink-soft);white-space:nowrap;}
  .m-cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .m-cal-head h3{font-size:16px;}
  .m-cal-head button{background:var(--bg-alt);border:1px solid var(--line);border-radius:8px;width:36px;height:32px;cursor:pointer;color:var(--ink);font-size:15px;}
  .m-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .m-cal .dow{font:10px 'IBM Plex Mono',monospace;color:var(--ink-soft);text-align:center;padding-bottom:2px;}
  .m-cal .d{aspect-ratio:1;border-radius:8px;background:var(--bg-alt);border:none;font:12px 'Inter',sans-serif;color:var(--ink-soft);position:relative;display:flex;align-items:center;justify-content:center;padding:0;}
  .m-cal .d.mig{font-weight:600;cursor:pointer;}
  .m-cal .d.today{box-shadow:inset 0 0 0 1.5px var(--ink);}
  .m-cal .d .rx{position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ink-soft);}
  .m-cal .d.light .rx{background:#fff;}
  .m-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--ink-soft);margin-top:10px;align-items:center;}
  .m-legend .ramp{display:inline-flex;gap:2px;vertical-align:middle;margin:0 4px;}
  .m-legend .ramp i{width:12px;height:10px;border-radius:2px;display:inline-block;}
  .m-legend .rxdot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ink-soft);vertical-align:middle;margin-right:4px;}
  .m-badge{font-size:11px;font-weight:600;border-radius:20px;padding:2px 9px;background:#F3E7E4;color:#8C4A5B;white-space:nowrap;}
  .m-badge.ok{background:var(--bg-alt);color:var(--plum);}
  .m-row{cursor:pointer;}
  .m-row:active{background:var(--bg-alt);}
  .m-meta{font-size:12.5px;color:var(--ink-soft);line-height:1.6;}
  .m-meta b{color:var(--ink);font-weight:600;}
  .m-tagline{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
  .m-tagline span{font-size:11px;background:var(--bg-alt);border:1px solid var(--line);border-radius:20px;padding:2px 8px;color:var(--ink);}
  .m-form .card h3{font-size:16px;margin-bottom:2px;}
  .m-form .sub{font-size:12px;color:var(--ink-soft);margin:0 0 10px;}
  .m-form input[type="time"]{font-family:'Inter',sans-serif;font-size:15px;color:var(--ink);background:var(--bg-alt);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px;width:130px;-webkit-appearance:none;appearance:none;}
  .m-form select{font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);background:var(--bg-alt);border:1px solid var(--line);border-radius:10px;padding:9px 10px;}
  .m-title{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .m-title h2{font-size:21px;}
  .m-title .m-sub{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
  .time-grid{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;}
  .time-grid > span{font-size:13px;color:var(--ink);}
  .time-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .pain-scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;}
  .pain-scale button{border:none;border-radius:8px;height:40px;font:600 13px 'Inter',sans-serif;cursor:pointer;padding:0;}
  .pain-scale button.active{outline:2.5px solid var(--ink);outline-offset:1px;}
  .pain-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-top:5px;}
  .head-maps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;}
  .head-maps figure{margin:0;text-align:center;}

<script>
const BASE_SYMPTOMS = [
  {id:'nausea', label:'Nausea', color:'#6F8368'},
  {id:'migraine', label:'Migraine', color:'#6B4C6B'},
  {id:'anxiety', label:'Anxiety', color:'#4F5D75'},
  {id:'irritable', label:'Irritable', color:'#A9724F'},
  {id:'bowel-frequent', label:'Small, frequent bowel movements', color:'#8C4A5B'},
  {id:'bowel-loose', label:'Loose bowel movement', color:'#9C6B4F'},
  {id:'rlq-pain', label:'Lower right quadrant pain', color:'#5A5A8C'},
  {id:'insomnia', label:'Insomnia', color:'#B08A3E'},
];
const CUSTOM_PALETTE = ['#7C9A92','#8A8272','#4F7A6B','#7A5C6B','#5C7A9C','#9C8A4F','#6B4A5C','#5C8A5C','#8A5C4A','#4A6B8A'];
const BASE_MEDS = [
  {id:'ibuprofen', label:'Ibuprofen', color:'#3E6E8E'},
  {id:'tylenol', label:'Tylenol', color:'#5C7A5C'},
  {id:'famotidine', label:'Famotidine', color:'#6E5C8E'},
  {id:'zofran', label:'Zofran', color:'#8E6E3E'},
  {id:'gas-medicine', label:'Gas medicine', color:'#5C8A8A'},
];
const MEDS_CUSTOM_PALETTE = ['#4A6B8A','#6B4A8A','#8A6B4A','#4A8A6B','#8A4A6B','#6B8A4A','#4A4A8A','#8A8A4A'];
const STORAGE_KEY = 'loop-tracker-data';

// Groups symptoms into categories on the Log tab so the list is easier to
// scan. Each built-in symptom gets an explicit category; a symptom you add
// yourself is sorted in automatically by matching keywords in its label —
// no extra tapping required, and nothing is stored, so it stays in sync
// even if you rename how you think about it.
const SYMPTOM_CATEGORIES = ['Mood & emotional', 'Head & sleep', 'Digestive', 'Pain & body', 'Other'];
const CATEGORY_KEYWORDS = {
  'Mood & emotional': ['anxi','irritab','mood','cry','fight','angry','sad','stress','overwhelm','depress','argu'],
  'Head & sleep': ['migrain','headache','insomnia','sleep','tired','fatigue','dizzy','brain fog','brain','energy'],
  'Digestive': ['nausea','bowel','stomach','gas','bloat','reflux','constipat','diarrhea','vomit','gut','appetite'],
  'Pain & body': ['pain','ache','cramp','sore','tender','breast','groin','neck','back','joint','muscle','quadrant','headache']
};
const BASE_SYMPTOM_CATEGORY = {
  'nausea': 'Digestive',
  'migraine': 'Head & sleep',
  'anxiety': 'Mood & emotional',
  'irritable': 'Mood & emotional',
  'bowel-frequent': 'Digestive',
  'bowel-loose': 'Digestive',
  'rlq-pain': 'Pain & body',
  'insomnia': 'Head & sleep'
};
function categoryFor(symptom){
  if(BASE_SYMPTOM_CATEGORY[symptom.id]) return BASE_SYMPTOM_CATEGORY[symptom.id];
  const label = symptom.label.toLowerCase();
  for(const cat of SYMPTOM_CATEGORIES){
    const keywords = CATEGORY_KEYWORDS[cat];
    if(keywords && keywords.some(k => label.includes(k))) return cat;
  }
  return 'Other';
}

const SEVERITY_LEVELS = ['mild', 'moderate', 'severe'];
const SEVERITY_DOTS = {mild: '●', moderate: '●●', severe: '●●●'};

// Daily meds get a quick timing answer instead of a taken/not-taken chip.
// Left blank unless you tap one — blank never means taken or missed.
const BASE_DAILY_MEDS = [{id:'yaz', label:'Yaz'}];
const DAILY_TIMING = [
  {id:'normal', label:'Normal', long:'Normal (morning)'},
  {id:'midday', label:'Midday', long:'Midday'},
  {id:'night', label:'Night', long:'Night'},
  {id:'missed', label:'Missed', long:'Missed'}
];
const PAIN_LOCATIONS = [
  {id:'upper', label:'Upper abdomen'},
  {id:'lower', label:'Lower abdomen/pelvis'},
  {id:'left', label:'Left'},
  {id:'center', label:'Center'},
  {id:'right', label:'Right'}
];
const SLEEP_QUALITY = ['good', 'fair', 'poor'];

// Location choices only show for cramps / abdominal pain symptoms.
function needsPainLocation(s){
  return /cramp|abdom|stomach ?(pain|ache)|belly|pelvic pain/i.test(s.label);
}
// Only an explicit "No symptoms" tap counts as symptom-free. Older entries
// saved with the previous "clean day" button carry clean:true.
function isSymptomFree(e){
  return !!e && (e.noSymptoms === true || e.clean === true) && (e.symptoms||[]).length === 0;
}
function blankForm(){
  return { date: todayISO(), symptoms: new Set(), meds: new Set(), other: '', otherMeds: '', otherDailyMeds: '', notes: '', severity: {}, painLocation: {}, medTiming: {}, medTimes: {}, sleepHours: '', sleepQuality: '', noSymptoms: false, vyvanse: '' };
}
// Accepts "5h 6m", "5 hrs 6 mins", "5:06", "306m", or plain hours "5.1".
// Returns decimal hours (2 places) or null.
function parseSleepHours(v){
  if(v === '' || v === null || v === undefined) return null;
  const t = String(v).trim().toLowerCase();
  if(!t) return null;
  let mins = null, m;
  if((m = t.match(/^(\d{1,2}):(\d{1,2})$/))) mins = (+m[1])*60 + (+m[2]);
  else if((m = t.match(/^(\d+)\s*(m|min|mins|minutes?)$/))) mins = +m[1];
  else if((m = t.match(/^(\d+(?:\.\d+)?)\s*(h|hr|hrs|hours?)?\s*(?:(\d+)\s*(m|min|mins|minutes?)?)?$/))){
    mins = parseFloat(m[1])*60 + (m[3] ? +m[3] : 0);
  }
  if(mins === null || isNaN(mins) || mins < 0 || mins > 24*60) return null;
  return Math.round(mins/60*100)/100;
}
function fmtSleep(hours){
  if(hours === null || hours === undefined || hours === '') return '';
  const total = Math.round(Number(hours)*60);
  const h = Math.floor(total/60), mm = total % 60;
  return mm ? `${h}h ${mm}m` : `${h}h`;
}
// Sleep handed over by the Apple Health shortcut in the link
// (?sleepmin=306). Prefills today's form only; never saves on its own.
// Reads sleep copied by the Apple Health shortcut (e.g. "5h 6m" or "306m").
async function pasteSleep(){
  let text = '';
  try{ text = await navigator.clipboard.readText(); }
  catch(e){ alert("Couldn't read the clipboard. Long-press the Hours box and tap Paste instead."); return; }
  const hours = parseSleepHours(text);
  if(hours === null){ alert(`Clipboard doesn't look like a sleep time: "${String(text).slice(0,30)}"`); return; }
  state.form.sleepHours = fmtSleep(hours);
  render();
}
function applySleepFromLink(){
  try{
    const params = new URLSearchParams(window.location.search);
    const raw = params.get('sleepmin');
    if(raw === null) return;
    const mins = parseInt(raw, 10);
    if(!isNaN(mins) && mins > 0 && mins <= 24*60){
      state.form.date = todayISO();
      state.form.sleepHours = fmtSleep(mins/60);
      state.sleepFromHealth = true;
    }
    params.delete('sleepmin');
    const q = params.toString();
    window.history.replaceState(null, '', window.location.pathname + (q ? '?' + q : '') + window.location.hash);
  }catch(e){ console.error(e); }
}
function fmtTime(hhmm){
  if(!hhmm) return '';
  const [h,m] = hhmm.split(':').map(Number);
  return new Date(2000,0,1,h,m).toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
}
function timingLabel(val){
  const t = DAILY_TIMING.find(x => x.id === val);
  return t ? t.long : '';
}
function painLabels(ids){
  return PAIN_LOCATIONS.filter(l => (ids||[]).includes(l.id)).map(l => l.label);
}

let storageAvailable = true;
let state = {
  entries: [],
  cycleLength: 28,
  cycleAnchor: null, // manually-set "day 1" date; null = default to earliest entry
  customSymptoms: [],
  customMeds: [],
  customDailyMeds: [],
  loaded: false,
  view: 'log',
  historyFilter: '',
  historyMonth: '', // '' = all months, else 'YYYY-MM'
  historyDay: '', // '' = all days, else '1'-'31' (day of month)
  historySort: 'date', // 'date' or 'cycleDay'
  editing: null, // date string of the entry currently being edited, or null
  justSaved: false, // briefly true right after a successful save, to show a checkmark
  form: blankForm(),
  // Migraine tab
  migraines: {}, // extra migraine answers keyed by Hem date
  medClasses: {}, // med id -> pain-reliever class override
  mCustomTriggers: [],
  mLoc: null, // last known coordinates for weather
  mEditing: null,
  mForm: null,
  mFromHem: false,
  mCalMonth: '',
  mWxBusy: '',
  mWxForm: ''
};

// The date cycle day 1 counts from — a manual override if set, otherwise
// the earliest logged entry. Shared by History's day badges and the
// Patterns wheel so they always agree.
function getAnchorDate(){
  if(state.cycleAnchor) return state.cycleAnchor;
  const logged = state.entries.filter(isLoggedEntry);
  if(logged.length === 0) return todayISO();
  const sorted = [...logged].sort((a,b) => a.date < b.date ? -1 : 1);
  return sorted[0].date;
}
function cycleDayFor(dateISO){
  const cycleLength = state.cycleLength;
  const anchor = getAnchorDate();
  const raw = daysBetween(anchor, dateISO) % cycleLength;
  return (((raw % cycleLength) + cycleLength) % cycleLength) + 1;
}

function allSymptoms(){
  return BASE_SYMPTOMS.concat(state.customSymptoms);
}
function allMeds(){
  return BASE_MEDS.concat(state.customMeds);
}
function allDailyMeds(){
  return BASE_DAILY_MEDS.concat(state.customDailyMeds);
}
// Relief-med chips, minus anything that's now tracked as a daily med (so a
// custom "Yaz" chip you may have added earlier doesn't show up twice; past
// entries that used it are left exactly as they were).
function reliefMedChoices(){
  const dailyIds = new Set(allDailyMeds().map(m => m.id));
  return allMeds().filter(m => !dailyIds.has(m.id));
}
function todayISO(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,10);
}
function fmtDate(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
}
function fmtWeekday(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString(undefined, {weekday:'short'});
}
function fmtMonthShort(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString(undefined, {month:'short'});
}
function fmtMonthHeader(iso){
  const [y,m] = iso.split('-').map(Number);
  return new Date(y,m-1,1).toLocaleDateString(undefined, {month:'long', year:'numeric'});
}
function daysBetween(aISO, bISO){
  const [ay,am,ad]=aISO.split('-').map(Number);
  const [by,bm,bd]=bISO.split('-').map(Number);
  const a = Date.UTC(ay,am-1,ad);
  const b = Date.UTC(by,bm-1,bd);
  return Math.round((b-a)/86400000);
}
function addDays(iso, n){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(y,m-1,d) + n*86400000);
  return dt.toISOString().slice(0,10);
}

// No real period to anchor to (e.g. continuous/extended-cycle birth control),
// so this looks for a repeating rhythm directly in symptom dates instead.
// For each candidate cycle length it measures how tightly symptom days
// cluster when wrapped onto that length (circular concentration, R close to
// 1 = tight cluster, close to 0 = scattered) and keeps the length that
// clusters best. It then finds where in that cycle symptoms tend to start
// (the densest run of days) and returns the most recent real calendar date
// matching that point, so it can be dropped straight into the cycle-length
// and day-1 fields.
function suggestCycleParams(){
  const dates = [...new Set(state.entries.filter(e => (e.symptoms||[]).length > 0).map(e => e.date))];
  if(dates.length < 8) return {needMoreData: true};
  const epoch = dates.reduce((min, d) => d < min ? d : min, dates[0]);
  const dayNums = dates.map(d => daysBetween(epoch, d));
  const span = Math.max(...dayNums) - Math.min(...dayNums) + 1;

  // Testing a candidate cycle length longer than the data actually spans
  // (well, spans twice over) gives a falsely tight-looking cluster just
  // because the points never get the chance to wrap around and land far
  // apart — so candidates are capped at half the logged span, and if that
  // doesn't leave room for a plausible cycle length, there just isn't
  // enough history yet to say anything reliable.
  const maxL = Math.min(45, Math.floor(span/2));
  if(maxL < 14) return {needMoreData: true};

  let best = null;
  for(let L = 14; L <= maxL; L++){
    let sumCos = 0, sumSin = 0;
    dayNums.forEach(d => {
      const angle = ((d % L) / L) * 2 * Math.PI;
      sumCos += Math.cos(angle);
      sumSin += Math.sin(angle);
    });
    const R = Math.sqrt(sumCos*sumCos + sumSin*sumSin) / dayNums.length;
    if(!best || R > best.R) best = {L, R};
  }

  const L = best.L;
  const counts = new Array(L).fill(0);
  dayNums.forEach(d => counts[((d % L) + L) % L]++);
  const w = Math.max(3, Math.round(L/6));
  let bestWindow = {start: 0, sum: -1};
  for(let s = 0; s < L; s++){
    let sum = 0;
    for(let k = 0; k < w; k++) sum += counts[(s+k) % L];
    if(sum > bestWindow.sum) bestWindow = {start: s, sum};
  }
  const leadDay = bestWindow.start;

  const totalOffsetToToday = daysBetween(epoch, todayISO());
  const k = Math.floor((totalOffsetToToday - leadDay) / L);
  const anchorOffset = leadDay + k*L;
  const anchorDate = addDays(epoch, anchorOffset);

  return {cycleLength: L, anchorDate, confidence: best.R, dataPoints: dayNums.length};
}
function slugify(str){
  return str.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}

// Uses the browser's own local storage — works entirely on your device,
// with no dependency on Claude's servers, so it's reliable once this page
// is loaded as a real published link in Safari (not previewed in Claude).
function loadData(){
  try{
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state.entries = parsed.entries || [];
      state.cycleLength = parsed.cycleLength || 28;
      state.cycleAnchor = parsed.cycleAnchor || null;
      state.customSymptoms = parsed.customSymptoms || [];
      state.customMeds = parsed.customMeds || [];
      state.customDailyMeds = parsed.customDailyMeds || [];
      state.migraines = parsed.migraines || {};
      state.medClasses = parsed.medClasses || {};
      state.mCustomTriggers = parsed.mCustomTriggers || [];
      state.mLoc = parsed.mLoc || null;
    }
  }catch(e){
    storageAvailable = false;
    console.error('Storage unavailable:', e);
  }
  state.loaded = true;
  applySleepFromLink();
  render();
}

function saveData(){
  try{
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify({
      entries: state.entries,
      cycleLength: state.cycleLength,
      cycleAnchor: state.cycleAnchor,
      customSymptoms: state.customSymptoms,
      customMeds: state.customMeds,
      customDailyMeds: state.customDailyMeds,
      migraines: state.migraines,
      medClasses: state.medClasses,
      mCustomTriggers: state.mCustomTriggers,
      mLoc: state.mLoc
    }));
    storageAvailable = true;
    return true;
  }catch(e){
    storageAvailable = false;
    console.error('Storage error:', e);
    return false;
  }
}

function setView(v){
  state.view = v;
  render();
}
function toggleSymptom(id){
  if(state.form.symptoms.has(id)){
    state.form.symptoms.delete(id);
    delete state.form.severity[id];
    delete state.form.painLocation[id];
  } else {
    state.form.symptoms.add(id);
    state.form.noSymptoms = false;
  }
  render();
}
function setSeverity(id, level){
  if(state.form.severity[id] === level) delete state.form.severity[id];
  else state.form.severity[id] = level;
  render();
}
function toggleMed(id){
  if(state.form.meds.has(id)){ state.form.meds.delete(id); delete state.form.medTimes[id]; }
  else state.form.meds.add(id);
  render();
}
// Vyvanse tracking starts on VYVANSE_START. From then on, a day with no
// answer counts as taken; only an explicit saved "No" is recorded as missed.
// Days before the start stay blank unless you answer them yourself.
const VYVANSE_START = '2026-10-28';
function vyvanseStatus(date, saved){
  if(saved === 'yes' || saved === 'no') return saved;
  return date >= VYVANSE_START ? 'yes' : '';
}
function setVyvanse(val){
  state.form.vyvanse = state.form.vyvanse === val ? '' : val;
  render();
}
function setMedTiming(id, val){
  if(state.form.medTiming[id] === val) delete state.form.medTiming[id];
  else state.form.medTiming[id] = val;
  render();
}
function togglePainLocation(id, loc){
  const cur = state.form.painLocation[id] || [];
  const next = cur.includes(loc) ? cur.filter(x => x !== loc) : cur.concat(loc);
  if(next.length) state.form.painLocation[id] = next;
  else delete state.form.painLocation[id];
  render();
}
function setSleepQuality(q){
  state.form.sleepQuality = state.form.sleepQuality === q ? '' : q;
  render();
}
function toggleNoSymptomsForm(){
  const f = state.form;
  f.noSymptoms = !f.noSymptoms;
  if(f.noSymptoms){ f.symptoms.clear(); f.severity = {}; f.painLocation = {}; f.other = ''; }
  render();
}
// Splits a comma-separated field so multiple typed items each become
// their own separate, reusable option in the given list.
function resolveOtherItems(text, allItemsFn, customArray, palette){
  const labels = text.split(',').map(s => s.trim()).filter(Boolean);
  const ids = [];
  for(const label of labels){
    let id = slugify(label);
    if(!id) continue;
    const existing = allItemsFn().find(s => s.id === id || s.label.toLowerCase() === label.toLowerCase());
    if(existing){
      ids.push(existing.id);
      continue;
    }
    const color = palette[customArray.length % palette.length];
    customArray.push({id, label, color});
    ids.push(id);
  }
  return ids;
}
function resolveOtherSymptoms(text){
  return resolveOtherItems(text, allSymptoms, state.customSymptoms, CUSTOM_PALETTE);
}
function resolveOtherMeds(text){
  return resolveOtherItems(text, allMeds, state.customMeds, MEDS_CUSTOM_PALETTE);
}
function resolveOtherDailyMeds(text){
  return resolveOtherItems(text, allDailyMeds, state.customDailyMeds, MEDS_CUSTOM_PALETTE);
}

async function saveEntry(){
  const f = state.form;
  const otherSymptomIds = f.noSymptoms ? [] : resolveOtherSymptoms(f.other);
  const otherMedIds = resolveOtherMeds(f.otherMeds);
  const addedDaily = resolveOtherDailyMeds(f.otherDailyMeds);
  const symptomIds = Array.from(new Set([...Array.from(f.symptoms), ...otherSymptomIds]));
  const medIds = Array.from(new Set([...Array.from(f.meds), ...otherMedIds]));
  const sleepHours = parseSleepHours(f.sleepHours);
  const hasSomething = symptomIds.length || medIds.length || Object.keys(f.medTiming).length ||
    sleepHours !== null || f.sleepQuality || f.noSymptoms || f.vyvanse || f.notes.trim();
  if(!hasSomething){
    // Only a new daily-med option was typed — keep the option, nothing to log.
    if(addedDaily.length){ f.otherDailyMeds = ''; await saveData(); render(); }
    return;
  }

  const idx = state.entries.findIndex(e => e.date === f.date);
  const isEditingThis = state.editing === f.date;
  // Quick add to a day that's already logged (not an explicit edit) merges in.
  const existing = (idx >= 0 && !isEditingThis) ? state.entries[idx] : null;

  if(existing && f.noSymptoms && symptomIds.length === 0 && (existing.symptoms||[]).length > 0){
    if(!confirm('This day already has symptoms logged. Clear them and mark it as no symptoms?')) return;
  }
  const clearExistingSymptoms = !!(existing && f.noSymptoms && symptomIds.length === 0);

  let finalSymptoms, finalSeverity, finalPain;
  if(existing && !clearExistingSymptoms){
    finalSymptoms = Array.from(new Set([...(existing.symptoms||[]), ...symptomIds]));
    finalSeverity = {...(existing.severity||{}), ...f.severity};
    finalPain = {...(existing.painLocation||{}), ...f.painLocation};
  } else {
    finalSymptoms = symptomIds;
    finalSeverity = {...f.severity};
    finalPain = {...f.painLocation};
  }
  const finalMeds = existing ? Array.from(new Set([...(existing.meds||[]), ...medIds])) : medIds;
  const finalMedTiming = {...(existing ? existing.medTiming || {} : {}), ...f.medTiming};
  const finalMedTimes = {...(existing ? existing.medTimes || {} : {}), ...f.medTimes};
  const finalSleepHours = sleepHours !== null ? sleepHours : (existing && existing.sleepHours !== undefined ? existing.sleepHours : null);
  const finalSleepQuality = f.sleepQuality || (existing ? existing.sleepQuality || '' : '');
  let finalNoSymptoms;
  if(finalSymptoms.length > 0) finalNoSymptoms = false;
  else if(f.noSymptoms) finalNoSymptoms = true;
  else finalNoSymptoms = existing ? isSymptomFree(existing) : false;

  // Drop follow-up details for anything no longer on the entry.
  Object.keys(finalSeverity).forEach(id => { if(!finalSymptoms.includes(id)) delete finalSeverity[id]; });
  Object.keys(finalPain).forEach(id => { if(!finalSymptoms.includes(id) || !(finalPain[id]||[]).length) delete finalPain[id]; });
  Object.keys(finalMedTimes).forEach(id => { if(!finalMeds.includes(id) || !finalMedTimes[id]) delete finalMedTimes[id]; });

  const entry = {
    date: f.date,
    symptoms: finalSymptoms,
    meds: finalMeds,
    severity: finalSeverity,
    notes: f.notes.trim() || (existing ? existing.notes || '' : '')
  };
  if(Object.keys(finalPain).length) entry.painLocation = finalPain;
  if(Object.keys(finalMedTiming).length) entry.medTiming = finalMedTiming;
  if(Object.keys(finalMedTimes).length) entry.medTimes = finalMedTimes;
  if(finalSleepHours !== null) entry.sleepHours = finalSleepHours;
  if(finalSleepQuality) entry.sleepQuality = finalSleepQuality;
  if(finalNoSymptoms) entry.noSymptoms = true;
  const finalVyvanse = f.vyvanse || (existing ? existing.vyvanse || '' : '');
  if(finalVyvanse === 'no' || (finalVyvanse === 'yes' && f.date < VYVANSE_START)) entry.vyvanse = finalVyvanse;

  if(idx >= 0) state.entries[idx] = entry;
  else state.entries.push(entry);
  state.entries.sort((a,b) => a.date < b.date ? 1 : -1);

  const ok = await saveData();
  state.editing = null;
  state.sleepFromHealth = false;
  state.form = blankForm();
  if(ok){
    // A day with Migraine checked goes straight to the migraine questions.
    if(entry.symptoms.includes('migraine')){
      state.mFromHem = true;
      openMigraine(entry.date);
      return;
    }
    state.justSaved = true;
    render();
    setTimeout(() => { state.justSaved = false; render(); }, 1600);
  } else {
    state.justSaved = false;
    render();
    alert('Could not save on this device — check the storage warning above.');
  }
}

// How many days since the most recent logged entry — used for a gentle
// reminder nudge on the Log tab. null if nothing's been logged yet.
function daysSinceLastLog(){
  const logged = state.entries.filter(isLoggedEntry);
  if(logged.length === 0) return null;
  const mostRecent = [...logged].sort((a,b) => a.date < b.date ? 1 : -1)[0].date;
  return daysBetween(mostRecent, todayISO());
}

// For each item (symptom or med) logged 2+ times, lists every occurrence as
// its cycle day plus the month it happened in — lets the person visually
// compare whether something lands on the same or nearby cycle day across
// different months. `field` is 'symptoms' or 'meds'.
function computeCycleTimingRows(items, field){
  const rows = items.map(s => {
    const occ = state.entries
      .filter(e => (e[field]||[]).includes(s.id))
      .map(e => ({date: e.date, day: cycleDayFor(e.date)}))
      .sort((a,b) => a.day - b.day);
    return {symptom: s, occ};
  }).filter(r => r.occ.length >= 2);
  rows.sort((a,b) => b.occ.length - a.occ.length);
  return rows;
}

// Looks at a candidate date's cycle day and flags any symptom that has
// already shown up on that same cycle day 2+ times before (excluding the
// date itself) — surfaces a "this tends to happen around here" hint while
// logging, instead of making the person go check the Patterns tab.
function computeRecurrenceHints(dateISO){
  if(state.entries.length < 3) return [];
  const targetDay = cycleDayFor(dateISO);
  return allSymptoms()
    .map(s => {
      const n = state.entries.filter(e => e.date !== dateISO && (e.symptoms||[]).includes(s.id) && cycleDayFor(e.date) === targetDay).length;
      return {symptom: s, n};
    })
    .filter(h => h.n >= 2)
    .sort((a,b) => b.n - a.n);
}

// Counts how often each pair of symptoms was logged on the same day —
// surfaces combinations worth noticing without the person spotting them by eye.
function computeCooccurrence(rings){
  const ringIds = new Set(rings.map(r => r.id));
  const pairCounts = {};
  for(const e of state.entries){
    const syms = (e.symptoms||[]).filter(id => ringIds.has(id));
    for(let i=0;i<syms.length;i++){
      for(let j=i+1;j<syms.length;j++){
        const key = [syms[i],syms[j]].sort().join('|');
        pairCounts[key] = (pairCounts[key]||0)+1;
      }
    }
  }
  return pairCounts;
}

function tipsForSymptom(symptom){
  const hay = (symptom.id + ' ' + symptom.label).toLowerCase();
  return LIFESTYLE_TIPS.find(t => t.keys.some(k => hay.includes(k))) || null;
}

// Finds the cycle window where a symptom clusters (same logic as the
// insights cluster note, applied to any symptom).
function clusterWindow(dayIdxs, cycleLength){
  if(!dayIdxs || dayIdxs.length < 3) return null;
  const bucketSize = Math.max(1, Math.round(cycleLength/4));
  const bc = {};
  dayIdxs.forEach(d => { const b = Math.floor(d/bucketSize); bc[b] = (bc[b]||0)+1; });
  const [top, n] = Object.entries(bc).sort((a,b) => b[1]-a[1])[0];
  if(n / dayIdxs.length < 0.5) return null;
  const start = Number(top)*bucketSize + 1;
  return {start, end: Math.min(cycleLength, start + bucketSize - 1)};
}

// Ranks symptoms by prominence: each occurrence weighted by severity, with
// the last 30 days counting extra so the list reflects what's bothering you now.
function computeProminentSymptoms(rings){
  const sevW = {mild:1, moderate:1.5, severe:2};
  const recentCutoff = addDays(todayISO(), -30);
  const score = {}, n = {}, recent = {};
  for(const e of state.entries){
    (e.symptoms||[]).forEach(id => {
      const w = sevW[(e.severity||{})[id]] || 1;
      const isRecent = e.date >= recentCutoff;
      score[id] = (score[id]||0) + w * (isRecent ? 1.5 : 1);
      n[id] = (n[id]||0) + 1;
      if(isRecent) recent[id] = (recent[id]||0) + 1;
    });
  }
  return rings
    .filter(r => n[r.id])
    .map(r => ({symptom:r, score:score[r.id], n:n[r.id], recent:recent[r.id]||0}))
    .sort((a,b) => b.score - a.score);
}

function renderSuggestionsCard(rings, symptomDayIdxs, pairCounts, cycleLength){
  const ranked = computeProminentSymptoms(rings);
  const picks = [];
  const usedTitles = new Set();
  for(const p of ranked){
    const lib = tipsForSymptom(p.symptom);
    if(!lib || usedTitles.has(lib.title)) continue;
    usedTitles.add(lib.title);
    picks.push({...p, lib});
    if(picks.length === 3) break;
  }
  if(!picks.length){
    return `<div class="card"><span class="section-label">Things that may help</span>
      <p style="font-size:13px;color:var(--ink-soft);margin:0;">Once you log a few symptoms, suggestions for your most frequent ones will show up here.</p></div>`;
  }
  const labelById = {};
  rings.forEach(r => labelById[r.id] = r.label);

  const blocks = picks.map(p => {
    const id = p.symptom.id;
    const win = clusterWindow(symptomDayIdxs[id], cycleLength);
    let partner = null, best = 0;
    Object.entries(pairCounts).forEach(([k, c]) => {
      const [a, b] = k.split('|');
      if((a === id || b === id) && c >= 2 && c > best){ best = c; partner = labelById[a === id ? b : a]; }
    });
    const personal = [
      `Logged ${p.n} time${p.n===1?'':'s'}${p.recent ? `, ${p.recent} in the last 30 days` : ''}.`,
      win ? `Tends to show up around cycle days ${win.start}–${win.end}. Lean on these habits a few days before that window.` : '',
      partner ? `Often shows up with ${escapeHtml(partner)} (${best} days), so tips for one may help both.` : ''
    ].filter(Boolean).join(' ');
    return `
      <details class="tip-block">
        <summary>
          <span class="dot" style="background:${p.symptom.color}"></span>
          <span class="tip-title">${escapeHtml(p.symptom.label)}</span>
          <span class="tip-count">${p.n}×</span>
        </summary>
        <p class="tip-personal">${personal}</p>
        <ul class="tip-list">${p.lib.tips.map(t => `<li>${t}</li>`).join('')}</ul>
        <p class="tip-doc"><strong>Get checked if:</strong> ${p.lib.callDoc}</p>
      </details>`;
  }).join('');

  return `
    <div class="card">
      <span class="section-label">Things that may help</span>
      <p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 10px;">Your most prominent symptoms, weighted by severity and how recent. Tap one for habits that commonly ease it.</p>
      ${blocks}
      <p style="font-size:11.5px;color:var(--ink-soft);margin:10px 0 0;">General lifestyle guidance, not medical advice. Try one or two changes at a time and keep logging so you can see if they help.</p>
    </div>`;
}

function triggerDownload(content, filename, mimeType){
  const blob = new Blob([content], {type: mimeType});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

    rows.push([
      e.date,

      ({yes:'Yes', no:'No'})[vyvanseStatus(e.date, e.vyvanse)] || '',
      medsStr,
      medTimesStr,
      fmtSleep(e.sleepHours),
      (e.sleepHours === null || e.sleepHours === undefined) ? '' : e.sleepHours,
      e.sleepQuality || '',
      (e.notes||'').replace(/\n/g,' ')
    ]);
  }
  const csv = rows.map(r => r.map(f => '"' + String(f).replace(/"/g,'""') + '"').join(',')).join('\n');
  triggerDownload(csv, `hem-export-${todayISO()}.csv`, 'text/csv');
}

// ---------- Doctor report (PDF) ----------
// A clean, printable summary meant to be attached to a patient portal chart.
// Summary numbers first, then frequency tables, then the day-by-day log.
// Built on-device; nothing is uploaded anywhere.
let pdfLoader = null;
function loadScriptOnce(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('load failed: ' + src));
    document.head.appendChild(s);
  });
}
function loadPDF(){
  if(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API.autoTable) return Promise.resolve(window.jspdf.jsPDF);
  if(!pdfLoader){
    pdfLoader = loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
      .then(() => loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'))
      .then(() => window.jspdf.jsPDF)
      .catch(err => { pdfLoader = null; throw err; });
  }
  return pdfLoader;
}
// The built-in PDF font only covers basic Latin, so smart punctuation and
// emoji are swapped or dropped rather than printing as garbage.
function pdfText(str){
  return String(str == null ? '' : str)
    .replace(/[‘’]/g, "'").replace(/[“”]/g, '"')
    .replace(/[–—]/g, '-').replace(/…/g, '...')
    .replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/g, '');
}
function fmtDateLong(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}
// Labels that read as notes-to-self rather than symptoms or medications.
const REPORT_NOISE = /\b(fight|fought|argu|forgot|didn'?t take|did not take|skipped|no meds)\b/i;
const REPORT_ALWAYS_SHOW = /depress|feeling down|hopeless|suicid/i;
function isReportNoise(label){ return REPORT_NOISE.test(String(label)); }
function reportLabel(label){ const t = String(label||'').trim(); return t.charAt(0).toUpperCase() + t.slice(1); }
// Background details typed once in the Share card and printed near the top
// of the report. Stored only on this device (not in the app's code), so
// health details never end up in the public repo.
const DOCTOR_FIELDS = [
  {key:'hem-doctor-bc', label:'Current birth control', rows:1, placeholder:'e.g. Yaz, taken continuously, since 2024'},
  {key:'hem-doctor-meds', label:'Other daily medications', rows:3, placeholder:'One per line, e.g. Medication 100 mg (reason)'},
  {key:'hem-doctor-notes', label:'Also note', rows:2, placeholder:'e.g. Migraines never come with aura. No breakthrough bleeding or spotting.'}
];
function readDoctorField(key){ try{ return window.localStorage.getItem(key) || ''; }catch(e){ return ''; } }
const DOCTOR_RANGES = [
  {id:'30', label:'Last 30 days'},
  {id:'60', label:'Last 60 days'},
  {id:'90', label:'Last 90 days'},
  {id:'all', label:'All entries'}
];

function buildDoctorReportData(rangeId){
  const today = todayISO();
  const logged = state.entries.filter(isLoggedEntry);
  const firstLogged = logged.length ? [...logged].sort((a,b) => a.date < b.date ? -1 : 1)[0].date : today;
  const start = rangeId === 'all' ? firstLogged : addDays(today, -(Number(rangeId) - 1));
  const inRange = state.entries
    .filter(e => e.date >= start && e.date <= today)
    .sort((a,b) => a.date < b.date ? -1 : 1);
  const symptomMap = {}; allSymptoms().forEach(s => symptomMap[s.id] = reportLabel(s.label));
  const medMap = {}; allMeds().forEach(m => medMap[m.id] = reportLabel(m.label));
  const dailyMap = {}; allDailyMeds().forEach(m => dailyMap[m.id] = m.label);

  // Leave out entries that aren't really symptoms or meds (relationship
  // notes, "forgot to take…" reminders). They stay in the app, just not
  // in a report headed for a medical chart.
  const keepSym = id => !isReportNoise(symptomMap[id] || id);
  const keepMed = id => !isReportNoise(medMap[id] || id);
  const days = inRange.filter(isLoggedEntry).map(e => ({
    ...e,
    symptoms: (e.symptoms||[]).filter(keepSym),
    meds: (e.meds||[]).filter(keepMed)
  }));

  const symptomDays = days.filter(e => (e.symptoms||[]).length > 0);
  const freeDays = days.filter(isSymptomFree);
  const sleepVals = inRange.map(e => e.sleepHours).filter(h => h !== null && h !== undefined && h !== '' && !isNaN(Number(h))).map(Number);
  const avgSleep = sleepVals.length ? sleepVals.reduce((a,b) => a+b, 0) / sleepVals.length : null;
  const poorSleep = days.filter(e => e.sleepQuality === 'poor').length;

  // Symptom frequency with severity split and cycle clustering.
  const sym = {};
  for(const e of days){
    (e.symptoms||[]).forEach(id => {
      const s = sym[id] = sym[id] || {id, n:0, mild:0, moderate:0, severe:0, last:'', dayIdxs:[]};
      s.n++;
      const lvl = (e.severity||{})[id];
      if(lvl) s[lvl]++;
      if(e.date > s.last) s.last = e.date;
      s.dayIdxs.push(cycleDayFor(e.date) - 1);
    });
  }
  // Symptoms on fewer than 10% of logged days collapse into one "also
  // logged" line, except mood changes, which matter for a birth control
  // question even when rare.
  const sortedSym = Object.values(sym).sort((a,b) => b.n - a.n);
  const isMajor = s => days.length && (s.n / days.length >= 0.10 || REPORT_ALWAYS_SHOW.test(symptomMap[s.id] || s.id));
  const minorSym = sortedSym.filter(s => !isMajor(s));
  const minorLine = minorSym.length ? (() => {
    const ns = minorSym.map(s => s.n);
    const lo = Math.min(...ns), hi = Math.max(...ns);
    const range = lo === hi ? `${lo} time${lo===1?'':'s'}` : `${lo}-${hi} times`;
    return `Also logged ${range}: ` + minorSym.map(s => (symptomMap[s.id] || s.id).toLowerCase()).join(', ') + '.';
  })() : '';
  // Month-by-month counts for the main symptoms, so a doctor can see
  // whether things are getting better or worse. Days logged per month is
  // shown first so a partial month isn't misread as improvement.
  const months = [...new Set(days.map(e => e.date.slice(0,7)))].sort().slice(-4);
  const monthLabel = ym => { const [yy,mm] = ym.split('-').map(Number); return new Date(yy, mm-1, 1).toLocaleDateString('en-US', {month:'short'}); };
  const trend = months.length >= 2 ? {
    labels: months.map(monthLabel),
    logged: months.map(ym => days.filter(e => e.date.startsWith(ym)).length),
    counts: id => months.map(ym => String(days.filter(e => e.date.startsWith(ym) && (e.symptoms||[]).includes(id)).length))
  } : null;
  const symptomRows = sortedSym.filter(isMajor).map(s => {
    const win = clusterWindow(s.dayIdxs, state.cycleLength);
    const sev = [s.severe ? `${s.severe} severe` : '', s.moderate ? `${s.moderate} moderate` : '', s.mild ? `${s.mild} mild` : ''].filter(Boolean).join(', ');
    return [
      symptomMap[s.id] || s.id,
      String(s.n),
      days.length ? Math.round(s.n / days.length * 100) + '%' : '',
      sev || 'Not rated',
      win ? `Days ${win.start}-${win.end}` : '',
      ...(trend ? trend.counts(s.id) : []),
      fmtDateLong(s.last)
    ];
  });

  // As-needed meds.
  const med = {};
  for(const e of days){
    (e.meds||[]).forEach(id => {
      const m = med[id] = med[id] || {id, n:0, last:''};
      m.n++;
      if(e.date > m.last) m.last = e.date;
    });
  }
  const medRows = Object.values(med).sort((a,b) => b.n - a.n)
    .map(m => [medMap[m.id] || m.id, String(m.n), fmtDateLong(m.last)]);

  // Daily meds: only days with an answer count; blank is unknown, not missed.
  const daily = {};
  for(const e of days){
    Object.entries(e.medTiming||{}).forEach(([id, val]) => {
      if(!val) return;
      const d = daily[id] = daily[id] || {id, answered:0, missed:0, late:0};
      d.answered++;
      if(val === 'missed') d.missed++;
      else if(val !== 'normal') d.late++;
    });
  }
  const dailyRows = Object.values(daily).map(d => [
    dailyMap[d.id] || d.id,
    String(d.answered),
    String(d.answered - d.missed - d.late),
    String(d.late),
    String(d.missed)
  ]);

  // Symptom pairs logged on the same day, 2+ times.
  const pairs = {};
  for(const e of days){
    const s = e.symptoms || [];
    for(let i=0;i<s.length;i++) for(let j=i+1;j<s.length;j++){
      const k = [s[i], s[j]].sort().join('|');
      pairs[k] = (pairs[k]||0) + 1;
    }
  }
  const pairLines = Object.entries(pairs).filter(([,n]) => n >= 2).sort((a,b) => b[1]-a[1]).slice(0,5)
    .map(([k,n]) => { const [a,b] = k.split('|'); return `${symptomMap[a]||a} + ${symptomMap[b]||b} (${n} days)`; });

  // Day-by-day log: only days with something to read (symptoms, notes,
  // as-needed meds or an off-schedule daily med). Quiet days are already
  // counted in the summary, so listing them just adds pages.
  const logDays = days.filter(e =>
    (e.symptoms||[]).length > 0 || (e.notes||'').trim() || (e.meds||[]).length > 0 ||
    Object.values(e.medTiming||{}).some(v => v && v !== 'normal'));
  const logRows = [...logDays].reverse().map(e => {
    const symptoms = isSymptomFree(e) ? 'No symptoms' : (e.symptoms||[]).map(id => {
      const lvl = (e.severity||{})[id];
      const loc = painLabels((e.painLocation||{})[id]);
      return (symptomMap[id] || id) + (lvl ? ` (${lvl})` : '') + (loc.length ? ` [${loc.join(', ')}]` : '');
    }).join('\n');
    const meds = (e.meds||[]).map(id => (medMap[id] || id) + ((e.medTimes||{})[id] ? ` ${fmtTime(e.medTimes[id])}` : ''));
    Object.entries(e.medTiming||{}).forEach(([id, val]) => {
      if(val && val !== 'normal') meds.push(`${dailyMap[id] || id}: ${timingLabel(val).toLowerCase()}`);
    });
    const sleep = [fmtSleep(e.sleepHours), e.sleepQuality].filter(Boolean).join(', ');
    return [
      `${fmtWeekday(e.date)} ${fmtDateLong(e.date)}`,
      String(cycleDayFor(e.date)),
      symptoms,
      meds.join('\n'),
      sleep,
      (e.notes||'').trim()
    ];
  });

  return {
    start, end: today, rangeLabel: (DOCTOR_RANGES.find(r => r.id === rangeId)||{}).label || '',
    daysLogged: days.length, symptomDays: symptomDays.length, freeDays: freeDays.length,
    avgSleep, sleepNights: sleepVals.length, poorSleep,
    symptomRows, minorLine, trend, medRows, dailyRows, pairLines, logRows
  };
}

// Drops any column (other than the first) that is blank in every row,
// so the report never shows an empty column that looks unfinished.
function compactTable(head, body, columnStyles){
  const keep = head.map((_, i) => i).filter(i => i === 0 || body.some(r => String(r[i]||'').trim()));
  const styles = {};
  keep.forEach((orig, idx) => { if(columnStyles && columnStyles[orig]) styles[idx] = columnStyles[orig]; });
  return { head: [keep.map(i => head[i])], body: body.map(r => keep.map(i => r[i])), columnStyles: styles, kept: keep };
}

async function exportDoctorReport(){
  const btn = document.getElementById('export-doctor-btn');
  const rangeSel = document.getElementById('doctor-range');
  const rangeId = rangeSel ? rangeSel.value : '90';
  const reasonEl = document.getElementById('doctor-reason');
  const reason = reasonEl ? reasonEl.value.trim() : '';
  const logEl = document.getElementById('doctor-include-log');
  const includeLog = !!(logEl && logEl.checked);
  try{
    window.localStorage.setItem('hem-doctor-range', rangeId);
    window.localStorage.setItem('hem-doctor-reason', reason);
    window.localStorage.setItem('hem-doctor-log', includeLog ? '1' : '0');
  }catch(e){}
  const data = buildDoctorReportData(rangeId);
  if(!data.daysLogged){ alert('No logged days in that range. Try a longer range.'); return; }

  if(btn){ btn.disabled = true; btn.textContent = 'Building PDF...'; }
  let jsPDF;
  try{ jsPDF = await loadPDF(); }
  catch(e){
    alert("Couldn't load the PDF tool. Check your connection and try again.");
    if(btn){ btn.disabled = false; btn.textContent = 'Create doctor report (PDF)'; }
    return;
  }

  const doc = new jsPDF({unit:'pt', format:'letter'});
  const W = doc.internal.pageSize.getWidth();
  const M = 48;
  const ink = [43,40,34], soft = [107,101,88], plum = [107,76,107], line = [221,214,200];
  let y = M;

  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(...ink);
  doc.text('Symptom Tracking Summary', M, y);
  y += 18;
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...soft);
  doc.text(pdfText(`${fmtDateLong(data.start)} - ${fmtDateLong(data.end)}  (${data.rangeLabel})  |  Generated ${fmtDateLong(todayISO())}`), M, y);
  y += 10;
  doc.setDrawColor(...line); doc.setLineWidth(0.75); doc.line(M, y, W - M, y);
  y += 20;

  // Short intro so a doctor knows what they're looking at.
  const intro = "I built this tracker to log symptoms I suspect are hormonal, so I could bring you specific, dated patterns instead of a vague complaint. Everything below is self-reported and was logged day by day.";
  doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(...ink);
  const introLines = doc.splitTextToSize(pdfText(intro), W - 2*M);
  doc.text(introLines, M, y);
  y += introLines.length * 13.5 + 10;

  if(reason){
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
    const lines = doc.splitTextToSize(pdfText(reason), W - 2*M - 24);
    const boxH = 30 + lines.length * 13;
    doc.setFillColor(243,237,243); doc.roundedRect(M, y, W - 2*M, boxH, 5, 5, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...plum);
    doc.text('REASON FOR SHARING', M + 12, y + 16);
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(...ink);
    doc.text(lines, M + 12, y + 31);
    y += boxH + 14;
  }

  const background = DOCTOR_FIELDS.map(fd => [fd.label, readDoctorField(fd.key).trim()]).filter(([,v]) => v);
  if(background.length){
    doc.autoTable({
      startY: y, margin:{left:M, right:M}, theme:'plain',
      body: background.map(([k,v]) => [pdfText(k), pdfText(v)]),
      styles:{font:'helvetica', fontSize:10, textColor:ink, cellPadding:{top:3,bottom:3,left:0,right:6}, valign:'top'},
      columnStyles:{0:{cellWidth:140, fontStyle:'bold', textColor:soft}}
    });
    y = doc.lastAutoTable.finalY + 14;
  }

  // Summary tiles
  const tiles = [
    ['Days logged', String(data.daysLogged)],
    ['Days with symptoms', String(data.symptomDays)],
    ['Symptom-free days', String(data.freeDays)],
    ['Avg sleep', data.avgSleep !== null ? fmtSleep(Math.round(data.avgSleep*100)/100) : '-']
  ];
  const tileW = (W - 2*M - 3*10) / 4;
  tiles.forEach(([label, val], i) => {
    const x = M + i*(tileW + 10);
    doc.setFillColor(246,243,236); doc.roundedRect(x, y, tileW, 46, 5, 5, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(...ink);
    doc.text(val, x + 10, y + 21);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...soft);
    doc.text(label, x + 10, y + 36);
  });
  y += 58;
  doc.setFontSize(9); doc.setTextColor(...soft);
  const usesCycle = includeLog || data.symptomRows.some(r => r[4]);
  const metaBits = usesCycle ? [`Est. cycle days assume a ${state.cycleLength}-day cycle counted from ${fmtDateLong(getAnchorDate())}; they are estimates, not period dates.`] : [];
  if(data.sleepNights) metaBits.push(`Sleep recorded on ${data.sleepNights} nights${data.poorSleep ? `; ${data.poorSleep} rated poor` : ''}.`);
  if(metaBits.length){
    doc.text(doc.splitTextToSize(pdfText(metaBits.join(' ')), W - 2*M), M, y);
    y += 22;
  } else { y += 4; }

  const heading = (t) => {
    if(y > doc.internal.pageSize.getHeight() - 75){ doc.addPage(); y = M; }
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...plum);
    doc.text(t, M, y); y += 8;
  };
  const tableStyle = {
    margin: {left:M, right:M},
    styles: {font:'helvetica', fontSize:9, textColor:ink, cellPadding:4, lineColor:line, lineWidth:0.5, valign:'top', overflow:'linebreak'},
    headStyles: {fillColor:[239,234,224], textColor:ink, fontStyle:'bold'},
    alternateRowStyles: {fillColor:[251,249,244]},
    theme: 'grid'
  };
  const after = () => { y = doc.lastAutoTable.finalY + 22; };
  const clean = rows => rows.map(r => r.map(pdfText));

  heading('Symptoms');
  if(data.symptomRows.length){
    const monthCols = data.trend ? data.trend.labels : [];
    const cs = {0:{cellWidth:120,fontStyle:'bold'}, 1:{halign:'center',cellWidth:34}, 2:{halign:'center',cellWidth:44}};
    monthCols.forEach((_, k) => cs[5+k] = {halign:'center', cellWidth:34, fillColor:[246,241,246]});
    const t = compactTable(['Symptom','Days','% of days','Severity','Clusters (est. cycle days)', ...monthCols, 'Most recent'],
      clean(data.symptomRows), cs);
    doc.autoTable({...tableStyle, startY: y, head: t.head, body: t.body, columnStyles: t.columnStyles});
    after();
  }
  const tableNotes = [];
  if(data.trend && data.symptomRows.length) tableNotes.push('Shaded columns are days with each symptom per month (days logged: ' + data.trend.labels.map((l,k) => `${l} ${data.trend.logged[k]}`).join(', ') + ').');
  if(data.minorLine) tableNotes.push(data.minorLine);
  if(tableNotes.length){
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...soft);
    const nl = doc.splitTextToSize(pdfText(tableNotes.join(' ')), W - 2*M);
    doc.text(nl, M, y - 8);
    y += (nl.length - 1) * 11 + 14;
  }
  if(!data.symptomRows.length && !data.minorLine){ doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...soft); doc.text('No symptoms logged in this range.', M, y + 8); y += 30; }


  if(data.medRows.length){
    heading('As-needed medications');
    doc.autoTable({...tableStyle, startY: y,
      head: [['Medication','Days taken','Most recent']],
      body: clean(data.medRows),
      columnStyles: {0:{fontStyle:'bold'}, 1:{halign:'center'}}
    });
    after();
  }

  // Daily meds (Yaz) are left out: they're only recorded on some days, so a
  // count here would read as how often she took it, which isn't true.

  if(data.pairLines.length){
    heading('Symptoms logged together');
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...ink);
    const pl = doc.splitTextToSize(pdfText(data.pairLines.join('; ') + '.'), W - 2*M);
    doc.text(pl, M, y + 6);
    y += pl.length * 13 + 16;
  }

  if(includeLog && data.logRows.length){
    heading('Daily log: days with symptoms, meds or notes (most recent first)');
    const t = compactTable(['Date','Est. cycle day','Symptoms','Meds','Sleep','Notes'],
      clean(data.logRows),
      {0:{cellWidth:82}, 1:{halign:'center',cellWidth:44}, 2:{cellWidth:130}, 3:{cellWidth:86}, 4:{cellWidth:52}});
    doc.autoTable({...tableStyle, startY: y, head: t.head, body: t.body, columnStyles: t.columnStyles,
      styles: {...tableStyle.styles, fontSize:8.5}, showHead: 'everyPage'});
  }

  // Footer on every page
  const pages = doc.internal.getNumberOfPages();
  for(let i = 1; i <= pages; i++){
    doc.setPage(i);
    const H = doc.internal.pageSize.getHeight();
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...soft);
    doc.text('Self-reported symptom log. Counts and patterns are descriptive, not a diagnosis.', M, H - 24);
    doc.text(`Page ${i} of ${pages}`, W - M, H - 24, {align:'right'});
  }

  const filename = `Symptom-Summary-${data.start}-to-${data.end}.pdf`;
  const blob = doc.output('blob');
  let shared = false;
  try{
    const file = new File([blob], filename, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Symptom summary'});
      shared = true;
    }
  }catch(e){
    if(e && e.name === 'AbortError') shared = true; // closed the share sheet
  }
  if(!shared){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  if(btn){ btn.disabled = false; btn.textContent = 'Create doctor report (PDF)'; }
}

    withLog = window.localStorage.getItem('hem-doctor-log') === '1';
